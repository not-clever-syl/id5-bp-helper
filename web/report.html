<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BP 教练报告</title>
<link rel="stylesheet" href="char.css">
<style>
:root{
  --bg:#14161c;--panel:#1b1e26;--panel2:#21252f;--border:#2e3340;
  --text:#dfe5f0;--dim:#8b94a8;--accent:#6b8cff;--warn:#e0a35a;
  --danger:#d4645c;--good:#4fa88a;--ban:#8a5a9e;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  overflow-x:hidden;
  font:13.5px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
header{padding:14px 26px;border-bottom:1px solid var(--border);
  background:var(--panel);position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header .hd{min-width:0}
header h1{margin:0;font-size:16px;font-weight:600}
header .sub{color:var(--dim);font-size:12px;margin-top:2px}
/* 「← 首页」统一固定在页首最左，作为所有页面的唯一回退入口 */
a.home{color:var(--dim);text-decoration:none;font-weight:400;font-size:12.5px;
  flex:none;padding:4px 10px;border-radius:6px;border:1px solid var(--border)}
a.home:hover{color:var(--text);border-color:var(--accent)}
main{width:100%;margin:0 auto;padding:16px 26px 90px}
.sel{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.sel label{color:var(--dim);font-size:12px}
select{background:var(--panel2);color:var(--text);border:1px solid var(--border);
  border-radius:7px;padding:7px 11px;font-size:12.5px;min-width:150px;
  max-width:100%}
select:hover{border-color:var(--accent)}
button{background:var(--panel2);color:var(--text);border:1px solid var(--border);
  border-radius:7px;padding:6px 12px;font-size:12.5px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:#2a3f6e;border-color:var(--accent);color:#cfe0ff}
.io{font-size:11.5px;color:var(--dim);margin-left:4px}
.io.ok{color:var(--good)} .io.err{color:var(--danger)}
a.genlink{color:#cfe0ff;text-decoration:none;font-size:12.5px;
  border:1px solid var(--accent);background:#2a3f6e;border-radius:7px;padding:6px 12px}
a.genlink:hover{background:#33518c}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:14px 18px;margin-bottom:14px;min-width:0}
.card h2{margin:0 0 4px;font-size:14.5px;font-weight:600;
  display:flex;align-items:center;gap:9px}
.card h2 .num{width:24px;height:24px;border-radius:50%;background:var(--accent);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:600;flex:none}
.card .lead{color:var(--dim);font-size:12px;margin:0 0 10px 33px}
.verdict{background:var(--panel2);border-left:3px solid var(--accent);
  border-radius:0 8px 8px 0;padding:10px 14px;margin:10px 0 0;font-size:12.5px}
.verdict.warn{border-left-color:var(--warn)}
.verdict.good{border-left-color:var(--good)}
.verdict.bad{border-left-color:var(--danger)}
.verdict b{color:#fff}
.tablewrap{width:100%;overflow-x:hidden}
table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:12.5px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.055);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
th{color:var(--dim);font-weight:500;font-size:11px}
/* 窄屏时表格内容会被截断，鼠标悬停看全 */
td[title]{cursor:help}
tr:last-child td{border-bottom:none}
tr.hl td{background:rgba(107,140,255,.10)}
tr.hl td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tr.click{cursor:pointer}
tr.click:hover td{background:rgba(255,255,255,.035)}
.num{text-align:right;font-variant-numeric:tabular-nums;
  font-family:Consolas,monospace}
.dim{color:var(--dim)}
.good{color:var(--good)}.warn{color:var(--warn)}.danger{color:var(--danger)}
.pill{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:8px;
  background:var(--panel2);border:1px solid var(--border);margin-right:4px}
.pill.ban{border-color:var(--ban);color:#c9a0dd}
.pill.pick{border-color:var(--accent);color:#cfe0ff}
.pill.only{border-color:var(--good);color:#9fd8c4}
.flow{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.step{background:var(--panel2);border:1px solid var(--border);border-radius:8px;
  padding:6px 10px;font-size:12px}
.step .s1{color:var(--dim);font-size:10.5px;margin-bottom:3px}
.step.ban{border-color:#5a3d68}
.step.pick{border-color:#35507e}
.lineup{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.meta{color:var(--dim);font-size:11.5px;margin-top:6px}
/* 「本次生成用的设置」：左右两栏的键值表 */
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:4px 22px}
.two .kv{display:flex;gap:12px;align-items:flex-start;padding:4px 0;
  border-bottom:1px solid rgba(255,255,255,.04)}
.two .kv .k{color:var(--dim);font-size:12px;flex:none;width:96px}
.two .kv .v{font-size:12px;min-width:0;word-break:break-word}
.two .kv .v code{background:var(--panel2);padding:1px 5px;border-radius:4px;
  font:11px Consolas,monospace}
.empty{color:var(--dim);padding:40px 0;text-align:center}
footer{color:var(--dim);font-size:11px;margin:0 auto;
  padding:0 26px 50px;line-height:1.9}
footer b{color:var(--text)}
/* 监管集合的组合按钮 */
.sets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.sets button{background:var(--panel2);color:var(--dim);border:1px solid var(--border);
  border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px}
.sets button:hover{border-color:var(--accent);color:var(--text)}
.sets button.on{background:#2a3f6e;border-color:var(--accent);color:#cfe0ff}
.sets button .cnt{font:10px Consolas,monospace;color:var(--dim)}
/* 监管倾向排名：紧凑列表；块内单列，宽屏时左右两块并排 */
.rank{margin-top:6px;display:flex;flex-direction:column;gap:0}
/* ① 段的两块排名：左=地图倾向，右=这组 ban 的指向排名 */
.rankcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));
  gap:22px 34px;margin-top:16px;align-items:start}
.rankcols .rank{display:grid;grid-template-columns:1fr}
.rankcols .col{min-width:0}
.rank .rk{display:flex;align-items:center;gap:8px;padding:5px 8px;
  border-radius:6px;border-left:2px solid transparent;line-height:1.6}
.rank .rk:hover{background:rgba(255,255,255,.03)}
.rank .rk.top{border-left-color:var(--accent);background:rgba(107,140,255,.10)}
.rank .rk .i{flex:none;width:16px;color:var(--dim);
  font:11px Consolas,monospace;text-align:right}
.rank .rk.top .i{color:var(--accent);font-weight:600}
.rank .rk .who{flex:none;width:96px;display:flex;align-items:center;gap:5px;
  font-size:12.5px;overflow:hidden;white-space:nowrap}
.rank .rk .who span{overflow:hidden;text-overflow:ellipsis}
.rank .rk .bar{flex:1;min-width:48px;height:8px;border-radius:4px;
  background:var(--panel2);overflow:hidden}
.rank .rk .bar i{display:block;height:100%;border-radius:4px;
  background:linear-gradient(90deg,#3c5aa8,#6b8cff)}
.rank .rk.top .bar i{background:linear-gradient(90deg,#4a6fd0,#8ea8ff)}
.rank .rk .pct{flex:none;width:40px;text-align:right;
  font:12px Consolas,monospace}
.rank .rk .val{flex:none;width:42px;text-align:right;color:var(--dim);
  font:11px Consolas,monospace}
/* ① 段里的地图区块：块标题与说明 */
.rankcols .col > .meta{margin:0 0 6px;line-height:1.6}
.rankcols .col > .meta b{color:var(--text)}
/* ── ⑤ 博弈树：每层一排备选，展开的分支向下缩进 ── */
.tbar{color:var(--dim);font-size:12px;margin:2px 0 10px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tbar.warn{color:var(--warn)}
button.mini{background:transparent;border:1px solid var(--border);color:var(--dim);
  border-radius:6px;padding:2px 9px;font-size:11.5px;cursor:pointer}
button.mini:hover{border-color:var(--accent);color:var(--text)}
.tree{position:relative}
.tblock{margin:0}
.tlayer{margin:10px 0 5px}
.tlayer .tl{color:var(--dim);font-size:11.5px;letter-spacing:.02em}
.tlayer .tl b{color:var(--text);font-weight:500}
.tgrid{display:flex;flex-wrap:wrap;gap:6px}
.tn{display:flex;align-items:center;gap:8px;padding:5px 10px;margin-bottom:3px;
  border-radius:7px;background:var(--panel2);border:1px solid var(--border);
  cursor:pointer;font-size:12.5px;transition:border-color .12s,background .12s}
.tn:hover{border-color:var(--accent);background:#252a36}
.tn.ban{border-left:3px solid var(--ban)}
.tn.pick{border-left:3px solid var(--accent)}
.tn.main{border-color:var(--accent);background:#2a3f6e;color:#cfe0ff}
.tn.leaf{cursor:default}
.tn.leaf:hover{border-color:var(--border);background:var(--panel2)}
.tn .st{flex:none;width:18px;color:var(--dim);font:11px Consolas,monospace}
.tn .ch{flex:none;width:100px;display:flex;align-items:center;gap:5px;
  font-weight:600;overflow:hidden;white-space:nowrap}
.tn .ch span{overflow:hidden;text-overflow:ellipsis}
.tn .vv{flex:none;width:44px;text-align:right;
  font:12.5px Consolas,monospace}
.tn .dv{flex:none;width:38px;text-align:right;font:11px Consolas,monospace}
.tn .dv.good{color:var(--good)}
.tn .dv.danger{color:var(--danger)}
.tn .tg{margin-left:auto;color:var(--dim);font-size:11px;flex:none}
.tn.main .tg{color:var(--accent)}
/* 展开后的分支：左侧一条竖线 + 一行「选了谁」 */
.tkid{margin:4px 0 2px 14px;padding-left:14px;
  border-left:1px solid var(--border)}
.tsel{color:var(--dim);font-size:11.5px;margin:2px 0 0;
  display:flex;align-items:center;gap:5px}
.tsel b{color:var(--text);font-weight:500}
.tmore{margin:2px 0 8px}
.tend{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;
  padding:8px 12px;border-radius:8px;background:var(--panel2);
  border-left:3px solid var(--good);font-size:12.5px}
.tend b{font:13px Consolas,monospace;color:#fff}
</style>
</head>
<body>
<header>
  <a href="index.html" class="home">← 首页</a>
  <div class="hd">
    <h1>BP 教练报告</h1>
    <div class="sub" id="sub">加载中…</div>
  </div>
</header>

<main>
  <div class="sel">
    <label>报告</label>
    <span style="margin-left:auto;display:flex;gap:6px;align-items:center">
      <a class="genlink" href="generate.html">生成新报告 →</a>
      <button id="impBtn">导入报告</button>
      <span id="ioMsg" class="io"></span>
    </span>
  </div>

  <div id="body"><div class="empty">正在读取数据…</div></div>
</main>

<footer>
  <b>读法</b>：数值单位是「局均逃脱」，2.00 为平局线；经「最低 3 人」聚合后系统性偏低，
  只用于同一对手下的相对比较，不代表真实逃脱人数。<br>
  <b>结构项</b>：无救人位 −0.45、救人位超过 1 个每多 1 个 −1.20、无牵制型 −0.30。<br>
  <b>常规性</b>：救人位 ≥2 或无任何辅位 → 不常规；无救人位 / 无牵制型 / 无破译型 → 接近常规；
  全部满足 → 常规。该判定只作提示，不计入评估值。<br>
  <b>数据来源</b>：导入 <code>data/reports/</code> 里的报告文件；
  报告页只支持导入，不做导出、不维护索引。
</footer>

<script src="char.js"></script>
<script src="filemodal.js"></script>
<script>
const $ = s => document.querySelector(s);
let REP = null;        // 当前报告

/** 分数统一显示两位小数 */
const f2 = v => (v == null || !isFinite(v)) ? '—' : Number(v).toFixed(2);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
                                .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function regCls(v) {
  return v === '常规' ? 'good' : v === '接近常规' ? 'warn' : 'danger';
}

/** 报告页进来就显示最新的一份；也可以用 ?file=<文件名> 指定某一份。
 *
 *  从生成页跳过来时带 ?file=<文件名>，直接读那一份出来显示 ——
 *  相当于「刚生成的报告自动打开」。
 *  没带参数时按生成时间取 data/reports/ 里最新的一份。
 */
async function boot() {
  $('#body').innerHTML = `<div class="empty">
    还没有载入报告。<br>
    点右上角「导入报告」，从 <code>data/reports/</code> 里挑一份；<br>
    或者去 <a class="genlink" href="generate.html">生成页</a> 现算一份。
  </div>`;
  $('#sub').textContent = '导入一份报告查看';

  const q = new URLSearchParams(location.search);
  let file = q.get('file');
  let autoPicked = false;
  if (!file) {
    // 没指定就看最新的那份：列表接口在 meta=1 时按生成时间倒序。
    try {
      const r = await fetch('/api/files/list?kind=import&dir='
        + encodeURIComponent('data/reports') + '&meta=1');
      if (r.ok) {
        const j = await r.json();
        const first = (j.files || [])[0];
        if (first) { file = first.name; autoPicked = true; }
      }
    } catch (e) { /* 拿不到就停在空状态 */ }
  }
  if (!file) return;
  try {
    const r = await fetch('/api/files/read', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: 'data/reports/' + file }),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const d = j.data;
    const rep = Array.isArray(d) ? d[0] : (d && d.meta ? d : (d.reports || [])[0]);
    if (!rep) throw new Error('文件里没有报告');
    showReport(rep);
    setIo(autoPicked ? `已自动打开最新一份：${file}` : '已打开刚生成的报告', 'ok');
  } catch (e) {
    setIo('打开失败：' + e.message, 'err');
  }
}

// ── 导入 ──
const setIo = (t, cls) => {
  const el = $('#ioMsg');
  el.textContent = t;
  el.className = 'io ' + (cls || '');
};

/* 报告页只支持导入：从 data/reports/ 里挑一份读进来直接渲染。
 * 不做导出、不维护索引 —— 报告本身就是独立文件。 */
$('#impBtn').onclick = () => {
  FileModal.pick({
    title: '导入报告',
    dir: 'data/reports',
    table: true,
    onPick: obj => {
      // 兼容三种输入：单份报告、报告数组、旧的索引结构
      const incoming = Array.isArray(obj) ? obj
        : Array.isArray(obj.reports) ? obj.reports
        : obj && obj.meta ? [obj] : null;
      if (!incoming || !incoming.length) {
        setIo('导入失败：文件里没有报告数据', 'err');
        return;
      }
      const bad = incoming.filter(r => !r.meta || !r.meta.team
        || !r.meta.player || !r.meta.game);
      if (bad.length) {
        setIo(`导入失败：${bad.length} 份报告缺少 meta（team/player/game）`, 'err');
        return;
      }
      // 新结构是「以对手 ban 组合为轴」，老结构只有 sets/plans，页面渲染不了
      const old = incoming.filter(r => !(r.combos || (r.summary || {}).sections));
      if (old.length && old.length === incoming.length) {
        setIo('导入失败：这些报告是旧结构（按监管假设组织），'
          + '页面现在按「对手 ban 组合」渲染，请重新生成', 'err');
        return;
      }
      showReport(incoming[0]);
      setIo(incoming.length > 1
        ? `已导入 ${incoming.length} 份，显示其中一份`
        : '已导入', 'ok');
    },
  });
};

function showReport(rep) {
  REP = rep;
  const m = REP.meta;
  $('#sub').innerHTML =
    `${esc(m.season)} · ${esc(m.team)}（求生） vs ${esc(m.player)}（监管） · 第 ${m.game} 局 · `
    + `生成于 ${esc(m.generated_at)} · 我方 ban 名额 ${m.ban_quota ?? 0}`;
  render();
}

// ══════════════════════════════════════════════════════════════
// 报告正文：四段 + 对位情报卡，顺序与教练看报告的思路一致
//   ① 对手前两个 ban 位（用户选）  ② 我方应 ban 哪几个
//   ③ 我方前两手    ④ 后面博弈树怎么选
//
// 新结构（bp_combo_report）：以「对手 ban 组合」为轴，
// 每个 combo 自带完整的 ②③④；②③ 跟着当前选择走。
// ══════════════════════════════════════════════════════════════
const chips = arr => (arr || []).map(c => Char.chip(c, {size: 25})).join(' ')
  || '<span class="dim">—</span>';
const bansHtml = arr => (arr || []).map(c =>
  `<span class="pill ban">${Char.icon(c, 19)}${esc(c)}</span>`).join('')
  || '<span class="dim">不 ban</span>';

/** 逐手路线：ban 紫、选人蓝 */
function flowOf(line) {
  if (!(line || []).length) return '<span class="dim">没有逐手数据</span>';
  return '<div class="flow">' + line.map(x => {
    const isBan = (x.name || '').includes('ban');
    return `<div class="step ${isBan ? 'ban' : 'pick'}">
      <div class="s1">${esc(x.stage)} ${esc(x.name)}</div>
      ${Char.chip(x.char, {size: 20})}
      <div class="s1" style="margin:3px 0 0">${f2(x.value)}</div></div>`;
  }).join('') + '</div>';
}

function card(num, title, lead, inner) {
  return `<div class="card">
    <h2><span class="num">${num}</span>${title}</h2>
    ${lead ? `<p class="lead">${lead}</p>` : ''}
    ${inner}
  </div>`;
}

function render() {
  if (REP.combos || (REP.summary || {}).sections) return renderNew();
  $('#body').innerHTML = '<div class="empty">这份报告没有任何可显示的段落。</div>';
}

/** 当前选中的 ban 组合下标 */
let COMBO = 0;

function renderNew() {
  const m = REP.meta;
  const combos = REP.combos || [];  if (!combos.length) {
    $('#body').innerHTML = settingsCard()
      + '<div class="card"><div class="verdict warn">这份报告没有可用的 ban 组合。</div></div>';
    return;
  }
  if (COMBO >= combos.length) COMBO = 0;
  const C = combos[COMBO];

  // ── ① 对手前两个 ban 位：下拉切换 ──
  const optHtml = combos.map((c, i) =>
    `<option value="${i}"${i === COMBO ? ' selected' : ''}>${esc(c.label)}`
    + `（可能 ${f2(c.weight)}）</option>`).join('');
  const c1 = card(1, '对手前两个 ban 位',
    `对手已经 ban 了哪两个求生，决定了后面所有推演。`
    + `换成别的组合，下面的监管倾向和 ②③④ 会整体跟着变。`,
    `<div class="row" style="margin-bottom:10px">
       <label class="lb">对手的 ban</label>
       <select id="comboSel" style="min-width:280px">${optHtml}</select>
     </div>
     <div class="verdict"><b>当前选择：${bansHtml(C.bans)}</b>
       <span class="dim">（这组 ban 的可能性 ${f2(C.weight)}）</span></div>
     ${C.intent_note ? `<div class="meta" style="margin-top:8px">${esc(C.intent_note)}</div>` : ''}
     <div class="rankcols">
       ${mapIntentBlock(C, m)}
       ${hunterRank(C)}
     </div>`);

  // ── （原②已删：监管方可能考虑的监管 —— 用户判定没有参考价值）──

  // ── ② 我方应 ban 哪几个监管 ──
  const quota = C.ban_quota ?? 0;
  let inner3;
  if (quota === 0) {
    inner3 = `<div class="verdict warn">第 ${m.game} 局没有 ban 监管的名额，
      不必填这一项，直接从第 ③ 段看选人。</div>`;
  } else {
    const rows3 = (C.ban_options || []).map(x => {
      const on = (C.ban_hunter || []).includes(x.char);
      return `<tr class="${on ? 'hl' : ''}">
        <td>${Char.chip(x.char, {size: 22})}</td>
        <td class="num">${f2(x.value)}</td>
        <td class="num dim">${(x.p_use * 100).toFixed(1)}%</td></tr>`;
    }).join('');
    inner3 = `<div class="verdict good"><b>建议 ban ${chips(C.ban_hunter)}</b></div>
      ${C.ban_note ? `<div class="meta" style="margin-top:6px">${esc(C.ban_note)}</div>` : ''}
      <div class="tablewrap" style="margin-top:10px"><table>
        <thead><tr><th style="width:40%">ban 掉这个监管</th>
          <th class="num">评估</th><th class="num">对方使用率</th></tr></thead>
        <tbody>${rows3}</tbody></table></div>`;
  }
  const c3 = card(2, `我方应 ban 的监管（配额 ${quota} 个）`, null, inner3);

  // ── ③ 我方前两手：只给结论，不列备选 ──
  // 前两手是确定的（③ 是我方连选两手，直接取最优解），
  // 列一堆备选只会让人以为还要挑，也白跑十几次子树搜索。
  const detail = C.picks_detail || [];
  const pickRows = detail.map(d => `<tr>
      <td><span class="dim">第 ${d.order} 手</span></td>
      <td title="${esc(d.char)}">${Char.chip(d.char, {size: 22})}</td>
      <td class="num">${f2(d.value)}</td>
      <td class="dim">${esc((d.pos || []).join('/') || '—')}${
        d.solid ? ' · 稳救' : ''}</td></tr>`).join('');
  const c4 = card(3, '我方前两手怎么选',
    `两手的顺序已经定好。「评估」是选下这一手之后，双方把后面走完的结果。`,
    `<div class="verdict"><b>前两手：${chips(C.picks)}</b>
       <span class="dim">（救人位 ${C.solid_n ?? 0} 个）</span></div>
     ${pickRows ? `<div class="tablewrap" style="margin-top:10px"><table>
       <thead><tr><th style="width:18%">顺序</th><th style="width:40%">角色</th>
         <th class="num">评估</th><th>定位</th></tr></thead>
       <tbody>${pickRows}</tbody></table></div>` : ''}`);

  // ── ⑤ 后面博弈树 ──
  const c5 = card(4, '后面博弈树怎么选',
    `深色那一手是主变线路，默认一路铺到底；每一层还有哪些备选也一并列出。`
    + `点某个备选就展开它下面那一层，再点收起 —— 展开的每一层都带着`
    + `「选了它之后」重新推演的值。`,
    `<div id="treeBox">${gameTree(C)}</div>`);

  // 对位情报已移到独立页面（web/matchup.html）：那张表只看角色池、
  // 对手选手和全局禁选，跟报告里选哪个 ban 组合、用哪张图、
  // 导入哪份分数配置都无关，留在正文里反而容易误以为它会跟着变。

  $('#body').innerHTML =
    settingsCard()
    + c1 + c3 + c4 + c5;

  const sel = $('#comboSel');
  if (sel) sel.onchange = () => {
    COMBO = +sel.value;
    TREE = { open: {}, more: {}, cache: {}, reg: {}, seq: 0, touched: false,
             auto: [], tried: {} };  // 换组合就重置树的交互状态
    renderNew();
  };
  wireTree();
}

/** ⑤ 段的事件绑定：点备选展开／收起它下面那一层、展开全部、按需加载深层、恢复主线。 */
function wireTree() {
  const box = $('#treeBox');
  if (!box) return;
  const rerender = () => { box.innerHTML = gameTree(curCombo()); wireTree(); };

  // 点某一手：展开／收起它下面那一层
  box.querySelectorAll('.tn[data-key]').forEach(el => {
    const info = TREE.reg[el.dataset.key];
    if (!info || !info.canOpen) return;
    el.onclick = () => {
      // 更深的层还没加载过：直接去要这一层，不用再点一次
      if (!info.open && !info.hasNext) {
        loadDeeper(el, info);
        return;
      }
      TREE.open[nodeKey(info.path)] = !info.open;
      TREE.touched = true;
      rerender();
    };
  });

  const loadDeeper = (el, info) => {
    el.classList.add('loading');
    el.querySelector('.tg').textContent = '加载中…';
    fetchLevel(info.state).then(() => {
      TREE.open[nodeKey(info.path)] = true;
      TREE.touched = true;
      rerender();
    }).catch(e => {
      el.classList.remove('loading');
      el.querySelector('.tg').textContent = '加载失败：' + e.message;
    });
  };

  // 展开全部 / 收起
  box.querySelectorAll('button[data-more]').forEach(el => {
    el.onclick = ev => {
      ev.stopPropagation();
      const lk = el.dataset.more;
      TREE.more[lk] = !TREE.more[lk];
      TREE.touched = true;
      rerender();
    };
  });

  // 深层按需加载的按钮：直接挂在展开的节点下面时用（保留兼容）
  box.querySelectorAll('button[data-load]').forEach(el => {
    el.onclick = ev => {
      ev.stopPropagation();
      const info = TREE.reg[el.dataset.load];
      if (!info) return;
      el.disabled = true;
      el.textContent = '加载中…';
      fetchLevel(info.state).then(() => {
        TREE.open[nodeKey(info.path)] = true;
        TREE.touched = true;
        rerender();
      }).catch(e => { el.disabled = false; el.textContent = '加载失败：' + e.message; });
    };
  });

  const rs = $('#treeReset');
  if (rs) rs.onclick = () => {
    TREE.open = {};
    TREE.more = {};
    TREE.touched = false;
    TREE.tried = {};
    rerender();
  };

  // 主变线路超出预展开范围：自动取一层，教练不用手点
  if (TREE.auto.length) {
    const job = TREE.auto[0];
    TREE.auto = [];
    fetchLevel(job.state).then(() => rerender()).catch(() => {});
  }
}

/** 当前选中的 combo（renderNew 里算过，交互里复用）。 */
function curCombo() {
  const combos = REP.combos || [];
  return combos[Math.min(COMBO, Math.max(0, combos.length - 1))] || {};
}

/** ⑤ 段的交互状态：
 *  TREE = { open: {节点键: true/false}, more: {层键: true}, cache: {状态键: 层} }
 *
 *  默认铺开主变线路，并且每一层都把并列的备选一起列出来；
 *  备选下面不再继续铺子节点 —— 点它才展开它下面那一层。
 *  open 记录用户手动开／关过哪些节点，覆盖默认的主变展开。 */
let TREE = { open: {}, more: {}, cache: {}, reg: {}, seq: 0, touched: false,
             auto: [], tried: {} };

/** 节点键：从根往下选到它为止的角色序列。 */
function nodeKey(path) { return path.join('\u0001'); }

/** 层键：加前缀区分「层」与「节点」，根层的键也不会为空。 */
function layerKey(path) { return 'L' + path.join('\u0001'); }

/** 沿路径走到某一手的下一层：优先用预展开的 next，
 *  否则查「按需加载」缓存（用户点过展开就有）。都没有就返回 null。 */
function nextOf(state, hit, layer) {
  if (hit.next && hit.next.nodes) return hit.next;
  if (!hit.more) return null;
  const after = stepState(state, hit, layer);
  return TREE.cache[treeKey(after)] || null;
}

/** 这个节点当前是否展开：用户手动开／关过就听用户的，否则主变节点默认展开。 */
function isOpen(npath, autoMain) {
  const k = nodeKey(npath);
  return (k in TREE.open) ? !!TREE.open[k] : !!autoMain;
}

/** 把一手的作用补进状态。ban 进 lban，pick 同时进 lpick 与 spicks。 */
function stepState(st, node, layer) {
  const kind = (layer && layer.kind) || '';
  const out = {
    idx: node.idx, taken: node.taken || 0,
    lban: (st.lban || []).slice(),
    lpick: (st.lpick || []).slice(),
    spicks: (st.spicks || []).slice(),
  };
  if (kind.endsWith('ban')) {
    if (out.lban.indexOf(node.char) < 0) out.lban.push(node.char);
  } else if (kind !== 'hunt_pick') {
    if (out.lpick.indexOf(node.char) < 0) out.lpick.push(node.char);
    if (out.spicks.indexOf(node.char) < 0) out.spicks.push(node.char);
  }
  return out;
}

/** 按需加载的缓存键：状态由阶段 + 已 ban + 已 pick + 已选唯一确定。 */
function treeKey(st) {
  return [st.idx, st.taken, (st.lban || []).join(','),
          (st.lpick || []).join(','), (st.spicks || []).join(',')].join('|');
}

/** 向后端要某一层的候选（预展开只有两层，更深的按需取）。 */
function fetchLevel(st) {
  const k = treeKey(st);
  if (TREE.cache[k]) return Promise.resolve(TREE.cache[k]);
  const m = REP.meta || {};
  const q = new URLSearchParams({
    team: m.team || '', player: m.player || '', game: String(m.game || 1),
    idx: String(st.idx), taken: String(st.taken || 0),
    map: m.map || '',
    lban: (st.lban || []).join(','), lpick: (st.lpick || []).join(','),
    spicks: (st.spicks || []).join(','),
    gone_hunt: (m.global_ban_hunt || []).join(','),
  });
  return fetch('/api/tree?' + q.toString())
    .then(r => r.json())
    .then(j => {
      if (!j.ok) throw new Error(j.error || '加载失败');
      const layer = { stage: j.stage, kind: j.kind, name: j.name,
                      actor: j.actor, nodes: j.nodes || [] };
      TREE.cache[k] = layer;
      return layer;
    });
}

/** 单个备选。delta 是相对本层最优的差，0 就是这一层的最优解。
 *  isMain：这一手在主变线路上（默认高亮并向下铺开）。
 *  open：这一手下面已经铺开了，再点就收起。 */
function treeRow(layer, n, nid, isMain, open, canOpen) {
  const d = Number(n.delta) || 0;
  const isBan = (layer.kind || '').endsWith('ban');
  const cls = ['tn', isBan ? 'ban' : 'pick', isMain ? 'main' : '']
    .filter(Boolean).join(' ');
  const dTxt = d > 1e-9 ? `<span class="dv good">+${d.toFixed(2)}</span>`
    : d < -1e-9 ? `<span class="dv danger">${d.toFixed(2)}</span>`
    : '<span class="dv dim">最优</span>';
  const tg = !canOpen ? '' : (open ? '▾ 收起' : '▸ 展开一层');
  const cls2 = canOpen ? cls : cls + ' leaf';
  return `<div class="${cls2}" data-key="${nid}" title="${esc(n.char)}">`
    + `<span class="st">${esc(layer.stage || '')}</span>`
    + `<span class="ch">${Char.icon(n.char, 20)}<span>${esc(n.char)}</span></span>`
    + `<span class="vv">${f2(n.value)}</span>${dTxt}`
    + `<span class="tg">${tg}</span></div>`;
}

/** 渲染一整层：一排并列的候选，展开的那些下面各接一棵子树。
 *
 *  autoChain：这条链还在「默认往下铺主变」的模式里。
 *  根层是 true，主变那一手往下传 true，备选往下传 false ——
 *  所以默认铺开整条主变线路，而点开的备选只铺一层、不再自动下钻。 */
function treeLayerHtml(C, layer, state, path, depth, autoChain) {
  if (!layer || !layer.nodes || !layer.nodes.length) return '';
  const lk = layerKey(path);
  const showAll = !!TREE.more[lk];
  const limit = 6;

  // 先把这一层的展示集合定下来：默认前 6 个，手动开／关过的节点也留着，
  // 否则收起一个排在第 7 位以后的备选，它就跟着从列表里消失了。
  const auto = n => autoChain && n === layer.nodes[0];   // 主变那一手默认展开
  const touched = n => nodeKey(path.concat([n.char])) in TREE.open;
  const keep = new Set(layer.nodes.slice(0, limit));
  layer.nodes.forEach(n => { if (auto(n) || touched(n)) keep.add(n); });
  const shown = layer.nodes.filter(n => showAll || keep.has(n));
  const heads = [];
  const kids = [];
  shown.forEach(n => {
    const np = path.concat([n.char]);
    const isMain = auto(n);
    const hasNext = !!(n.next && n.next.nodes);
    const canOpen = hasNext || !!n.more;
    const open = canOpen && isOpen(np, isMain);
    const nid = 'n' + (TREE.seq++);
    const after = stepState(state, n, layer);
    TREE.reg[nid] = { path: np, state: after, open, canOpen, hasNext };
    heads.push(treeRow(layer, n, nid, isMain, open, canOpen));
    if (!open) return;
    const child = nextOf(state, n, layer);
    if (child) {
      kids.push(`<div class="tkid">
        <div class="tsel">选了 <b>${esc(n.char)}</b> 之后</div>
        ${treeLayerHtml(C, child, after, np, depth + 1, isMain)}
      </div>`);
    } else if (isMain) {
      // 主变线路还没预展开到这里：记账，wireTree 里自动补一层
      const k = nodeKey(np);
      if (!TREE.tried[k]) {
        TREE.tried[k] = true;
        TREE.auto.push({ state: after, path: np });
      }
      kids.push(`<div class="tkid"><div class="tsel">选了 `
        + `<b>${esc(n.char)}</b> 之后 · 加载中…</div></div>`);
    } else {
      kids.push(`<div class="tkid"><div class="tmore">
        <button class="mini" data-load="${nid}">展开 ${esc(n.char)} 之后的推演</button>
      </div></div>`);
    }
  });

  let html = `<div class="tlayer"><span class="tl">第 ${depth + 1} 层 · `
    + `<b>${esc(layer.stage || '')} ${esc(layer.name || '')}</b>`
    + `${layer.actor ? `（${esc(layer.actor)}）` : ''}</span></div>`
    + `<div class="tgrid">${heads.join('')}</div>`;
  if (!showAll && layer.nodes.length > shown.length) {
    html += `<div class="tmore"><button class="mini" data-more="${lk}">`
      + `展开全部 ${layer.nodes.length} 个备选</button></div>`;
  } else if (showAll && shown.length > limit) {
    html += `<div class="tmore"><button class="mini" data-more="${lk}">收起备选</button></div>`;
  }
  return html + kids.join('');
}

/** ⑤ 后面博弈树：主变线路往下铺开，每一层的备选并列摆出来。 */
function gameTree(C) {
  const root = C.tree;
  if (!root || !root.nodes || !root.nodes.length) {
    return '<div class="meta">这份报告没有博弈树数据。</div>';
  }
  TREE.reg = {};
  TREE.auto = [];
  TREE.seq = 0;
  const tree = treeLayerHtml(C, root, C.tree_state || null, [], 0, true);

  const endRow = `
    <div class="tend">
      <span class="dim">最终阵容</span>
      <span class="chips">${chips(C.lineup || [])}</span>
      <span class="dim">评估</span><b>${f2(C.expect ?? C.half_value)}</b>
      <span class="dim">（救人位 ${C.solid_n ?? 0} 个）</span>
    </div>`;

  return `<div class="tbar">深色那一手是主变线，默认往下铺开；同一层的其他备选点一下就展开`
    + `它下面那一层，再点收起。每层默认列前 6 个，可展开全部。`
    + `${TREE.touched ? ' <button id="treeReset" class="mini">恢复主线</button>' : ''}</div>`
    + `<div class="tree">${tree}${endRow}</div>`;
}

/** ① 段的监管倾向排名：该选手全部候选监管，按这组 ban 的指向打分从高到低。
 *  条形按最高分归一，右边同时给占比（分数 ÷ 全部正分之和）和原始分。
 */
function hunterRank(C) {
  let rows = (C.hunter_rank || []).slice();
  if (!rows.length) {
    // 旧报告没有 hunter_rank 字段，退回只有前 3 的 hunter_scores
    rows = (C.hunter_scores || []).slice();
  }
  if (!rows.length) return '<div class="meta" style="margin-top:10px">这份报告没有监管倾向数据。</div>';
  const pos = rows.map(x => Math.max(Number(x.score) || 0, 0));
  const tot = pos.reduce((a, v) => a + v, 0) || 1;
  const hi = Math.max(...pos) || 1;
  const body = rows.map((x, i) => {
    const s = pos[i];
    const w = Math.max(2, s / hi * 100);
    const top = i === 0 && s > 0;
    const pct = s > 0 ? (s / tot * 100).toFixed(0) + '%' : '—';
    return `<div class="rk${top ? ' top' : ''}" title="${esc(x.char)} · ${pct} · 原始分 ${Number(x.score).toFixed(2)}">
      <span class="i">${i + 1}</span>
      <span class="who">${Char.icon(x.char, 16)}<span>${esc(x.char)}</span></span>
      <span class="bar"><i style="width:${w.toFixed(1)}%"></i></span>
      <span class="pct">${pct}</span>
      <span class="val">${Number(x.score).toFixed(1)}</span>
    </div>`;
  }).join('');
  return `<div class="col">
    <div class="meta">这组 ban 最可能是在为谁清路 —— 该选手用过的
      <b>${rows.length}</b> 个监管全部列出，按指向强度排序（百分比是分数占比，不是严格概率）。</div>
    <div class="rank">${body}</div>
  </div>`;
}

/** ① 段里的地图区块：这张图上对手更可能拿谁，紧跟在「当前选择」下面。
 *  候选集合随下拉的 ban 组合变化，块内按该图倍数从高到低排。
 */
function mapIntentBlock(C, m) {
  if (!m.map) {
    return `<div class="meta" style="margin-top:10px">这次没指定地图，推演按全联盟口径，
      所以没有地图倾向。要按地图看，回生成页在第 3 步选一张图再生成。</div>`;
  }
  // 优先用 ① 段的全量排名（每项都带该图倍数），旧报告没有 mult 时退回意图数据。
  let base = (C.hunter_rank && C.hunter_rank.length)
    ? C.hunter_rank : (C.rankWithMult || []);
  let rows = base.filter(x => x.mult != null)
                 .map(x => ({char: x.char, mult: Number(x.mult)}));
  if (!rows.length) {
    rows = (C.intent || []).filter(x => x.mult != null)
                           .map(x => ({char: x.char, mult: Number(x.mult)}));
  }
  if (!rows.length) return '';
  rows.sort((a, b) => b.mult - a.mult);
  const hi = Math.max(...rows.map(x => x.mult), 1);
  const body = rows.map(x => {
    // 条形长度按该图份额算，颜色用赤/绿表示偏多偏少
    const w = Math.max(2, x.mult / hi * 100);
    return `<div class="rk" title="${esc(x.char)}：这张图的出场份额是全联盟的 ${x.mult.toFixed(2)} 倍">
      <span class="who">${Char.icon(x.char, 16)}<span>${esc(x.char)}</span></span>
      <span class="bar"><i style="width:${w.toFixed(1)}%;background:${
        x.mult >= 1 ? 'linear-gradient(90deg,#2f7a63,#6dc4a0)'
                    : 'linear-gradient(90deg,#8a4038,#d4645c)'}"></i></span>
      <span class="pct">×${x.mult.toFixed(2)}</span>
    </div>`;
  }).join('');
  return `<div class="col">
    <div class="meta"><b>${esc(m.map)}</b> 这张图上对手更可能拿谁
      （×倍数 = 该图份额 ÷ 全联盟份额，1.00 为平均；绿色偏高、红色偏低）</div>
    <div class="rank">${body}</div>
  </div>`;
}

/** 本次生成用的设置：监管数据来源、求生角色池、全局禁选。 */function settingsCard() {
  const m = REP.meta || {};
  const gs = m.global_ban_surv || [];
  const gh = m.global_ban_hunt || [];
  const pool = m.our_pool || [];
  let src;
  if (m.scores_source) {
    src = `导入的配置 <b>${esc(m.scores_source)}</b>`;
  } else {
    src = '预编辑基准表';
  }
  const rosterSrc = m.roster_source
    ? `导入的配置 <b>${esc(m.roster_source)}</b>`
    : '预编辑基准角色池';
  const kv = (k, v) => `<div class="kv"><span class="k">${k}</span>`
    + `<span class="v">${v}</span></div>`;
  return `<div class="card">
    <h2><span class="num">i</span>本次生成用的设置</h2>
    <p class="lead">这些是生成这份报告时的输入，换掉其中任何一项都会得到不同的结论。</p>
    <div class="two">
      <div>
        ${kv('对局', `${esc(m.team)}（求生） vs ${esc(m.player)}（监管） · 第 ${m.game} 局`)}
        ${kv('地图', m.map
          ? `<b>${esc(m.map)}</b>（影响候选排序与评估值，不改任何分数格）`
          : '<span class="dim">未指定（按全联盟口径）</span>')}
        ${kv('我方 ban 名额', `${m.ban_quota ?? 0} 个（第 1 局 0、第 2 局 1、第 3 局起 2）`)}
        ${kv('可选 ban 组合', `${m.combo_count ?? '—'} 组（第 ① 段可切换）`)}
        ${kv('监管数据', src)}
        ${kv('求生角色池', `${rosterSrc} · ${esc(m.team)} 共 ${pool.length} 个`)}
      </div>
      <div>
        ${kv('我方已用掉的求生', gs.length ? chips(gs) : '<span class="dim">无</span>')}
        ${kv('对方已用掉的监管', gh.length ? chips(gh) : '<span class="dim">无</span>')}
      </div>
    </div>
    ${pool.length ? `<div class="meta" style="margin-top:8px">
      我方角色池：${chips(pool)}</div>` : ''}
  </div>`;
}

/** 旧格式（按监管集合组织）的兼容渲染 —— 已下线，报告一律走新结构。 */

boot();
</script>
