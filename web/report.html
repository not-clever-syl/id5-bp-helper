<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BP 教练报告</title>
<link rel="stylesheet" href="char.css">
<style>
:root{
  --bg:#14161c;--panel:#1b1e26;--panel2:#21252f;--border:#2e3340;
  --text:#dfe5f0;--dim:#8b94a8;--accent:#6b8cff;--warn:#e0a35a;
  --danger:#d4645c;--good:#4fa88a;--ban:#8a5a9e;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  overflow-x:hidden;
  font:13.5px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
header{padding:14px 26px;border-bottom:1px solid var(--border);
  background:var(--panel);position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header .hd{min-width:0}
header h1{margin:0;font-size:16px;font-weight:600}
header .sub{color:var(--dim);font-size:12px;margin-top:2px}
/* 「← 首页」统一固定在页首最左，作为所有页面的唯一回退入口 */
a.home{color:var(--dim);text-decoration:none;font-weight:400;font-size:12.5px;
  flex:none;padding:4px 10px;border-radius:6px;border:1px solid var(--border)}
a.home:hover{color:var(--text);border-color:var(--accent)}
main{width:100%;margin:0 auto;padding:16px 26px 90px}
.sel{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.sel label{color:var(--dim);font-size:12px}
select{background:var(--panel2);color:var(--text);border:1px solid var(--border);
  border-radius:7px;padding:7px 11px;font-size:12.5px;min-width:150px;
  max-width:100%}
select:hover{border-color:var(--accent)}
button{background:var(--panel2);color:var(--text);border:1px solid var(--border);
  border-radius:7px;padding:6px 12px;font-size:12.5px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:#2a3f6e;border-color:var(--accent);color:#cfe0ff}
.io{font-size:11.5px;color:var(--dim);margin-left:4px}
.io.ok{color:var(--good)} .io.err{color:var(--danger)}
a.genlink{color:#cfe0ff;text-decoration:none;font-size:12.5px;
  border:1px solid var(--accent);background:#2a3f6e;border-radius:7px;padding:6px 12px}
a.genlink:hover{background:#33518c}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:14px 18px;margin-bottom:14px;min-width:0}
.card h2{margin:0 0 4px;font-size:14.5px;font-weight:600;
  display:flex;align-items:center;gap:9px}
.card h2 .num{width:24px;height:24px;border-radius:50%;background:var(--accent);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:600;flex:none}
.card .lead{color:var(--dim);font-size:12px;margin:0 0 10px 33px}
.verdict{background:var(--panel2);border-left:3px solid var(--accent);
  border-radius:0 8px 8px 0;padding:10px 14px;margin:10px 0 0;font-size:12.5px}
.verdict.warn{border-left-color:var(--warn)}
.verdict.good{border-left-color:var(--good)}
.verdict.bad{border-left-color:var(--danger)}
.verdict b{color:#fff}
.tablewrap{width:100%;overflow-x:hidden}
table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:12.5px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.055);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
th{color:var(--dim);font-weight:500;font-size:11px}
/* 窄屏时表格内容会被截断，鼠标悬停看全 */
td[title]{cursor:help}
tr:last-child td{border-bottom:none}
tr.hl td{background:rgba(107,140,255,.10)}
tr.hl td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tr.click{cursor:pointer}
tr.click:hover td{background:rgba(255,255,255,.035)}
.num{text-align:right;font-variant-numeric:tabular-nums;
  font-family:Consolas,monospace}
.dim{color:var(--dim)}
.good{color:var(--good)}.warn{color:var(--warn)}.danger{color:var(--danger)}
.pill{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:8px;
  background:var(--panel2);border:1px solid var(--border);margin-right:4px}
.pill.ban{border-color:var(--ban);color:#c9a0dd}
.pill.pick{border-color:var(--accent);color:#cfe0ff}
.pill.only{border-color:var(--good);color:#9fd8c4}
.flow{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.step{background:var(--panel2);border:1px solid var(--border);border-radius:8px;
  padding:6px 10px;font-size:12px}
.step .s1{color:var(--dim);font-size:10.5px;margin-bottom:3px}
.step.ban{border-color:#5a3d68}
.step.pick{border-color:#35507e}
.lineup{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.meta{color:var(--dim);font-size:11.5px;margin-top:6px}
/* 「本次生成用的设置」：左右两栏的键值表 */
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:4px 22px}
.two .kv{display:flex;gap:12px;align-items:flex-start;padding:4px 0;
  border-bottom:1px solid rgba(255,255,255,.04)}
.two .kv .k{color:var(--dim);font-size:12px;flex:none;width:96px}
.two .kv .v{font-size:12px;min-width:0;word-break:break-word}
.two .kv .v code{background:var(--panel2);padding:1px 5px;border-radius:4px;
  font:11px Consolas,monospace}
.empty{color:var(--dim);padding:40px 0;text-align:center}
footer{color:var(--dim);font-size:11px;margin:0 auto;
  padding:0 26px 50px;line-height:1.9}
footer b{color:var(--text)}
/* 监管集合的组合按钮 */
.sets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.sets button{background:var(--panel2);color:var(--dim);border:1px solid var(--border);
  border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px}
.sets button:hover{border-color:var(--accent);color:var(--text)}
.sets button.on{background:#2a3f6e;border-color:var(--accent);color:#cfe0ff}
.sets button .cnt{font:10px Consolas,monospace;color:var(--dim)}
/* 监管倾向排名：紧凑列表；块内单列，宽屏时左右两块并排 */
.rank{margin-top:6px;display:flex;flex-direction:column;gap:0}
/* ① 段的两块排名：左=地图倾向，右=这组 ban 的指向排名 */
.rankcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));
  gap:22px 34px;margin-top:16px;align-items:start}
.rankcols .rank{display:grid;grid-template-columns:1fr}
.rankcols .col{min-width:0}
.rank .rk{display:flex;align-items:center;gap:8px;padding:5px 8px;
  border-radius:6px;border-left:2px solid transparent;line-height:1.6}
.rank .rk:hover{background:rgba(255,255,255,.03)}
.rank .rk.top{border-left-color:var(--accent);background:rgba(107,140,255,.10)}
.rank .rk .i{flex:none;width:16px;color:var(--dim);
  font:11px Consolas,monospace;text-align:right}
.rank .rk.top .i{color:var(--accent);font-weight:600}
.rank .rk .who{flex:none;width:96px;display:flex;align-items:center;gap:5px;
  font-size:12.5px;overflow:hidden;white-space:nowrap}
.rank .rk .who span{overflow:hidden;text-overflow:ellipsis}
.rank .rk .bar{flex:1;min-width:48px;height:8px;border-radius:4px;
  background:var(--panel2);overflow:hidden}
.rank .rk .bar i{display:block;height:100%;border-radius:4px;
  background:linear-gradient(90deg,#3c5aa8,#6b8cff)}
.rank .rk.top .bar i{background:linear-gradient(90deg,#4a6fd0,#8ea8ff)}
.rank .rk .pct{flex:none;width:40px;text-align:right;
  font:12px Consolas,monospace}
.rank .rk .val{flex:none;width:42px;text-align:right;color:var(--dim);
  font:11px Consolas,monospace}
/* ① 段里的地图区块：块标题与说明 */
.rankcols .col > .meta{margin:0 0 6px;line-height:1.6}
.rankcols .col > .meta b{color:var(--text)}
/* ── ⑤ 博弈树：节点卡片 + 连线（根在上，一层一行，向下分叉） ── */
.tbar{color:var(--dim);font-size:12px;margin:2px 0 10px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tbar.warn{color:var(--warn)}
button.mini{background:transparent;border:1px solid var(--border);color:var(--dim);
  border-radius:6px;padding:2px 9px;font-size:11.5px;cursor:pointer}
button.mini:hover{border-color:var(--accent);color:var(--text)}
.treewrap{position:relative;overflow:hidden;height:560px;
  background:#171a21;border:1px solid var(--border);border-radius:10px;
  cursor:grab;touch-action:none;
  /* 画布是拿来拖的：按住拖动时不能顺带选中节点里的文字，
     否则一拖就变成一抹蓝色选区，还盖住连线 */
  user-select:none;-webkit-user-select:none;
  background-image:radial-gradient(circle,rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:22px 22px}
.treewrap.grabbing{cursor:grabbing}
/* 世界层：整棵树画在这里，整体平移 + 缩放。
   这里故意不写 will-change:transform：一旦常驻合成层，浏览器会沿用
   缩小那一刻的位图，再放大时文字只是把旧位图拉大，笔画发虚。
   节点数量很少，交给浏览器每次按当前比例重新绘制更清晰。 */
.tcanvas{position:absolute;left:0;top:0;transform-origin:0 0}
.trowhead{position:absolute;left:6px;transform:translateY(-50%);
  color:var(--dim);font-size:10px;line-height:1.25;max-width:180px;
  white-space:normal;overflow:hidden;pointer-events:none;opacity:.9}
.trowhead b{color:var(--text);font-weight:500}
/* ⑩ 监管选人：分数是「若真掏这个监管」的阵容分，不是总评，标一下免得误会 */
.trowhead i{display:block;font-style:normal;font-size:9px;color:#8a93a6;margin-top:1px}
/* 阶段标签列：固定在框内左侧，不随缩放平移跑 */
.trows{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;
  pointer-events:none;z-index:2}
.tedges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
/* 画布右上角的放缩按钮 */
.tzoom{position:absolute;right:10px;top:10px;display:flex;gap:4px;z-index:5}
.tzoom button{width:26px;height:26px;border-radius:6px;cursor:pointer;
  background:rgba(23,26,33,.88);border:1px solid var(--border);color:var(--dim);
  font:13px/1 Consolas,monospace;display:flex;align-items:center;justify-content:center}
.tzoom button:hover{border-color:var(--accent);color:var(--text)}
.tzoom button.wide{width:auto;padding:0 8px;font-size:11px}
/* ── 树节点 ──
   位置由 JS 按列/行算好后写进 style 的 left/top（世界坐标）。
   方块定死尺寸，内容多了只缩内容，不撑破卡片。 */
.tnode{position:absolute;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;
  padding:4px;border-radius:8px;background:var(--panel2);
  border:1px solid var(--border);font-size:12px;line-height:1.15;
  cursor:pointer;overflow:hidden;text-align:center;box-sizing:border-box;
  transition:border-color .12s,background .12s}
/* 展开过的方块淡一点，收起过的不加，看颜色就知道哪块下面还有内容 */
.tnode.open{box-shadow:0 0 0 2px rgba(107,140,255,.18)}
.tnode:hover{border-color:var(--accent);background:#252a36}
.tnode .ic{display:flex;align-items:center;justify-content:center}
.tnode .nm{flex:none;max-width:100%;overflow:hidden;white-space:nowrap;
  text-overflow:ellipsis;font-weight:600;font-size:11.5px;line-height:1.25}
.tnode .vv{display:flex;align-items:center;gap:3px;
  font:11.5px Consolas,monospace;white-space:nowrap}
.tnode .dv{flex:none;font:10.5px Consolas,monospace}
.tnode .dv.good{color:var(--good)}
.tnode .dv.danger{color:var(--danger)}
.tnode .dv.dim{color:var(--dim)}
.tnode .tg{flex:none;color:var(--dim);font-size:9px;white-space:nowrap}
.tnode.main .tg{color:var(--accent)}
.tnode.ban{border-left:3px solid var(--ban)}
.tnode.pick{border-left:3px solid var(--accent)}
.tnode.main{border-color:var(--accent);background:#2a3f6e;color:#cfe0ff}
.tnode.main:hover{background:#33518c}

/* 根节点：③ 两手定下的起点，深蓝渐变，明显区别于下面的节点 */
.tnode.root{line-height:1.3;cursor:default;gap:5px;
  background:linear-gradient(180deg,#2f4a86,#24365f);
  border:1px solid #6b8cff;color:#e6eeff;
  box-shadow:0 0 0 1px rgba(107,140,255,.25),0 4px 14px rgba(0,0,0,.35)}
.tnode.root:hover{background:linear-gradient(180deg,#35528f,#26395f);border-color:#8ea8ff}
/* 「③ 已定」小标签：告诉教练这张卡是起点 */
.tnode.root .nm{font-weight:400;font-size:11.5px;letter-spacing:.5px;
  color:#a9c0ff;background:rgba(107,140,255,.18);border-radius:4px;
  padding:1px 6px;overflow:visible;text-overflow:clip}
.tnode.root .vv{font-size:12px;font-weight:600;color:#fff;white-space:normal;
  line-height:1.4;max-width:100%}

/* 「再看一个」：本层还有备选的入口，虚线小方块 */
.tnode.more{font-size:10.5px;line-height:1.3;padding:6px;
  background:rgba(107,140,255,.05);border-style:dashed;
  border-color:#3b4458;color:var(--dim);cursor:pointer}
.tnode.more:hover{border-color:var(--accent);color:var(--text);
  background:rgba(107,140,255,.12)}
.tnode.more .nm{font-weight:400;font-size:11.5px;line-height:1.35;white-space:normal}
.tend{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;
  padding:8px 12px;border-radius:8px;background:var(--panel2);
  border-left:3px solid var(--good);font-size:12.5px}
.tend b{font:13px Consolas,monospace;color:#fff}
</style>
</head>
<body>
<header>
  <a href="index.html" class="home">← 首页</a>
  <div class="hd">
    <h1>BP 教练报告</h1>
    <div class="sub" id="sub">加载中…</div>
  </div>
</header>

<main>
  <div class="sel">
    <label>报告</label>
    <span style="margin-left:auto;display:flex;gap:6px;align-items:center">
      <a class="genlink" href="generate.html">生成新报告 →</a>
      <button id="impBtn">导入报告</button>
      <span id="ioMsg" class="io"></span>
    </span>
  </div>

  <div id="body"><div class="empty">正在读取数据…</div></div>
</main>

<footer>
  <b>读法</b>：数值单位是「局均逃脱」，2.00 为平局线；经「最低 3 人」聚合后系统性偏低，
  只用于同一对手下的相对比较，不代表真实逃脱人数。<br>
  <b>结构项</b>：无救人位 −0.45、救人位超过 1 个每多 1 个 −1.20、无牵制型 −0.30。<br>
  <b>常规性</b>：救人位 ≥2 或无任何辅位 → 不常规；无救人位 / 无牵制型 / 无破译型 → 接近常规；
  全部满足 → 常规。该判定只作提示，不计入评估值。<br>
  <b>数据来源</b>：导入 <code>data/reports/</code> 里的报告文件；
  报告页只支持导入，不做导出、不维护索引。
</footer>

<script src="char.js"></script>
<script src="filemodal.js"></script>
<script>
const $ = s => document.querySelector(s);
let REP = null;        // 当前报告
let SOLID_CHARS = [];  // 救人位名单（从后端取，老报告里没有这个字段）

/** 分数统一显示两位小数 */
const f2 = v => (v == null || !isFinite(v)) ? '—' : Number(v).toFixed(2);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
                                .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function regCls(v) {
  return v === '常规' ? 'good' : v === '接近常规' ? 'warn' : 'danger';
}

/** 救人位名单只取一次：故意不塞进报告文件，免得每份报告都带一份同样的表。
 *  老报告里没有 meta.solid_chars，页面上仍要数「救人位几个」，所以从后端拿。 */
let solidPromise = null;
function loadSolid() {
  if (!solidPromise) {
    solidPromise = fetch('/api/solid')
      .then(r => r.ok ? r.json() : null)
      .then(j => { if (j && j.chars) SOLID_CHARS = j.chars; })
      .catch(() => {});
  }
  return solidPromise;
}

/** 报告页进来就显示最新的一份；也可以用 ?file=<文件名> 指定某一份。
 *
 *  从生成页跳过来时带 ?file=<文件名>，直接读那一份出来显示 ——
 *  相当于「刚生成的报告自动打开」。
 *  没带参数时按生成时间取 data/reports/ 里最新的一份。
 */
async function boot() {
  $('#body').innerHTML = `<div class="empty">
    还没有载入报告。<br>
    点右上角「导入报告」，从 <code>data/reports/</code> 里挑一份；<br>
    或者去 <a class="genlink" href="generate.html">生成页</a> 现算一份。
  </div>`;
  $('#sub').textContent = '导入一份报告查看';

  const q = new URLSearchParams(location.search);
  let file = q.get('file');
  let autoPicked = false;
  if (!file) {
    // 没指定就看最新的那份：列表接口在 meta=1 时按生成时间倒序。
    try {
      const r = await fetch('/api/files/list?kind=import&dir='
        + encodeURIComponent('data/reports') + '&meta=1');
      if (r.ok) {
        const j = await r.json();
        const first = (j.files || [])[0];
        if (first) { file = first.name; autoPicked = true; }
      }
    } catch (e) { /* 拿不到就停在空状态 */ }
  }
  if (!file) return;
  try {
    const r = await fetch('/api/files/read', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: 'data/reports/' + file }),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const d = j.data;
    const rep = Array.isArray(d) ? d[0] : (d && d.meta ? d : (d.reports || [])[0]);
    if (!rep) throw new Error('文件里没有报告');
    await loadSolid();   // 先拿到救人位名单，再渲染，免得「最终阵容」短暂显示错的个数
    showReport(rep);
    setIo(autoPicked ? `已自动打开最新一份：${file}` : '已打开刚生成的报告', 'ok');
  } catch (e) {
    setIo('打开失败：' + e.message, 'err');
  }
}

// ── 导入 ──
const setIo = (t, cls) => {
  const el = $('#ioMsg');
  el.textContent = t;
  el.className = 'io ' + (cls || '');
};

/* 报告页只支持导入：从 data/reports/ 里挑一份读进来直接渲染。
 * 不做导出、不维护索引 —— 报告本身就是独立文件。 */
$('#impBtn').onclick = () => {
  FileModal.pick({
    title: '导入报告',
    dir: 'data/reports',
    table: true,
    onPick: obj => {
      // 兼容三种输入：单份报告、报告数组、旧的索引结构
      const incoming = Array.isArray(obj) ? obj
        : Array.isArray(obj.reports) ? obj.reports
        : obj && obj.meta ? [obj] : null;
      if (!incoming || !incoming.length) {
        setIo('导入失败：文件里没有报告数据', 'err');
        return;
      }
      const bad = incoming.filter(r => !r.meta || !r.meta.team
        || !r.meta.player || !r.meta.game);
      if (bad.length) {
        setIo(`导入失败：${bad.length} 份报告缺少 meta（team/player/game）`, 'err');
        return;
      }
      // 新结构是「以对手 ban 组合为轴」，老结构只有 sets/plans，页面渲染不了
      const old = incoming.filter(r => !(r.combos || (r.summary || {}).sections));
      if (old.length && old.length === incoming.length) {
        setIo('导入失败：这些报告是旧结构（按监管假设组织），'
          + '页面现在按「对手 ban 组合」渲染，请重新生成', 'err');
        return;
      }
      showReport(incoming[0]);
      setIo(incoming.length > 1
        ? `已导入 ${incoming.length} 份，显示其中一份`
        : '已导入', 'ok');
    },
  });
};

function showReport(rep) {
  REP = rep;
  const m = REP.meta;
  $('#sub').innerHTML =
    `${esc(m.season)} · ${esc(m.team)}（求生） vs ${esc(m.player)}（监管） · 第 ${m.game} 局 · `
    + `生成于 ${esc(m.generated_at)} · 我方 ban 名额 ${m.ban_quota ?? 0}`;
  render();
}

// ══════════════════════════════════════════════════════════════
// 报告正文：四段 + 对位情报卡，顺序与教练看报告的思路一致
//   ① 对手前两个 ban 位（用户选）  ② 我方应 ban 哪几个
//   ③ 我方前两手    ④ 后面博弈树怎么选
//
// 新结构（bp_combo_report）：以「对手 ban 组合」为轴，
// 每个 combo 自带完整的 ②③④；②③ 跟着当前选择走。
// ══════════════════════════════════════════════════════════════
const chips = arr => (arr || []).map(c => Char.chip(c, {size: 25})).join(' ')
  || '<span class="dim">—</span>';
const bansHtml = arr => (arr || []).map(c =>
  `<span class="pill ban">${Char.icon(c, 19)}${esc(c)}</span>`).join('')
  || '<span class="dim">不 ban</span>';

/** 逐手路线：ban 紫、选人蓝 */
function flowOf(line) {
  if (!(line || []).length) return '<span class="dim">没有逐手数据</span>';
  return '<div class="flow">' + line.map(x => {
    const isBan = (x.name || '').includes('ban');
    return `<div class="step ${isBan ? 'ban' : 'pick'}">
      <div class="s1">${esc(x.stage)} ${esc(x.name)}</div>
      ${Char.chip(x.char, {size: 20})}
      <div class="s1" style="margin:3px 0 0">${f2(x.value)}</div></div>`;
  }).join('') + '</div>';
}

function card(num, title, lead, inner) {
  return `<div class="card">
    <h2><span class="num">${num}</span>${title}</h2>
    ${lead ? `<p class="lead">${lead}</p>` : ''}
    ${inner}
  </div>`;
}

function render() {
  if (REP.combos || (REP.summary || {}).sections) return renderNew();
  $('#body').innerHTML = '<div class="empty">这份报告没有任何可显示的段落。</div>';
}

/** 当前选中的 ban 组合下标 */
let COMBO = 0;

function renderNew() {
  const m = REP.meta;
  const combos = REP.combos || [];  if (!combos.length) {
    $('#body').innerHTML = settingsCard()
      + '<div class="card"><div class="verdict warn">这份报告没有可用的 ban 组合。</div></div>';
    return;
  }
  if (COMBO >= combos.length) COMBO = 0;
  const C = combos[COMBO];

  // ── ① 对手前两个 ban 位：下拉切换 ──
  const optHtml = combos.map((c, i) =>
    `<option value="${i}"${i === COMBO ? ' selected' : ''}>${esc(c.label)}`
    + `（可能 ${f2(c.weight)}）</option>`).join('');
  const c1 = card(1, '对手前两个 ban 位',
    `对手已经 ban 了哪两个求生，决定了后面所有推演。`
    + `换成别的组合，下面的监管倾向和 ②③④ 会整体跟着变。`,
    `<div class="row" style="margin-bottom:10px">
       <label class="lb">对手的 ban</label>
       <select id="comboSel" style="min-width:280px">${optHtml}</select>
     </div>
     <div class="verdict"><b>当前选择：${bansHtml(C.bans)}</b>
       <span class="dim">（这组 ban 的可能性 ${f2(C.weight)}）</span></div>
     ${C.intent_note ? `<div class="meta" style="margin-top:8px">${esc(C.intent_note)}</div>` : ''}
     <div class="rankcols">
       ${mapIntentBlock(C, m)}
       ${hunterRank(C)}
     </div>`);

  // ── （原②已删：监管方可能考虑的监管 —— 用户判定没有参考价值）──

  // ── ② 我方应 ban 哪几个监管 ──
  const quota = C.ban_quota ?? 0;
  let inner3;
  if (quota === 0) {
    inner3 = `<div class="verdict warn">第 ${m.game} 局没有 ban 监管的名额，
      不必填这一项，直接从第 ③ 段看选人。</div>`;
  } else {
    const rows3 = (C.ban_options || []).map(x => {
      const on = (C.ban_hunter || []).includes(x.char);
      return `<tr class="${on ? 'hl' : ''}">
        <td>${Char.chip(x.char, {size: 22})}</td>
        <td class="num">${f2(x.value)}</td>
        <td class="num dim">${(x.p_use * 100).toFixed(1)}%</td></tr>`;
    }).join('');
    inner3 = `<div class="verdict good"><b>建议 ban ${chips(C.ban_hunter)}</b></div>
      ${C.ban_note ? `<div class="meta" style="margin-top:6px">${esc(C.ban_note)}</div>` : ''}
      <div class="tablewrap" style="margin-top:10px"><table>
        <thead><tr><th style="width:40%">ban 掉这个监管</th>
          <th class="num">评估</th><th class="num">对方使用率</th></tr></thead>
        <tbody>${rows3}</tbody></table></div>`;
  }
  const c3 = card(2, `我方应 ban 的监管（配额 ${quota} 个）`, null, inner3);

  // ── ③ 我方前两手：只给结论，不列备选 ──
  // 前两手是确定的（③ 是我方连选两手，直接取最优解），
  // 列一堆备选只会让人以为还要挑，也白跑十几次子树搜索。
  const detail = C.picks_detail || [];
  const pickRows = detail.map(d => `<tr>
      <td><span class="dim">第 ${d.order} 手</span></td>
      <td title="${esc(d.char)}">${Char.chip(d.char, {size: 22})}</td>
      <td class="num">${f2(d.value)}</td>
      <td class="dim">${esc((d.pos || []).join('/') || '—')}${
        d.solid ? ' · 稳救' : ''}</td></tr>`).join('');
  const c4 = card(3, '我方前两手怎么选',
    `两手的顺序已经定好。「评估」是选下这一手之后，双方把后面走完的结果。`,
    `<div class="verdict"><b>前两手：${chips(C.picks)}</b>
       <span class="dim">（救人位 ${C.solid_n ?? 0} 个）</span></div>
     ${pickRows ? `<div class="tablewrap" style="margin-top:10px"><table>
       <thead><tr><th style="width:18%">顺序</th><th style="width:40%">角色</th>
         <th class="num">评估</th><th>定位</th></tr></thead>
       <tbody>${pickRows}</tbody></table></div>` : ''}`);

  // ── ⑤ 后面博弈树 ──
  VIEW = {k: 1, x: 0, y: 0, fitted: false};   // 重新出报告时视野回到适配
  TREE.rows = [];
  const c5 = card(4, '后面博弈树怎么选',
    `从上往下读：最上面是 ③ 定下的两手，下面每一层是一手。白色实线是主变线路，`
    + `默认一路连到底；白色虚线连的是「再看一个」，它排在那一层所有备选的最右边，点一次放出一个。`
    + `点某个备选就展开（或收起）它下面那一层，展开的层都带着「选了它之后」重新推演的值。`
    + `最后一层「监管选人」只做展示，不能再展开。`
    + `框里可以拖动、滚轮缩放，右上角有放大缩小和「适配」。`,
    `<div id="treeBox">${gameTree(C)}</div>`);

  // 对位情报已移到独立页面（web/matchup.html）：那张表只看角色池、
  // 对手选手和全局禁选，跟报告里选哪个 ban 组合、用哪张图、
  // 导入哪份分数配置都无关，留在正文里反而容易误以为它会跟着变。

  $('#body').innerHTML =
    settingsCard()
    + c1 + c3 + c4 + c5;

  const sel = $('#comboSel');
  if (sel) sel.onchange = () => {
    COMBO = +sel.value;
    TREE = { open: {}, more: {}, openMore: {}, cache: {}, reg: [], touched: false,
             auto: [], tried: {}, heads: {}, rows: [], world: null, topCols: 3 };  // 换组合就重置树的交互状态
    VIEW = {k: 1, x: 0, y: 0, fitted: false};   // 视野也回到「适配」
    renderNew();
  };
  wireTree();
}

/** ⑤ 段的交互：点节点展开／收起下一层、点「再看一个」放出一手、按需加载深层、恢复主线，
 *  以及画布的拖动平移和滚轮缩放。
 *  用事件委托挂在 #treeBox 上：树每次重绘都会换掉整块 DOM，逐个绑 onclick 重绘后就断了。 */
let treeDelegated = false;

/** 画布的视野：缩放比与平移量（相对框左上角）。重绘时保留，换组合时重置。 */
let VIEW = {k: 1, x: 0, y: 0, fitted: false};
/** 当前是否在拖动画布，以及这次按住后是否真的移动过（移动过就不算点击）。 */
let drag = null;
let dragMoved = false;

/** 缩放比清洗：累积乘 1.12／除 1.12 会留下 0.9999999998 这种脏值，
 *  浏览器按它重采样文字，笔画就会发虚。极接近 1 时直接归到 1。 */
function cleanK(k) {
  return Math.abs(k - 1) < 1e-6 ? 1 : k;
}

/** 把 VIEW 应用到世界层上，并让左侧的阶段标签跟着更新。 */
function applyView() {
  const world = document.querySelector('#treeWorld');
  if (!world) return;
  world.style.transform = `translate(${Math.round(VIEW.x)}px,${Math.round(VIEW.y)}px) scale(${cleanK(VIEW.k)})`;
  const rows = document.querySelector('#treeRows');
  if (rows) rows.innerHTML = rowsHtml();
}

/** 缩放到 k（以框内 (cx,cy) 为不动点，默认框中心）。 */
function zoomTo(k, cx, cy) {
  const wrap = document.querySelector('#treeWrap');
  if (!wrap) return;
  const r = wrap.getBoundingClientRect();
  const px = cx == null ? r.width / 2 : cx;
  const py = cy == null ? r.height / 2 : cy;
  const next = cleanK(Math.max(0.3, Math.min(2.2, k)));
  // 不动点在世界上对应的坐标，缩放前后要保持落在同一屏幕位置
  const wx = (px - VIEW.x) / VIEW.k;
  const wy = (py - VIEW.y) / VIEW.k;
  VIEW.k = next;
  VIEW.x = px - wx * next;
  VIEW.y = py - wy * next;
  VIEW.touched = true;
  applyView();
}

/** 整棵树缩到框里（太大就缩小，太小就放大到铺满，留一点边）。首次打开也走这里。 */
function fitView() {
  const wrap = document.querySelector('#treeWrap');
  const w = TREE.world;
  if (!wrap || !w) return;
  const bw = wrap.clientWidth, bh = wrap.clientHeight;
  const k = cleanK(Math.max(0.3, Math.min(1, (bw - 40) / w.w, (bh - 40) / w.h)));
  VIEW.k = k;
  VIEW.x = Math.max(10, (bw - w.w * k) / 2);
  VIEW.y = Math.max(10, (bh - w.h * k) / 2);
  VIEW.fitted = true;
  applyView();
}

/** 树长高／变宽以后，用户保留了自己拖动缩放过的视野，但整棵树可能
 *  已经跑出框外（比如刚点开的节点跑到上面看不见）。这时候只调整平移量，
 *  把整棵树推回框内，缩放比不动——不重算缩放，教练的视野习惯就不会被打断。 */
function keepInView() {
  const wrap = document.querySelector('#treeWrap');
  const w = TREE.world;
  if (!wrap || !w) return;
  const bw = wrap.clientWidth, bh = wrap.clientHeight;
  const ww = w.w * VIEW.k, wh = w.h * VIEW.k;
  // 树比框矮：整棵推到里面居中；树比框高：至少让顶边和底边都露出来
  if (wh <= bh) {
    VIEW.y = Math.max(10, (bh - wh) / 2);
  } else {
    VIEW.y = Math.min(10, Math.max(bh - wh - 10, VIEW.y));
  }
  if (ww <= bw) {
    VIEW.x = Math.max(10, (bw - ww) / 2);
  } else {
    VIEW.x = Math.min(10, Math.max(bw - ww - 10, VIEW.x));
  }
  applyView();
}

function wireTree() {
  const box = $('#treeBox');
  if (!box) return;
  const redraw = () => { gameTree(curCombo()); };

  if (treeDelegated !== box) {
    treeDelegated = box;

    box.onclick = ev => {
      // 放大／缩小／适配
      const zb = ev.target.closest('.tzoom button');
      if (zb && box.contains(zb)) {
        const z = zb.dataset.zoom;
        if (z === 'in') zoomTo(VIEW.k * 1.2);
        else if (z === 'out') zoomTo(VIEW.k / 1.2);
        else fitView();
        return;
      }
      const more = ev.target.closest('.tnode-more[data-more]');
      if (more && box.contains(more)) {
        // 「再看一个」：这一层多放一个备选出来
        const lk = more.dataset.more;
        TREE.more[lk] = (TREE.more[lk] || 0) + 1;
        TREE.touched = true;
        redraw();
        return;
      }
      if (ev.target.closest('#treeReset')) {
        TREE.open = {};
        TREE.more = {};
        TREE.openMore = {};
        TREE.touched = false;
        TREE.tried = {};
        VIEW = {k: 1, x: 0, y: 0, fitted: false};  // 恢复主线时视野也回到适配
        redraw();
        return;
      }
      const el = ev.target.closest('.tnode-item[data-key]');
      if (!el || !box.contains(el)) return;
      // 刚拖过画布就别当成点击
      if (dragMoved) return;
      const info = TREE.reg[el.dataset.key];
      if (!info || !info.canOpen) return;
      // 更深的层还没取过：直接去要，不用再点第二次
      if (!info.open && !info.hasNext) {
        el.classList.add('loading');
        const tg = el.querySelector('.tg');
        if (tg) tg.textContent = '…';
        fetchLevel(info.state).then(() => {
          TREE.open[nodeKey(info.path)] = true;
          TREE.touched = true;
          redraw();
        }).catch(e => {
          el.classList.remove('loading');
          if (tg) tg.textContent = '失败';
          el.title = '加载失败：' + e.message;
        });
        return;
      }
      TREE.open[nodeKey(info.path)] = !info.open;
      TREE.touched = true;
      redraw();
    };

    // ── 拖动平移：在框里空白处按下就拖，点节点不算 ──
    box.addEventListener('pointerdown', ev => {
      if (ev.button !== 0) return;
      if (ev.target.closest('.tnode-item,.tnode-more,#treeReset,.tzoom')) return;
      const wrap = box.querySelector('#treeWrap');
      if (!wrap) return;
      // 拦掉浏览器的默认拖拽/选字行为，否则一拖就选中一片文字
      ev.preventDefault();
      dragMoved = false;
      drag = {x: ev.clientX, y: ev.clientY, vx: VIEW.x, vy: VIEW.y, moved: 0};
      wrap.classList.add('grabbing');
      wrap.setPointerCapture(ev.pointerId);
    });
    box.addEventListener('pointermove', ev => {
      if (!drag) return;
      const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
      drag.moved = Math.max(drag.moved, Math.abs(dx) + Math.abs(dy));
      VIEW.x = drag.vx + dx;
      VIEW.y = drag.vy + dy;
      VIEW.touched = true;
      applyView();
    });
    const endDrag = ev => {
      if (!drag) return;
      dragMoved = drag.moved > 4;
      const wrap = box.querySelector('#treeWrap');
      if (wrap) {
        wrap.classList.remove('grabbing');
        if (wrap.hasPointerCapture(ev.pointerId)) wrap.releasePointerCapture(ev.pointerId);
      }
      drag = null;
      // 拖完立刻复位，免得挡住下一次正常点击
      setTimeout(() => { dragMoved = false; }, 0);
    };
    box.addEventListener('pointerup', endDrag);
    box.addEventListener('pointercancel', endDrag);

    // ── 滚轮缩放：以鼠标位置为中心 ──
    box.addEventListener('wheel', ev => {
      const wrap = box.querySelector('#treeWrap');
      if (!wrap || !wrap.contains(ev.target)) return;
      ev.preventDefault();
      const r = wrap.getBoundingClientRect();
      const k = VIEW.k * (ev.deltaY < 0 ? 1.12 : 1 / 1.12);
      zoomTo(k, ev.clientX - r.left, ev.clientY - r.top);
    }, {passive: false});
  }

  // 首次渲染：整棵树先缩到框里；之后重绘沿用当前视野（但要保证整棵树还在框内）
  if (!VIEW.touched) fitView(); else keepInView();
}

/** 当前选中的 combo（renderNew 里算过，交互里复用）。 */
function curCombo() {
  const combos = REP.combos || [];
  return combos[Math.min(COMBO, Math.max(0, combos.length - 1))] || {};
}

/** ⑤ 段的交互状态：
 *  TREE = { open: {节点键: true/false}, more: {层键: 放出几个},
 *           cache: {状态键: 层}, tried: {节点键: true}, auto: [待补取的层] }
 *
 *  默认铺开主变线路；同一层的备选收在「再看一个」里，点一次放出一个。
 *  备选下面不再自动铺——点它才展开（或收起）它下面那一层。
 *  open 记录用户手动开／关过哪些节点，覆盖默认的主变展开。 */
let TREE = { open: {}, more: {}, openMore: {}, cache: {}, reg: [], touched: false,
             auto: [], tried: {}, heads: {}, rows: [], world: null, topCols: 3 };

/** 节点键：从根往下选到它为止的角色序列。 */
function nodeKey(path) { return path.join('\u0001'); }

/** 层键：加前缀区分「层」与「节点」，根层的键也不会为空。 */
function layerKey(path) { return 'L' + path.join('\u0001'); }

/** 沿路径走到某一手的下一层：优先用预展开的 next，
 *  否则查「按需加载」缓存（用户点过展开就有）。都没有就返回 null。
 *  注意别用 more 提前判死——按需取回来的层里没有 more 字段。 */
function nextOf(state, hit, layer) {
  if (hit.next && hit.next.nodes) return hit.next;
  const after = stepState(state, hit, layer);
  return TREE.cache[treeKey(after)] || null;
}

/** 这个节点当前是否展开：用户手动开／关过就听用户的，否则主变节点默认展开。 */
function isOpen(npath, autoMain) {
  const k = nodeKey(npath);
  return (k in TREE.open) ? !!TREE.open[k] : !!autoMain;
}

/** 把一手的作用补进状态。ban 进 lban，pick 同时进 lpick 与 spicks。 */
function stepState(st, node, layer) {
  const kind = (layer && layer.kind) || '';
  const out = {
    idx: node.idx, taken: node.taken || 0,
    lban: (st.lban || []).slice(),
    lpick: (st.lpick || []).slice(),
    spicks: (st.spicks || []).slice(),
  };
  if (kind.endsWith('ban')) {
    if (out.lban.indexOf(node.char) < 0) out.lban.push(node.char);
  } else if (kind !== 'hunt_pick') {
    if (out.lpick.indexOf(node.char) < 0) out.lpick.push(node.char);
    if (out.spicks.indexOf(node.char) < 0) out.spicks.push(node.char);
  }
  return out;
}

/** 按需加载的缓存键：状态由阶段 + 已 ban + 已 pick + 已选唯一确定。 */
function treeKey(st) {
  return [st.idx, st.taken, (st.lban || []).join(','),
          (st.lpick || []).join(','), (st.spicks || []).join(',')].join('|');
}

/** 向后端要某一层的候选（预展开只有两层，更深的按需取）。 */
function fetchLevel(st) {
  const k = treeKey(st);
  if (TREE.cache[k]) return Promise.resolve(TREE.cache[k]);
  const m = REP.meta || {};
  const q = new URLSearchParams({
    team: m.team || '', player: m.player || '', game: String(m.game || 1),
    idx: String(st.idx), taken: String(st.taken || 0),
    map: m.map || '',
    lban: (st.lban || []).join(','), lpick: (st.lpick || []).join(','),
    spicks: (st.spicks || []).join(','),
    gone_hunt: (m.global_ban_hunt || []).join(','),
  });
  return fetch('/api/tree?' + q.toString())
    .then(r => r.json())
    .then(j => {
      if (!j.ok) throw new Error(j.error || '加载失败');
      const layer = { stage: j.stage, kind: j.kind, name: j.name,
                      actor: j.actor, nodes: j.nodes || [] };
      TREE.cache[k] = layer;
      return layer;
    });
}

/** ⑤ 树的几何参数：一层一行（从上往下），方块节点。 */
const TCOL = 132;    // 相邻节点的横向间距
const TROW = 132;    // 相邻两层的纵向间距
const TNW = 108;     // 节点宽（方形）
const TNH = 108;     // 节点高（方形）
const TPADX = 26;    // 画布左右留白
const TPADY = 34;    // 画布上留白
const TCOLS = 3;     // 同一层最多横向排几个节点（画布可缩放，不再靠折行）
const TMW = 76;      // 「再看一个」小方块的尺寸
const TMH = 76;

/** 节点内容。方形卡片：头像在上，角色名、评估值在下。
 *  isMain：这一手在主变线路上（默认高亮并展开下一层）。
 *  open：这一手的下一层已经铺开，再点就收起。 */
function nodeHtml(rec, nid) {
  const d = Number(rec.delta) || 0;
  const cls = ['tnode'];
  if (rec.isRoot) cls.push('root');
  else if (rec.isMore) cls.push('more');
  else if (rec.isBan) cls.push('ban');
  else cls.push('pick');
  if (rec.isMain) cls.push('main');
  if (rec.canOpen) cls.push('canopen');
  if (rec.open) cls.push('open');

  if (rec.isMore) {
    // 小方块：竖直方向压在同层候选的中线上，看起来像挂在父节点下的一枚
    return `<div class="${cls.join(' ')} tnode-more" `
      + `style="${posStyle(rec.x - TMW / 2, rec.y + (TNH - TMH) / 2, TMW, TMH)}" `
      + `data-more="${esc(rec.layerKey)}"><span class="nm">${esc(rec.label)}</span></div>`;
  }
  if (rec.isRoot) {
    return `<div class="${cls.join(' ')} tnode-root" `
      + `style="${posStyle(rec.x - rec.w / 2, rec.y, rec.w, TNH)}">`
      + `<span class="nm">③ 已定</span>`
      + `<span class="vv">${esc((rec.picks || []).join(' / ') || '—')}</span></div>`;
  }

  const dTxt = d > 1e-9 ? `<span class="dv good">+${d.toFixed(2)}</span>`
    : d < -1e-9 ? `<span class="dv danger">${d.toFixed(2)}</span>`
    : '<span class="dv dim">最优</span>';
  const tg = !rec.canOpen ? '' : (rec.open ? '‹ 收起' : '展开 ›');
  const tip = `${rec.char} · ${rec.stage} ${rec.name || ''} · 评估 ${Number(rec.value).toFixed(4)}`
    + (d ? `（相对本层最优 ${d > 0 ? '+' : ''}${d.toFixed(2)}）` : '（本层最优）')
    + (rec.by === 'lineup' ? ' · 这是「对手真掏这个监管」时的阵容分，不改变总评' : '');
  return `<div class="${cls.join(' ')} tnode-item" data-key="${nid}" `
    + `style="${posStyle(rec.x - TNW / 2, rec.y)}" title="${esc(tip)}">`
    + `<span class="ic">${Char.icon(rec.char, 28)}</span>`
    + `<span class="nm">${esc(rec.char)}</span>`
    + `<span class="vv">${f2(rec.value)} ${dTxt}</span>`
    + `<span class="tg">${tg}</span></div>`;
}

/** 方块节点的 style：世界坐标里的左上角 + 尺寸（根卡比普通方块宽）。 */
function posStyle(left, top, w, h) {
  const width = w || TNW;
  const height = h || TNH;
  return `left:${Math.round(left)}px;top:${Math.round(top)}px;`
    + `width:${Math.round(width)}px;height:${Math.round(height)}px`;
}

/** ⑤ 后面博弈树：从「③ 两手定下」出发，一层一行、从上往下用连线连起来。
 *
 *  分两步走，不再边铺边挪：
 *    1. 建图：把要显示的节点建成树，每个节点记录自己占几格（cols）。
 *    2. 排位：自顶向下分配列与行。每棵子树占满自己那几列，兄弟子树互不侵入；
 *       有主变子节点时父节点对齐它那一列（主线笔直），没有才取子节点中点。
 *  节点在画布上的位置 = 列中心 x、行 * 行距 y。 */
function gameTree(C) {
  const root = C.tree;
  const host = document.querySelector('#treeBox');
  if (!root || !root.nodes || !root.nodes.length) {
    const html = '<div class="meta">这份报告没有博弈树数据。</div>';
    if (host) host.innerHTML = html;
    return html;
  }
  TREE.reg = [];
  TREE.auto = [];
  TREE.avail = host ? host.clientWidth - 4 : 0;
  const reg = TREE.reg;

  // ── 第 1 步：建图 ──
  //  默认铺开主变线路；备选默认收起，点开才铺它下面那一层。
  //  同一层的备选收在「再看一个」里，点一次放出一个。

  /** 某一层要显示哪些候选：
   *  · 主线那一手总是显示；
   *  · 手动点开过的节点显示；
   *  · 其余备选一次只放出 n 个，点一下「再看一个」再多放一个。
   *  旁支（不是主线）的层不再默认显示第一手：它和「再看一个」放出来的
   *  是同一批候选，两边都放会变成两个同名节点。 */
  function shownOf(layer, path) {
    const lk = layerKey(path);
    const head = layer.nodes[0];
    // 每一层的第一手都算本层的主变，总是显示：主线层它就是主变线路的下一手；
    // 旁支层是教练点开后才出现的，不显示第一手的话，点开备选只会多出一个
    // 「再看一个」框，看起来像什么都没发生。
    // 显示与否不看 TREE.open：点开节点只是展开「它下面那一层」，
    // 不改这一层显示几个备选，否则每次点备选都会顺带多冒一个同层候选。
    const shown = [head];
    const rest = layer.nodes.filter(n => n !== head);
    const take = Math.min(rest.length, TREE.more[lk] || 0);
    return {shown: shown.concat(rest.slice(0, take)), left: rest.length - take, lk};
  }

  /** 递归铺一层，返回这一层的节点 id 列表（含「再看一个」）。 */
  function build(layer, state, path, depth, autoChain) {
    const {shown, left, lk} = shownOf(layer, path);
    const ids = [];
    const heads = [];

    shown.forEach(n => {
      const np = path.concat([n.char]);
      const isMain = !!autoChain && n === layer.nodes[0];
      const after = stepState(state, n, layer);
      // 这一手之后还有没有阶段：后端用 more 标了，或者已经预展开了 next。
      //  光看 more 不够——按需取回来的层里 more 可能是空的。
      //  ⑩ 监管选人就是最后一手，后面没有层了，一律不可展开。
      const canOpen = layer.kind !== 'hunt_pick'
        && (!!(n.more || (n.next && n.next.nodes)) || layer.hasMore !== false);
      const child = canOpen ? nextOf(state, n, layer) : null;
      const hasNext = !!child;
      const open = canOpen && isOpen(np, isMain);
      const rec = {
        char: n.char, value: n.value, delta: n.delta, stage: layer.stage,
        name: layer.name, depth, isMain, open, hasNext, canOpen,
        isBan: (layer.kind || '').endsWith('ban'),
        by: n.by || '',
        path: np, state: after, kids: [], cols: 1,
      };
      const id = reg.push(rec) - 1;
      if (isMain) heads.push({stage: layer.stage, name: layer.name, by: n.by || ''});

      if (open && child) {
        rec.kids = build(child, after, np, depth + 1, isMain);
      } else if (open && isMain && !TREE.tried[nodeKey(np)]) {
        // 主变线路还没预展开到这里：记账，稍后补取一层
        TREE.tried[nodeKey(np)] = true;
        TREE.auto.push({state: after, path: np});
      }
      ids.push(id);
    });

    // 「再看一个」：跟在本层节点后面，占同样一格，不画连线的末端。
    //  ⑩ 监管选人也要留这个入口——它只是不能再往下展开，
    //  其他监管仍然要能一个个放出来看。
    if (left > 0) {
      const id = reg.push({
        isMore: true, depth, kids: [], cols: 1, open: lk in TREE.openMore,
        label: `再看一个（还有 ${left} 个）`, layerKey: lk,
      }) - 1;
      ids.push(id);
    }
    if (heads.length) TREE.heads[depth] = heads[0];
    return ids;
  }
  // ── 根：③ 两手已经定下 ──
  //  根卡只比普通方块宽一点（够放下两手角色名），不铺满整行，
  //  否则整棵树会被这张宽卡撑偏，主线看起来不在中间。
  const rootId = reg.push({
    isRoot: true, depth: 0, kids: [],
    picks: C.picks || [], w: Math.max(TNW, Math.min(220, TREE.avail || 220)),
  }) - 1;
  TREE.heads = {};
  reg[rootId].kids = build(root, C.tree_state || null, [], 1, true);

  // ── 第 2 步：排位 ──
  //  标准的「子树占位」排法：每个节点独占一片横向列区间，子树之间左右相邻，
  //  互不侵入。「再看一个」在建图时就是父节点的最后一个子节点，所以它天然
  //  排在所有候选的右边，并且占自己那份位置——不存在「事后贴上去」的情况，
  //  也就不会跨到兄弟子树中间。

  //  2.1 自底向上：cols = 这棵子树横向要占几个格。
  //      叶子占 1 格；有子节点就是所有子节点宽度之和。
  const colsOf = id => {
    const r = reg[id];
    const kids = r.kids || [];
    if (!kids.length) { r.cols = 1; return 1; }
    r.cols = kids.reduce((s, k) => s + colsOf(k), 0);
    return r.cols;
  };
  colsOf(rootId);

  //  2.2 自顶向下分配列。left = 这棵子树最左边那一格的列号。
  //      子节点依次占用 [left, left+cols)，兄弟子树互不侵入 —— 这是不重叠的保证。
  //
  //      父节点居中分两种情况：
  //        · 有主变子节点时，父节点**直接对齐它那一列**。主线是父 → 主变子 →
  //          主变子……一路下去，所以整条主线落在同一列，永远笔直。
  //        · 旁支（没有主变子节点）按首尾子节点的中点居中。
  //
  //      父节点对齐主变子节点后，它可能不在这棵子树的中心，因此子树整体
  //      仍按 [left, left+cols) 占位——不重叠由「子节点依次排」保证，
  //      与父节点落在哪一列无关。
  //
  //      「再看一个」是 build 时挂在末位的子节点，所以一定排在所有候选之后，
  //      并且占自己那一份位置，不会跨到兄弟子树中间。
  const place = (id, left, row) => {
    const r = reg[id];
    r.row = row;
    const kids = r.kids || [];
    if (!kids.length) { r.col = left; return; }
    let c = left;
    kids.forEach(k => {
      place(k, c, row + 1);
      c += reg[k].cols;
    });
    const mainKid = kids.find(k => reg[k].isMain);
    if (mainKid) {
      r.col = reg[mainKid].col;
    } else {
      const first = reg[kids[0]], last = reg[kids[kids.length - 1]];
      r.col = (first.col + last.col) / 2;
    }
  };
  place(rootId, 0, 0);

  //  2.4 整棵树以主线为竖直中轴：主线各层应落在同一列，
  //      把那一列挪到 0 列（画布正中），左右两边的备选各占各的，
  //      这样主变永远在视觉正中间，不会因为右边多挂了几个备选就偏。
  let axisCol = null;
  (function walk(id) {
    const r = reg[id];
    if (r.isMain && axisCol == null) axisCol = r.col;
    (r.kids || []).forEach(k => { if (!reg[k].isMore) walk(k); });
  })(rootId);
  if (axisCol == null) axisCol = reg[rootId].col;
  reg.forEach(r => { r.col -= axisCol; });
  // 根卡和主线压在同一列上
  reg[rootId].col = 0;

  const xOf = c => TPADX + TNW + c * TCOL;   // 0 列左边再留一格给左侧分叉
  const yOf = r => TPADY + r * TROW;
  reg.forEach(n => {
    n.x = xOf(n.col);
    n.y = yOf(n.row || 0);
  });

  // ── 世界层尺寸：整棵树画在固定大小的世界里，由外层框平移缩放 ──
  let minX = Infinity, maxX = -Infinity, maxRow = 0;
  reg.forEach(r => {
    const half = (r.isRoot ? r.w : r.isMore ? TMW : TNW) / 2;
    minX = Math.min(minX, r.x - half);
    maxX = Math.max(maxX, r.x + half);
    maxRow = Math.max(maxRow, r.row);
  });
  // 整棵树先挪到留白之内（排位从第 0 列起，根挂在中间时可能越到左边）。
  // 必须在画连线之前平移，否则节点动了、线还停在原处。
  const dx0 = TPADX - minX;
  if (Math.abs(dx0) > 0.5) reg.forEach(r => { r.x += dx0; });

  // ── 连线：父节点下缘端正中的一条竖线，再弯到子节点上缘 ──
  //  「再看一个」也是子节点，用虚线连，表示「还有别的选择」。
  const edges = [];
  reg.forEach(p => {
    (p.kids || []).forEach(kid => {
      const c = reg[kid];
      const x1 = p.x, y1 = p.y + TNH, x2 = c.x, y2 = c.y;
      const dy = Math.max(10, (y2 - y1) * 0.5);
      edges.push({main: c.isMain && !c.isMore, dashed: !!c.isMore,
                  d: `M${x1},${y1} C${x1},${y1 + dy} ${x2},${y2 - dy} ${x2},${y2}`});
    });
  });

  const worldW = Math.round(maxX - minX + TPADX * 2);
  const worldH = yOf(maxRow) + TNH + TPADY;
  // 缓存世界尺寸，供「适配视野」计算缩放比
  TREE.world = {w: worldW, h: worldH};

  const nodes = reg.map((r, i) => nodeHtml(r, String(i))).join('');

  // 每层左边标一下这是什么阶段（固定在框里，不跟着缩放平移走）
  TREE.rows = [];
  const seen = {};
  reg.forEach(r => {
    if (r.isRoot || seen[r.row]) return;
    seen[r.row] = true;
    const h = TREE.heads[r.depth] || r;
    TREE.rows.push({y: r.y + TNH / 2, stage: h.stage || '', name: h.name || '',
                    by: h.by || ''});
  });

  // 最终阵容跟主线一致：沿着主变线路走一遍，把「求生选人」那几手拼起来。
  // 直接从树上算，而不是用报告里预生成的那份——教练换了路径之后，
  // 这里要跟着变，否则会出现「主线选了气象学家、最终阵容里却没有」。
  const mainChars = [];
  (function walk(id) {
    const r = reg[id];
    if (r.isRoot) {
      (r.picks || []).forEach(c => mainChars.push(c));
    } else if (r.isMain && !r.isBan && !r.isMore && r.char) {
      mainChars.push(r.char);
    }
    const kid = (r.kids || []).find(k => reg[k].isMain);
    if (kid != null) walk(kid);
  })(rootId);
  const lineup = mainChars.length ? mainChars : (C.lineup || []);
  // 评估值：主线走到 ⑩ 时，那一手的 value 就是「这套阵容对这名监管」
  // 的期望分（后端按 lineup_score 算的），比报告里那份静态值更贴合当前主线。
  // 主线还没走到 ⑩（或没有 ⑩）就退回报告里预生成的值。
  const huntMain = reg.find(r => r.isMain && r.stage === '⑩');
  const lineupValue = huntMain ? huntMain.value : (C.expect ?? C.half_value);
  // 救人位个数按当前主线阵容现算，不能再用报告里那串静态数字——
  // 换了路径它就对不上了。名单优先用后端下发的（老报告里没有这个字段），
  // 拿不到时退回报告自带的几个字段。
  const pool = SOLID_CHARS.length ? SOLID_CHARS : ((REP.meta || {}).solid_chars || []);
  const solidN = pool.length
    ? lineup.filter(c => pool.indexOf(c) >= 0).length
    : (C.lineup_solid_n ?? (C.solid || []).length);
  const endRow = `
    <div class="tend">
      <span class="dim">最终阵容</span>
      <span class="chips">${chips(lineup)}</span>
      <span class="dim">评估</span><b>${f2(lineupValue)}</b>
      <span class="dim">（救人位 ${solidN} 个）</span>
    </div>`;

  const html = `<div class="tbar">从上往下看：最上面是起点，每次选择算一层。白色实线是主变线路，默认一路连到底；`
    + `白色虚线指向「再看一个」，同一层的备选收在里面，点一次放出一个，点备选再展开它下面那一层；`
    + `最后一层「监管选人」只展示，不能展开。`
    + `框里按住空白处可拖动，滚轮缩放。`
    + `${TREE.touched ? ' <button type="button" id="treeReset" class="mini">恢复主线</button>' : ''}</div>`
    + `<div class="treewrap" id="treeWrap">`
    + `<div class="trows" id="treeRows">${rowsHtml()}</div>`
    + `<div class="tcanvas" id="treeWorld" style="width:${worldW}px;height:${worldH}px">`
    + `<svg class="tedges" width="${worldW}" height="${worldH}">`
    + edges.map(e => `<path d="${e.d}" fill="none" `
        + `stroke-width="${e.dashed ? '2.4' : e.main ? '2.8' : '1.6'}" `
        + `stroke-dasharray="${e.dashed ? '7 5' : 'none'}" `
        + `stroke-linecap="${e.dashed ? 'butt' : 'round'}" `
        + `stroke="${e.dashed ? '#ffffff' : e.main ? '#ffffff' : '#c8cfdd'}"/>`).join('')
    + `</svg>${nodes}</div>`
    + `<div class="tzoom"><button type="button" data-zoom="out" title="缩小">−</button>`
    + `<button type="button" data-zoom="in" title="放大">+</button>`
    + `<button type="button" class="wide" data-zoom="fit" title="整棵树缩到框里">适配</button></div>`
    + `</div>${endRow}`;
  // 容器已经在页面上了就只换内容：容器本身和绑在它上面的点击要留着
  if (host) host.innerHTML = html;
  // 视野：整棵树缩到框里（用户拖过/缩放过就沿用当前视野，但保证整棵树仍在框内）
  if (!VIEW.touched) fitView(); else keepInView();
  requestAnimationFrame(() => { if (!VIEW.touched) fitView(); else keepInView(); });
  kickAuto();
  return html;
}

/** 主变线路还没预展开到的地方：取下一层，取回来就重绘。
 *  同一时间只跑一个，避免一层层并发打后端。 */
let autoBusy = false;
function kickAuto() {
  if (autoBusy || !TREE.auto.length) return;
  autoBusy = true;
  const job = TREE.auto[0];
  TREE.auto = [];
  fetchLevel(job.state)
    .then(() => { autoBusy = false; gameTree(curCombo()); })
    .catch(() => { autoBusy = false; });
}

/** 每层左边那列阶段标签：竖屏坐标跟着世界层一起换算，贴在框内左边。 */
function rowsHtml() {
  return (TREE.rows || []).map(r =>
    `<div class="trowhead" style="top:${Math.round(VIEW.y + r.y * VIEW.k)}px">`
    + `<b>${esc(r.stage)}</b> ${esc(r.name)}`
    + (r.by === 'lineup' ? '<i>阵容分</i>' : '') + '</div>').join('');
}

/** ① 段的监管倾向排名：该选手全部候选监管，按这组 ban 的指向打分从高到低。
 *  条形按最高分归一，右边同时给占比（分数 ÷ 全部正分之和）和原始分。
 */
function hunterRank(C) {
  let rows = (C.hunter_rank || []).slice();
  if (!rows.length) {
    // 旧报告没有 hunter_rank 字段，退回只有前 3 的 hunter_scores
    rows = (C.hunter_scores || []).slice();
  }
  if (!rows.length) return '<div class="meta" style="margin-top:10px">这份报告没有监管倾向数据。</div>';
  const pos = rows.map(x => Math.max(Number(x.score) || 0, 0));
  const tot = pos.reduce((a, v) => a + v, 0) || 1;
  const hi = Math.max(...pos) || 1;
  const body = rows.map((x, i) => {
    const s = pos[i];
    const w = Math.max(2, s / hi * 100);
    const top = i === 0 && s > 0;
    const pct = s > 0 ? (s / tot * 100).toFixed(0) + '%' : '—';
    return `<div class="rk${top ? ' top' : ''}" title="${esc(x.char)} · ${pct} · 原始分 ${Number(x.score).toFixed(2)}">
      <span class="i">${i + 1}</span>
      <span class="who">${Char.icon(x.char, 16)}<span>${esc(x.char)}</span></span>
      <span class="bar"><i style="width:${w.toFixed(1)}%"></i></span>
      <span class="pct">${pct}</span>
      <span class="val">${Number(x.score).toFixed(1)}</span>
    </div>`;
  }).join('');
  return `<div class="col">
    <div class="meta">这组 ban 最可能是在为谁清路 —— 该选手用过的
      <b>${rows.length}</b> 个监管全部列出，按指向强度排序（百分比是分数占比，不是严格概率）。</div>
    <div class="rank">${body}</div>
  </div>`;
}

/** ① 段里的地图区块：这张图上对手更可能拿谁，紧跟在「当前选择」下面。
 *  候选集合随下拉的 ban 组合变化，块内按该图倍数从高到低排。
 */
function mapIntentBlock(C, m) {
  if (!m.map) {
    return `<div class="meta" style="margin-top:10px">这次没指定地图，推演按全联盟口径，
      所以没有地图倾向。要按地图看，回生成页在第 3 步选一张图再生成。</div>`;
  }
  // 优先用 ① 段的全量排名（每项都带该图倍数），旧报告没有 mult 时退回意图数据。
  let base = (C.hunter_rank && C.hunter_rank.length)
    ? C.hunter_rank : (C.rankWithMult || []);
  let rows = base.filter(x => x.mult != null)
                 .map(x => ({char: x.char, mult: Number(x.mult)}));
  if (!rows.length) {
    rows = (C.intent || []).filter(x => x.mult != null)
                           .map(x => ({char: x.char, mult: Number(x.mult)}));
  }
  if (!rows.length) return '';
  rows.sort((a, b) => b.mult - a.mult);
  const hi = Math.max(...rows.map(x => x.mult), 1);
  const body = rows.map(x => {
    // 条形长度按该图份额算，颜色用赤/绿表示偏多偏少
    const w = Math.max(2, x.mult / hi * 100);
    return `<div class="rk" title="${esc(x.char)}：这张图的出场份额是全联盟的 ${x.mult.toFixed(2)} 倍">
      <span class="who">${Char.icon(x.char, 16)}<span>${esc(x.char)}</span></span>
      <span class="bar"><i style="width:${w.toFixed(1)}%;background:${
        x.mult >= 1 ? 'linear-gradient(90deg,#2f7a63,#6dc4a0)'
                    : 'linear-gradient(90deg,#8a4038,#d4645c)'}"></i></span>
      <span class="pct">×${x.mult.toFixed(2)}</span>
    </div>`;
  }).join('');
  return `<div class="col">
    <div class="meta"><b>${esc(m.map)}</b> 这张图上对手更可能拿谁
      （×倍数 = 该图份额 ÷ 全联盟份额，1.00 为平均；绿色偏高、红色偏低）</div>
    <div class="rank">${body}</div>
  </div>`;
}

/** 本次生成用的设置：监管数据来源、求生角色池、全局禁选。 */function settingsCard() {
  const m = REP.meta || {};
  const gs = m.global_ban_surv || [];
  const gh = m.global_ban_hunt || [];
  const pool = m.our_pool || [];
  let src;
  if (m.scores_source) {
    src = `导入的配置 <b>${esc(m.scores_source)}</b>`;
  } else {
    src = '预编辑基准表';
  }
  const rosterSrc = m.roster_source
    ? `导入的配置 <b>${esc(m.roster_source)}</b>`
    : '预编辑基准角色池';
  const kv = (k, v) => `<div class="kv"><span class="k">${k}</span>`
    + `<span class="v">${v}</span></div>`;
  return `<div class="card">
    <h2><span class="num">i</span>本次生成用的设置</h2>
    <p class="lead">这些是生成这份报告时的输入，换掉其中任何一项都会得到不同的结论。</p>
    <div class="two">
      <div>
        ${kv('对局', `${esc(m.team)}（求生） vs ${esc(m.player)}（监管） · 第 ${m.game} 局`)}
        ${kv('地图', m.map
          ? `<b>${esc(m.map)}</b>（影响候选排序与评估值，不改任何分数格）`
          : '<span class="dim">未指定（按全联盟口径）</span>')}
        ${kv('我方 ban 名额', `${m.ban_quota ?? 0} 个（第 1 局 0、第 2 局 1、第 3 局起 2）`)}
        ${kv('可选 ban 组合', `${m.combo_count ?? '—'} 组（第 ① 段可切换）`)}
        ${kv('监管数据', src)}
        ${kv('求生角色池', `${rosterSrc} · ${esc(m.team)} 共 ${pool.length} 个`)}
      </div>
      <div>
        ${kv('我方已用掉的求生', gs.length ? chips(gs) : '<span class="dim">无</span>')}
        ${kv('对方已用掉的监管', gh.length ? chips(gh) : '<span class="dim">无</span>')}
      </div>
    </div>
    ${pool.length ? `<div class="meta" style="margin-top:8px">
      我方角色池：${chips(pool)}</div>` : ''}
  </div>`;
}
