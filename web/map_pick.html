<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地图偏好 · IVL 2026 秋</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="char.css">
<style>
main{max-width:1080px;margin:0 auto;padding:18px 20px 60px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
label.lbl{color:var(--dim);font-size:12px}
.hint{color:var(--dim);font-size:11.5px;line-height:1.8}
th,td{padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap;
  text-align:center}
thead th:first-child,tbody th{text-align:left}
tbody th{background:var(--panel2);font-weight:500;font-size:12px;
  padding-left:10px}
tbody th .who{display:block;font-size:10px;color:var(--dim);font-weight:400}
tbody tr:last-child th,tbody tr:last-child td{border-bottom:none}
tfoot td,tfoot th{border-top:1px solid var(--border);background:rgba(107,140,255,.06);
  font-weight:600}
td.n{font-family:Consolas,monospace}
td.z{color:var(--faint)}
td.top{background:var(--accent-soft);color:var(--accent-hi);font-weight:600}
td.na{color:var(--faint);background:rgba(255,255,255,.02)}
.legend{color:var(--dim);font-size:11.5px;line-height:1.9;margin-top:10px}
.legend b{color:var(--text)}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;
  background:rgba(107,140,255,.35);vertical-align:-1px;margin-right:4px}
</style>
</head>
<body>
<header>
  <a href="index.html" class="home">← 首页</a>
  <h1>地图偏好</h1>
  <span class="sub">哪支队伍在第几局选了什么图</span>
</header>

<main>
  <section class="card">
    <h2>队伍 <span class="badge" id="seatBadge"></span></h2>
    <div class="row">
      <label class="lbl">选择队伍</label>
      <select id="teamPick"></select>
      <span class="hint" id="subHint"></span>
    </div>
    <div class="tablewrap"><table id="tbl"></table></div>
    <div class="legend">
      <b>图权怎么轮</b>：第一局主队、第二局客队、第三局主队、第四局客队、第五局主队，
      加时视同第四局算客队。所以同一支队在不同局次的选图，要看那一局图权在不在他手上。<br>
      表格只统计「选图」，不含禁图；同一场里地图不可重复选择，所以一行之内不会出现重复的图。<br>
      <span class="sw"></span>标出的是该局他选得最多的图。
    </div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
let DATA = null;     // 全量（含所有队伍的 rows）

const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
                                .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

async function boot() {
  const r = await fetch('/api/map_pick');
  if (!r.ok) throw new Error('HTTP ' + r.status);
  DATA = await r.json();
  const sel = $('#teamPick');
  sel.innerHTML = DATA.teams.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
  sel.onchange = () => render(sel.value);
  render(DATA.teams[0]);
}

function render(team) {
  const rows = DATA.rows[team] || [];
  const maps = DATA.maps;
  const seat = DATA.seats[team] || {home: 0, away: 0};
  $('#seatBadge').textContent = `主队 ${seat.home} 场 · 客队 ${seat.away} 场`;
  $('#subHint').textContent = '共参与 ' + (seat.home + seat.away) + ' 场';

  const head = '<thead><tr><th>局次</th>'
    + maps.map(m => `<th>${esc(m)}</th>`).join('')
    + '<th>小计</th></tr></thead>';

  let body = '';
  for (const row of rows) {
    const who = row.owner === 'home' ? '主队选图' : '客队选图';
    if (!row.has_right) {
      body += `<tr><th>${esc(row.slot)}<span class="who">${who}</span></th>`
        + maps.map(() => '<td class="na">—</td>').join('')
        + '<td class="na">—</td></tr>';
      continue;
    }
    const mx = Math.max(0, ...maps.map(m => row.counts[m] || 0));
    body += `<tr><th>${esc(row.slot)}<span class="who">${who}</span></th>`
      + maps.map(m => {
          const n = row.counts[m] || 0;
          if (!n) return '<td class="n z">·</td>';
          return `<td class="n${n === mx ? ' top' : ''}">${n}</td>`;
        }).join('')
      + `<td class="n">${row.total}</td></tr>`;
  }

  const tot = DATA.totals[team] || {};
  const grand = maps.reduce((a, m) => a + (tot[m] || 0), 0);
  const foot = '<tfoot><tr><th>合计</th>'
    + maps.map(m => `<td class="n">${tot[m] || '·'}</td>`).join('')
    + `<td class="n">${grand}</td></tr></tfoot>`;

  $('#tbl').innerHTML = head + '<tbody>' + body + '</tbody>' + foot;
}

boot().catch(e => {
  $('#tbl').innerHTML = `<tbody><tr><td>读取失败：${esc(e.message)}</td></tr></tbody>`;
});
</script>
</body>
</html>
