<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据 · IVL 2026 秋</title>
<link rel="stylesheet" href="char.css">
<style>
:root{
  --bg:#12141a;--panel:#191c24;--panel2:#21252f;--border:#2c313d;
  --text:#dfe5f0;--dim:#8a93a6;--accent:#6b8cff;
  --ok:#6dc4a0;--err:#e0837b;--warn:#d8b25f;
  --low:#d4645c;--mid:#d8b25f;--high:#6dc4a0;
  --solid:#9db2ff;--hard:#c98b4b;--midd:#b39ddb;--soft:#7ec8e3;
}
*{box-sizing:border-box}
/* 铺满屏幕宽度；高度由内容自然撑开，只允许纵向滚动，绝不横向溢出 */
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  overflow-x:hidden;
  display:flex;flex-direction:column;
  font:13px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
header{padding:10px 20px;border-bottom:1px solid var(--border);
  background:var(--panel);flex:none;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap}
header h1{margin:0;font-size:15px;font-weight:600}
/* 「← 首页」统一固定在页首最左，作为所有页面的唯一回退入口 */
a.home{color:var(--dim);text-decoration:none;font-size:12.5px;
  padding:4px 10px;border-radius:6px;border:1px solid var(--border);flex:none}
a.home:hover{color:var(--text);border-color:var(--accent)}
main{flex:1;width:100%;margin:0 auto;padding:12px 18px 16px;
  display:flex;flex-direction:column}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;
  padding:12px 16px;margin-bottom:12px;
  display:flex;flex-direction:column;min-width:0}
.card h2{margin:0 0 3px;font-size:13.5px;font-weight:600;flex:none;
  display:flex;align-items:center;gap:10px}
.card .sub{color:var(--dim);font-size:11.5px;margin-bottom:8px;flex:none}
.badge{font-size:11px;padding:1px 8px;border-radius:10px;font-weight:500}
.badge.base{background:rgba(138,147,166,.2);color:#a9b2c3}
.badge.custom{background:rgba(109,196,160,.18);color:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px;
  flex:none}
button{background:var(--panel2);color:var(--text);border:1px solid var(--border);
  border-radius:6px;padding:5px 12px;font-size:12.5px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:#2a3f6e;border-color:var(--accent);color:#cfe0ff}
button.danger:hover{border-color:#d4645c;color:#e79b94}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=file]{display:none}
select,input[type=search]{background:var(--panel2);color:var(--text);
  border:1px solid var(--border);border-radius:6px;padding:5px 9px;font-size:12.5px}
.msg{font-size:12px;margin-left:6px}
.msg.ok{color:var(--ok)} .msg.err{color:var(--err)} .msg.warn{color:var(--warn)}
.hint{color:var(--dim);font-size:11.5px;line-height:1.7}
code{background:var(--panel2);padding:1px 5px;border-radius:4px;
  font:11px Consolas,monospace}

/* ── 视图切换用的 pane ── */
.pane{display:none}
.pane.on{display:block}

/* ── 分数表 ── */
/* 宽度铺满容器、绝不横向溢出：列宽由 fitTable() 按容器宽度分配。
   纵向由页面整体滚动，表格本身不再单独出滚动条。 */
.tablewrap{width:100%;border:1px solid var(--border);border-radius:8px;
  overflow-x:hidden}
table{border-collapse:separate;border-spacing:0;width:100%;max-width:100%;
  table-layout:fixed;font-size:12px}
thead th.hhead{position:relative;padding-top:2px}
thead th.hhead .hcnt{display:block;font:8.5px Consolas,monospace;
  color:#5b6373;line-height:1}
th,td{padding:0 3px;border-bottom:1px solid var(--border);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
thead th{background:var(--panel2);font-weight:600;color:var(--dim);font-size:10.5px;
  height:46px}
thead th.hhead .char-chip{flex-direction:row;gap:3px;font-size:10.5px;
  justify-content:center;overflow:hidden;height:42px}
thead th.hhead .char-avatar{width:42px;height:42px}
/* 列太窄时只留角色名，避免头像把名字挤成一个字 */
table.tight thead th.hhead .char-avatar{display:none}
table.tight thead th.hhead .char-chip{font-size:9.5px}
tbody th{background:var(--panel2);text-align:left;font-weight:500;
  padding-left:6px}
/* 求生行首的出场次数，与表头监管的次数样式保持一致 */
tbody th.shead .hcnt{float:right;padding-right:5px;font:9px Consolas,monospace;
  color:#5b6373}
tbody th .char-chip{font-size:11px}
/* 首列角色名优先完整显示，宁可挤一点其他列 */
tbody th .char-name{overflow:visible}
tbody th .char-avatar{width:25px;height:25px}
td.v{text-align:right;font-family:Consolas,monospace}
td.v .sc{font-family:Consolas,monospace;font-weight:600}
td.na{color:#3d4353;text-align:center}
.num{text-align:right;font-family:Consolas,monospace}
.stat{color:var(--dim);font-size:12px}
.stat b{color:var(--text)}

/* ── 选手榜 ── */
/* 仅展示：用下拉切换「总榜 / 某位选手」，不再用卡片列表 */
.lbl{color:var(--dim);font-size:12px}
#pViewPick{min-width:190px}
.cellbox{display:inline-flex;align-items:center;gap:3px}
.cellbox i{font-style:normal}
.cellbox .sc{font-family:Consolas,monospace;font-weight:600}
td .sc{font-family:Consolas,monospace}
.cellbox .gap{font:10px Consolas,monospace;color:var(--dim)}
.cellbox.ownmax .sc{color:var(--ok)}
.legend{font-size:11px;color:var(--dim);line-height:1.6;margin-bottom:6px;
  flex:none}
.legend b{color:var(--text)}
</style>
</head>
<body>
<header>
  <a href="index.html" class="home">← 首页</a>
  <h1>数据</h1>
</header>

<main>
  <!-- ══════════ 总榜 / 选手榜（下拉切换视图，纯展示） ══════════ -->
  <div class="pane on" id="pane-player">
    <section class="card">
      <h2 id="pTitle">总榜（全联盟） <span class="badge base" id="scoreBadge">默认</span></h2>
      <div class="row">
        <label class="lbl">视图</label>
        <select id="pViewPick">
          <option value="">总榜（全联盟）</option>
        </select>
        <label class="lbl" id="mapLbl" style="margin-left:12px">地图</label>
        <select id="mapPick">
          <option value="">全部地图</option>
        </select>
        <span class="sub" id="pSub" style="margin:0"></span>
        <span class="stat" id="sStat" style="margin-left:auto"></span>
      </div>
      <div class="legend" id="pLegend"></div>
      <div class="tablewrap"><table id="pTable"></table></div>
    </section>
  </div>
</main>

<script src="char.js"></script>
<script>
const $ = s => document.querySelector(s);
const HUNTERS = [];
let SCORES = {cells: {}};
let PS = null;              // 选手榜数据
let CUR_P = null;           // 当前查看的选手
let MAPDATA = null;         // 地图统计（/api/maps）
let CUR_MAP = '';           // 当前筛的地图（'' = 全部）

/** 分数统一显示两位小数（1.5 → 1.50，0.9167 → 0.92） */
function f2(v) {
  if (v == null || !isFinite(v)) return '—';
  return Number(v).toFixed(2);
}

/** 分数染色：2.00 是居中值。越低说明求生方越难打（红），越高越舒服（绿）。 */
function scoreColor(s) {
  if (s == null || !isFinite(s)) return 'var(--dim)';
  const v = Number(s);
  // 分段插值：0 → 深红，2.0 → 中性，4+ → 深绿
  if (v <= 1.0) return '#e0605a';
  if (v <= 1.6) return '#e08a6a';
  if (v <= 2.0) return '#cfa14f';
  if (v <= 2.5) return '#9dbf6a';
  return '#5fbf8f';
}
function scoreBg(s) {
  if (s == null || !isFinite(s)) return 'transparent';
  const v = Math.max(0, Math.min(4, Number(s)));
  // 以 2.0 为中心：低分偏红、高分偏绿，透明度随偏离程度增强
  const d = (v - 2.0) / 2.0;                       // -1 ~ +1
  const a = Math.min(0.55, Math.abs(d) * 0.60 + 0.05);
  return d < 0 ? `rgba(212,100,92,${a.toFixed(3)})`
               : `rgba(109,196,160,${a.toFixed(3)})`;
}

/** 名称字典序：忽略大小写比较，大小写只在小写后仍相同时才用来分先后 */
function byName(a, b) {
  const x = a.toLowerCase(), y = b.toLowerCase();
  if (x !== y) return x < y ? -1 : 1;
  return a < b ? -1 : (a > b ? 1 : 0);
}

/* ── 铺满屏幕：宽度铺满、纵向可滚动，任何情况下都不横向溢出 ──
 * 关键约束：表格必须能在任意窗口宽度下把所有监管列塞进来。
 *   1. 首列（求生角色）给固定像素宽
 *   2. 剩余宽度在监管列之间均分
 *   3. 单列过窄时，字号自动缩小以适应文字
 */
function fitTable(tbl) {
  if (!tbl || !tbl.rows.length) return;
  const wrap = tbl.parentElement;
  const avail = wrap.clientWidth - 2;           // 减去边框
  if (avail <= 0) return;
  const cols = tbl.rows[0].cells.length;
  if (!cols) return;

  // 首列宽度：要放下「头像 + 4 个汉字的角色名」
  const firstW = Math.round(Math.min(126, Math.max(92, avail * 0.12)));
  const restW = Math.max(24, (avail - firstW) / Math.max(1, cols - 1));

  tbl.style.width = avail + 'px';
  for (const tr of tbl.rows) {
    if (tr.cells[0]) tr.cells[0].style.width = firstW + 'px';
    for (let i = 1; i < tr.cells.length; i++) {
      tr.cells[i].style.width = Math.floor(restW) + 'px';
    }
  }

  // 列太窄时缩字号：一格至少要放下 "1.85" 这种 4 字符
  const fs = Math.max(8, Math.min(12, restW / 4.2));
  tbl.style.fontSize = fs + 'px';
  const head = tbl.tHead ? tbl.tHead.rows[0] : null;
  if (head) {
    // 表头要放下头像 + 2~4 个字的角色名，放不下就把头像藏掉只留名字
    const nameW = restW - 22;
    tbl.classList.toggle('tight', nameW < 30);
  }
}

/** 统一的重新布局入口：按容器宽度给表格重新分配列宽 */
function relayout() {
  fitTable($('#pTable'));
}
window.addEventListener('resize', relayout);

async function api(url, opts) {
  const r = await fetch(url, opts);
  const t = await r.text();
  let j = null;
  try { j = JSON.parse(t); } catch (_) {}
  if (!r.ok) throw new Error((j && (j.error || (j.errors || []).join('；'))) || ('HTTP ' + r.status));
  return j;
}

// ══════════ 总榜（仅展示） ══════════
async function loadScores() {
  const d = await api('/api/scores');
  SCORES = d;
  HUNTERS.length = 0;
  HUNTERS.push(...(d.all_hunters || []));
  showView(CUR_P || '');
}

/** 表头：头像 + 角色名 + 出场次数
 *  未选地图时显示全季出场次数；选了地图时改成「该图倍数」。
 *  倍数是收缩后的份额之比，该图只出场 1~2 次的角色会被放大到 ×4 以上，
 *  这类倍数不可信，所以用 `*` 单独标出来（详细场次写在 title 里）。
 */
function hunterHead(h) {
  const n = (SCORES.hunter_counts || {})[h];
  let extra = n ? `<span class="hcnt">${n}</span>` : '';
  let tip = `${h}（本季出场 ${n ?? 0} 次）`;
  if (CUR_MAP && MAPDATA) {
    const st = (MAPDATA.stats || {})[CUR_MAP];
    const row = st && (st.hunters || []).find(x => x.char === h);
    const v = row ? Number(row.mult) : 0;
    const cnt = row ? Number(row.n) : 0;
    const col = v >= 1.5 ? 'var(--high)' : (v <= 0.5 ? 'var(--low)' : '#5b6373');
    // 该图不足 3 场的倍数不稳定，加 * 并压暗
    const few = cnt < 3;
    extra = `<span class="hcnt" style="color:${few ? '#4a5160' : col}">`
      + `×${v.toFixed(2)}${cnt > 0 && few ? '<span style="color:var(--warn)">*</span>' : ''}</span>`;
    tip = `${h} · ${CUR_MAP}：出场 ${cnt} 次 / 该图共 ${st ? st.halves : 0} 局`
      + ` · 倍数 ×${v.toFixed(2)}（收缩后份额 ÷ 全联盟份额）`
      + (few ? ' · 样本不足 3 场，倍数仅供参考' : '');
  }
  return `<th class="hhead" title="${Char.esc(tip)}">`
    + Char.chip(h, {size: 42}) + extra + '</th>';
}

/** 选了地图时，监管列按该图出场场次重排（该图常用的排前面）。
 *  不用倍数排序：低频角色（全局只出场几次）的收缩倍数会被放大到 4 倍以上，
 *  按它排会让「该图只上过 3 场」的角色顶到最前，误导教练。
 *  倍数只作为表头标注，用来读「相对全联盟偏多还是偏少」。
 */
function orderedHunters() {
  if (!CUR_MAP || !MAPDATA) return HUNTERS;
  const st = (MAPDATA.stats || {})[CUR_MAP];
  if (!st) return HUNTERS;
  const cnt = new Map();
  (st.hunters || []).forEach(x => cnt.set(x.char, Number(x.n) || 0));
  return HUNTERS.slice().sort((a, b) => (cnt.get(b) || 0) - (cnt.get(a) || 0));
}

/** 总榜表格：只读展示，格子染成红绿表示难度 */
function renderScores() {
  // 求生行按本季总出场次数降序，出现最多的排最前
  const cnt = SCORES.survivor_counts || {};
  const chars = (SCORES.all_survivors || []).slice().sort(
    (a, b) => (cnt[b] || 0) - (cnt[a] || 0) || byName(a, b));
  const cols = orderedHunters();
  const head = '<thead><tr><th>求生 \\ 监管</th>' +
    cols.map(hunterHead).join('') + '</tr></thead>';
  const body = chars.map(c => {
    const row = SCORES.cells[c] || {};
    const tds = cols.map(h => {
      const v = row[h];
      if (v === undefined) return '<td class="na">—</td>';
      const sc = (typeof v === 'number') ? v : v.score;
      // 底色表达「这套阵容好不好打」：偏红 = 求生方吃亏，偏绿 = 占便宜
      return `<td class="v" style="background:${scoreBg(sc)}">`
        + `<span class="sc" style="color:${scoreColor(sc)}">${f2(sc)}</span></td>`;
    }).join('');
    return `<tr><th class="shead" title="${Char.esc(c)}（本季出场 ${cnt[c] || 0} 次）">`
      + Char.chip(c, {size: 25})
      + (cnt[c] ? `<span class="hcnt">${cnt[c]}</span>` : '') + '</th>' + tds + '</tr>';
  }).join('');
  $('#pTable').innerHTML = head + '<tbody>' + body + '</tbody>';
  updateScoreStat();
  relayout();
}

function updateScoreStat() {
  const chars = Object.keys(SCORES.cells || {});
  const n = chars.reduce((a, c) => a + Object.keys(SCORES.cells[c]).length, 0);
  $('#sStat').innerHTML = `求生 <b>${chars.length}</b> 个 · 监管 <b>${HUNTERS.length}</b> 个 · 格子 <b>${n}</b> 个`;
}

// ══════════ 选手榜（仅展示） ══════════
async function loadPlayers() {
  try {
    PS = await api('/api/player_scores');
  } catch (e) {
    $('#pTable').innerHTML = `<tbody><tr><td class="msg err">加载失败：${e.message}</td></tr></tbody>`;
    return;
  }
  // 下拉：总榜 + 每位选手（按名称字典序，忽略大小写），下拉只用于切换视图
  const names = [...Object.keys(PS.players)].sort(byName);
  const sel = $('#pViewPick');
  sel.innerHTML = '<option value="">总榜（全联盟）</option>' +
    names.map(p => {
      const team = (PS.teams_of_player || {})[p] || '';
      return `<option value="${p}">${team ? team + ' · ' : ''}${p}</option>`;
    }).join('');
  sel.onchange = () => showView(sel.value);
  if (CUR_P) showView(CUR_P);
}

/** 地图下拉只在总榜视图里显示：选手视图筛地图没有意义（列本来就只是他用过的监管） */
function toggleMapPick(show) {
  $('#mapLbl').style.display = show ? '' : 'none';
  $('#mapPick').style.display = show ? '' : 'none';
}

/** 渲染当前视图。p 为空表示总榜，否则是某位选手。全部只读。 */
function showView(p) {
  CUR_P = p || null;

  // 地图筛选只在总榜有意义（选手视图列的是他用过的监管，不做该图筛选）
  toggleMapPick(!p);

  if (!p) {
    // ── 总榜：全联盟全局值，列是全部监管 ──
    $('#pTitle').innerHTML =
      `总榜（全联盟）${CUR_MAP ? ' · ' + Char.esc(CUR_MAP) : ''} <span class="badge ${SCORES.status === 'custom' ? 'custom' : 'base'}">${SCORES.status === 'custom' ? '自定义' : '默认'}</span>`;
    $('#pSub').textContent = `${(SCORES.all_survivors || []).length} 个求生 × ${HUNTERS.length} 个监管`;
    $('#pLegend').innerHTML = CUR_MAP
      ? `每个求生角色面对每个监管的局均逃脱（0~4，2.00 为居中值）。
         红＝求生方难打，绿＝好打。表头下方 <b>×倍数</b> = 该监管在
         <b>${Char.esc(CUR_MAP)}</b> 的出场份额 ÷ 全联盟份额（1.00 = 持平），
         列按该图出场场次重排。带 <span style="color:var(--warn)">*</span>
         表示该图不足 3 场、倍数不稳定，别当强倾向用。分数本身跨地图，
         不受这里筛选影响。`
      : `每个求生角色面对每个监管的局均逃脱（0~4，2.00 为居中值）。
         红＝求生方难打，绿＝好打。要看某位选手的表现，在上方下拉里选他。`;
    renderScores();
    return;
  }

  // ── 某位选手：只用他用过的监管做列 ──
  if (!PS) return;
  const data = PS.players[p] || {};
  const hs = PS.player_hunters[p] || [];
  const chars = Object.keys(data);
  $('#pTitle').textContent = `${p} 的分数表`;
  $('#pSub').textContent =
    `${(PS.teams_of_player || {})[p] || ''} · ${PS.player_halves[p]} 半局 · 用过 ${hs.length} 个监管`;
  $('#pLegend').innerHTML =
    `每格三行：<b>实测</b>（这位选手打的局均逃脱，下标为样本数）·
     <b>全局</b>（全联盟同格）· <b style="color:var(--ok)">折算</b>
     = w×实测 + (1-w)×全局，w = n/(n+${PS.meta.k_shrink})。`;

  const head = '<thead><tr><th>求生 \\ 监管</th>' +
    hs.map(h => `<th class="hhead">${Char.chip(h, {size: 42})}</th>`).join('') +
    '</tr></thead>';
  const body = chars.map(c => {
    const tds = hs.map(h => {
      const v = (data[c] || {})[h];
      if (!v) return '<td class="na">—</td>';
      return `<td style="background:${scoreBg(v.score)}"><div class="cellbox">
        <i class="gap">${f2(v.own)}<sub style="font-size:9px">${v.n}</sub></i>
        <i class="gap">/ ${f2(v.global)}</i>
        <i class="sc" style="color:${scoreColor(v.score)}">${f2(v.score)}</i></div></td>`;
    }).join('');
    return `<tr><th>${Char.chip(c, {size: 25})}</th>${tds}</tr>`;
  }).join('');
  $('#pTable').innerHTML = head + '<tbody>' + body + '</tbody>';
  relayout();
}

// ══════════ 地图筛选（仅影响列顺序与倍数标注，不改分数） ══════════
async function loadMaps() {
  try {
    MAPDATA = await api('/api/maps');
  } catch (e) {
    return;
  }
  const sel = $('#mapPick');
  sel.innerHTML = '<option value="">全部地图</option>'
    + (MAPDATA.maps || []).map(m => {
      const st = (MAPDATA.stats || {})[m] || {};
      return `<option value="${Char.esc(m)}">${Char.esc(m)}（${st.halves ?? 0} 局）</option>`;
    }).join('');
  sel.onchange = () => {
    CUR_MAP = sel.value;
    showView(CUR_P || '');
  };
}

// ══════════ 启动 ══════════
(async () => {
  try {
    await loadScores();     // 会直接渲染总榜视图
    await loadPlayers();    // 填充下拉，并再按默认总榜渲染一次
    await loadMaps();       // 地图下拉
  } catch (e) {
    document.body.insertAdjacentHTML('beforeend',
      `<div style="padding:20px;color:var(--err)">加载失败：${e.message}
       <br>请确认用 <code>python scripts/serve.py 8766</code>（macOS / Linux 用 <code>python3</code>）启动服务后访问。</div>`);
  }
})();</script>
</body>
