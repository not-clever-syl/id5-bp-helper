<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据 · IVL 2026 秋</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="char.css">
<style>
main{flex:1;width:100%;margin:0 auto;padding:12px 18px 16px;
  display:flex;flex-direction:column}
.badge.base{background:rgba(138,147,166,.2);color:var(--text-2)}
.badge.custom{background:var(--good-soft);color:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px;
  flex:none}
button.primary{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-hi)}
button.danger:hover{border-color:var(--danger);color:var(--danger)}
input[type=file]{display:none}
.msg{font-size:12px;margin-left:6px}
.msg.ok{color:var(--good)} .msg.err{color:var(--danger)} .msg.warn{color:var(--warn)}
.hint{color:var(--dim);font-size:11.5px;line-height:1.7}
.pane{display:none}
.pane.on{display:block}
thead th.hhead{position:relative;padding-top:2px}
thead th.hhead .hcnt{display:block;font:11px Consolas,monospace;
  color:var(--dim);line-height:1.15}
th,td{padding:0 3px;border-bottom:1px solid var(--border);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
thead th.hhead .char-chip{flex-direction:column;gap:2px;font-size:10.5px;
  justify-content:center;align-items:center;height:auto;overflow:visible}
thead th.hhead .char-chip .char-name{display:block;line-height:1.12;
  max-width:100%;white-space:normal;word-break:break-all;text-align:center}
thead th.hhead .char-avatar{width:40px;height:40px}
table.tight thead th.hhead .char-avatar{width:26px;height:26px}
table.tight thead th.hhead .char-chip{font-size:9.5px}
table.tight thead th.hhead .char-name{line-height:1.1}
tbody th{background:var(--panel2);text-align:left;font-weight:500;
  padding-left:6px}
tbody th.shead .hcnt{float:right;padding-right:5px;font:11px Consolas,monospace;
  color:var(--dim)}
tbody th .char-chip{font-size:11px}
tbody th .char-name{overflow:visible}
tbody th .char-avatar{width:25px;height:25px}
td.v{text-align:right;font-family:Consolas,monospace}
td.v .sc{font-family:Consolas,monospace;font-weight:600}
td.na{color:var(--faint);text-align:center}
.stat{color:var(--dim);font-size:12px}
.stat b{color:var(--text)}
.lbl{color:var(--dim);font-size:12px}
#pViewPick{min-width:190px}
.seg{display:inline-flex}
.seg button{border-radius:0;margin-left:-1px;padding:5px 11px}
.seg button:first-child{border-radius:6px 0 0 6px;margin-left:0}
.seg button:last-child{border-radius:0 6px 6px 0}
.seg button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-hi);
  position:relative;z-index:1}
.cellbox{display:inline-flex;align-items:center;gap:3px}
.cellbox i{font-style:normal}
.cellbox .sc{font-family:Consolas,monospace;font-weight:600}
td .sc{font-family:Consolas,monospace}
.cellbox .gap{font:10px Consolas,monospace;color:var(--dim)}
.cellbox.ownmax .sc{color:var(--ok)}
.legend{font-size:11px;color:var(--dim);line-height:1.6;margin-bottom:6px;
  flex:none}
.legend b{color:var(--text)}
td.click{cursor:pointer}
td.click:hover{outline:1px solid var(--accent);outline-offset:-1px}
td.v .subx{display:block;font:10px Consolas,monospace;color:var(--dim);
  line-height:1;margin-top:-1px}
#dtMask{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:50;
  display:none;align-items:center;justify-content:center;padding:12px}
#dtMask.on{display:flex}
#dtBox{background:var(--panel);border:1px solid var(--border);
  border-radius:12px;width:min(1400px,100%);max-height:min(88vh,880px);
  display:flex;flex-direction:column;box-shadow:0 20px 70px rgba(0,0,0,.55)}
#dtBox h3{margin:0;padding:11px 16px;font-size:14px;font-weight:600;
  border-bottom:1px solid var(--border);display:flex;align-items:baseline;
  gap:10px;flex-wrap:wrap}
#dtBox h3 .cnt{color:var(--accent);font-size:13px;font-weight:600}
#dtBox h3 .flt{color:var(--dim);font-size:12px;font-weight:400}
#dtBox h3 .x{margin-left:auto;cursor:pointer;color:var(--dim);font-size:16px;
  padding:0 4px;line-height:1}
#dtBox h3 .x:hover{color:var(--text)}
#dtWrap{overflow:auto;padding:0 0 4px;flex:1}
#dtTable{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;
  table-layout:auto}
#dtTable thead th{position:sticky;top:0;z-index:2;background:var(--panel2);
  text-align:left;font-weight:500;color:var(--dim);font-size:11px;
  padding:7px 7px;border-bottom:1px solid var(--border);white-space:nowrap}
#dtTable tbody td{padding:6px 7px;border-bottom:1px solid var(--border-soft);
  vertical-align:middle}
#dtTable tbody tr:hover td{background:rgba(255,255,255,.03)}
#dtTable tbody tr:last-child td{border-bottom:none}
#dtTable td.mono{font-family:Consolas,monospace;white-space:nowrap}
#dtTable td.map{color:var(--text);white-space:nowrap}
#dtTable td.team{white-space:nowrap}
#dtTable .chiprow{display:flex;gap:3px 5px;flex-wrap:wrap;max-width:210px}
#dtTable .chiprow .char-chip{gap:3px;font-size:11px;white-space:nowrap}
#dtTable .chiprow .char-avatar{width:19px;height:19px}
#dtTable .bans .chiprow{max-width:150px}
#dtTable .bans .char-chip{opacity:.66}
#dtTable td.none{color:var(--faint)}
#dtTable .res{font-family:Consolas,monospace;font-size:12.5px}
#dtTable .res b{font-size:13.5px}
#dtTable .res .sep{color:var(--dim);margin:0 6px}
#dtTable .tb{font-size:10px;padding:0 5px;border-radius:8px;
  background:rgba(216,178,95,.18);color:var(--warn);margin-left:4px}
#dtFoot{padding:8px 16px;border-top:1px solid var(--border);color:var(--dim);
  font-size:11.5px;display:flex;gap:14px;flex-wrap:wrap}
#dtBox .empty{color:var(--dim);text-align:center;padding:30px 0;font-size:12.5px}
</style>
</head>
<body>
<header>
  <a href="index.html" class="home">← 首页</a>
  <h1>数据</h1>
</header>

<main>
  <!-- ══════════ 总榜 / 选手榜（下拉切换视图，纯展示） ══════════ -->
  <div class="pane on" id="pane-player">
    <section class="card">
      <h2 id="pTitle">总榜（全联盟） <span class="badge base" id="scoreBadge">默认</span></h2>
      <div class="row">
        <label class="lbl">视图</label>
        <select id="pViewPick">
          <option value="">总榜（全联盟）</option>
        </select>
        <span class="seg" id="modeSeg">
          <button data-mode="raw">未调整熟练度</button>
          <button data-mode="adjusted" class="on">调整熟练度</button>
        </span>
        <label class="lbl" id="mapLbl" style="margin-left:12px">地图</label>
        <select id="mapPick">
          <option value="">全部地图</option>
        </select>
        <span class="sub" id="pSub" style="margin:0"></span>
        <span class="stat" id="sStat" style="margin-left:auto"></span>
      </div>
      <div class="legend" id="pLegend"></div>
      <div class="tablewrap"><table id="pTable"></table></div>
    </section>
  </div>
</main>

<div id="dtMask">
  <div id="dtBox">
    <h3>
      <span id="dtHead">半局明细</span>
      <span class="cnt" id="dtCnt"></span>
      <span class="flt" id="dtFlt"></span>
      <span class="x" id="dtClose" title="关闭">✕</span>
    </h3>
    <div id="dtWrap"><table id="dtTable"></table></div>
    <div id="dtFoot"></div>
  </div>
</div>

<script src="char.js"></script>
<script>
const $ = s => document.querySelector(s);
const HUNTERS = [];
let SCORES = {cells: {}};
let PS = null;              // 选手榜数据
let CUR_P = null;           // 当前查看的选手
let MAPDATA = null;         // 地图统计（/api/maps）
let CUR_MAP = '';           // 当前筛的地图（'' = 全部）
let MAPSCORES = null;       // 当前地图的实测表（/api/map_scores）
// 熟练度口径：'adjusted' = 调整熟练度（默认），'raw' = 未调整熟练度
let CUR_MODE = 'adjusted';

/** 分数统一显示两位小数（1.5 → 1.50，0.9167 → 0.92） */
function f2(v) {
  if (v == null || !isFinite(v)) return '—';
  return Number(v).toFixed(2);
}

/** 分数染色：2.00 是居中值。越低说明求生方越难打（红），越高越舒服（绿）。 */
function scoreColor(s) {
  if (s == null || !isFinite(s)) return 'var(--faint)';
  const v = Number(s);
  // 分段取色：1.0 以下红、1.6 偏红、2.0 中性、2.5 偏绿、以上绿
  if (v <= 1.0) return 'var(--danger)';
  if (v <= 1.6) return 'var(--warn)';
  if (v <= 2.0) return 'var(--text-2)';
  if (v <= 2.5) return 'var(--good)';
  return 'var(--good)';
}
function scoreBg(s) {
  if (s == null || !isFinite(s)) return 'transparent';
  const v = Math.max(0, Math.min(4, Number(s)));
  // 以 2.0 为中心：低分偏红、高分偏绿，透明度随偏离程度增强
  const d = (v - 2.0) / 2.0;                       // -1 ~ +1
  const a = Math.min(0.34, Math.abs(d) * 0.40 + 0.03);
  return d < 0 ? `rgba(217,112,104,${a.toFixed(3)})`
               : `rgba(87,184,148,${a.toFixed(3)})`;
}

/** 名称字典序：忽略大小写比较，大小写只在小写后仍相同时才用来分先后 */
function byName(a, b) {
  const x = a.toLowerCase(), y = b.toLowerCase();
  if (x !== y) return x < y ? -1 : 1;
  return a < b ? -1 : (a > b ? 1 : 0);
}

// ══════════ 熟练度口径 ══════════
/** 当前是不是「未调整熟练度」视图 */
function isRaw() { return CUR_MODE === 'raw'; }

/** 请求某个口径的数据：raw 时带上 ?mode=raw */
function modeQS() { return isRaw() ? '?mode=raw' : ''; }

/** 从一格里取当前口径的值。
 *  字段名约定：换算前的叫 xxx / xxx_raw，这里按口径挑一个。
 */
function pickMode(v, key) {
  if (!v) return null;
  const k = isRaw() ? key + '_raw' : key;
  const x = v[k];
  return (x === undefined) ? (v[key] === undefined ? null : v[key]) : x;
}

/** 切换口径：重新拉两种口径各自的数据源，再重画。 */
async function setMode(mode) {
  if (mode === CUR_MODE) return;
  CUR_MODE = mode;
  [...document.querySelectorAll('#modeSeg button')].forEach(b => {
    b.classList.toggle('on', b.dataset.mode === mode);
  });
  await loadScores();          // 总榜整表换数据源（cells）
  await reloadMap();           // 地图表换口径
  showView(CUR_P || '');
}

/* ── 铺满屏幕：宽度铺满、纵向可滚动，任何情况下都不横向溢出 ──
 * 关键约束：表格必须能在任意窗口宽度下把所有监管列塞进来。
 *   1. 首列（求生角色）给固定像素宽
 *   2. 剩余宽度在监管列之间均分
 *   3. 单列过窄时，字号自动缩小以适应文字
 */
function fitTable(tbl) {
  if (!tbl || !tbl.rows.length) return;
  const wrap = tbl.parentElement;
  const avail = wrap.clientWidth - 2;           // 减去边框
  if (avail <= 0) return;
  const cols = tbl.rows[0].cells.length;
  if (!cols) return;

  // 首列宽度：要放下「头像 + 4 个汉字的角色名」
  const firstW = Math.round(Math.min(126, Math.max(92, avail * 0.12)));
  const restW = Math.max(24, (avail - firstW) / Math.max(1, cols - 1));

  tbl.style.width = avail + 'px';
  for (const tr of tbl.rows) {
    if (tr.cells[0]) tr.cells[0].style.width = firstW + 'px';
    for (let i = 1; i < tr.cells.length; i++) {
      tr.cells[i].style.width = Math.floor(restW) + 'px';
    }
  }

  // 列太窄时缩字号：一格至少要放下 "1.85" 这种 4 字符
  const fs = Math.max(8, Math.min(12, restW / 4.2));
  tbl.style.fontSize = fs + 'px';
  const head = tbl.tHead ? tbl.tHead.rows[0] : null;
  if (head) {
    // 表头是「头像 / 名字 / 次数」竖着摞三层，列宽至少要放得下 3 个字。
    // 放不下就进 tight 模式：头像缩小、名字允许折行，但不隐藏任何信息。
    const nameW = restW - 6;
    tbl.classList.toggle('tight', nameW < 34);
  }
}

/** 统一的重新布局入口：按容器宽度给表格重新分配列宽 */
function relayout() {
  fitTable($('#pTable'));
}
window.addEventListener('resize', relayout);

async function api(url, opts) {
  const r = await fetch(url, opts);
  const t = await r.text();
  let j = null;
  try { j = JSON.parse(t); } catch (_) {}
  if (!r.ok) throw new Error((j && (j.error || (j.errors || []).join('；'))) || ('HTTP ' + r.status));
  return j;
}

// ══════════ 总榜（仅展示） ══════════
async function loadScores() {
  const d = await api('/api/scores' + modeQS());
  SCORES = d;
  HUNTERS.length = 0;
  HUNTERS.push(...(d.all_hunters || []));
}

/** 表头：头像 + 角色名 + 出场次数
 *  未选地图时显示全季出场次数；选了地图时显示该图出场次数。
 *  次数统一放大到 11px —— 原来 8.5px 根本看不清。
 */
function hunterHead(h) {
  const n = (SCORES.hunter_counts || {})[h];
  let extra = n ? `<span class="hcnt">${n}</span>` : '';
  let tip = `${h}（本季出场 ${n ?? 0} 次）`;
  if (CUR_MAP && MAPSCORES) {
    const row = (MAPSCORES.hunters || []).find(x => x.char === h);
    const cnt = row ? Number(row.n) : 0;
    extra = cnt ? `<span class="hcnt">${cnt}</span>` : '';
    tip = `${h} · ${CUR_MAP}：出场 ${cnt} 次 / 该图共 ${MAPSCORES.halves || 0} 局`;
  }
  return `<th class="hhead" title="${Char.esc(tip)}">`
    + Char.chip(h, {size: 42}) + extra + '</th>';
}

/** 选了地图时，监管列只留这张图上出场过的，按该图出场次数降序。
 *  没出场过的角色在这张图上没有任何半局，列着只会是整列空白。
 */
function orderedHunters() {
  if (!CUR_MAP || !MAPSCORES) return HUNTERS;
  return (MAPSCORES.hunters || []).map(x => x.char);
}

/** 求生行：未选地图时是全联盟全部角色；选了地图时只留该图出场过的。 */
function orderedSurvivors() {
  const cnt = SCORES.survivor_counts || {};
  if (CUR_MAP && MAPSCORES) {
    // 行首显示的是该图次数，就按该图次数排，数字才是降序的
    return (MAPSCORES.survivors || []).map(x => x.char)
      .sort((a, b) => survivorCount(b) - survivorCount(a) || byName(a, b));
  }
  return (SCORES.all_survivors || []).slice().sort(
    (a, b) => (cnt[b] || 0) - (cnt[a] || 0) || byName(a, b));
}

/** 行首右上角的小字：未选地图是全季次数，选了地图是该图次数。 */
function survivorCount(c) {
  if (CUR_MAP && MAPSCORES) {
    const row = (MAPSCORES.survivors || []).find(x => x.char === c);
    return row ? Number(row.n) : 0;
  }
  return (SCORES.survivor_counts || {})[c] || 0;
}

/** 总榜表格：只读展示，格子染成红绿表示难度。
 *  选了地图后整表换成该图的实测均值，每格标出样本局数。
 */
function renderScores() {
  const chars = orderedSurvivors();
  const cols = orderedHunters();
  const mapMode = !!(CUR_MAP && MAPSCORES);
  const head = '<thead><tr><th>求生 \\ 监管</th>' +
    cols.map(hunterHead).join('') + '</tr></thead>';
  const body = chars.map(c => {
    const row = mapMode ? ((MAPSCORES.cells || {})[c] || {}) : (SCORES.cells[c] || {});
    const tds = cols.map(h => {
      const v = row[h];
      if (v === undefined) {
        return `<td class="na click" data-s="${Char.esc(c)}" data-h="${Char.esc(h)}">—</td>`;
      }
      const sc = (typeof v === 'number') ? v : v.score;
      const n = (typeof v === 'number') ? 0 : (v.n || 0);
      // 底色表达「这套阵容好不好打」：偏红 = 求生方吃亏，偏绿 = 占便宜
      const sub = mapMode && n ? `<span class="subx">${n} 局</span>` : '';
      return `<td class="v click" data-s="${Char.esc(c)}" data-h="${Char.esc(h)}" `
        + `style="background:${scoreBg(sc)}">`
        + `<span class="sc" style="color:${scoreColor(sc)}">${f2(sc)}</span>${sub}</td>`;
    }).join('');
    const n = survivorCount(c);
    return `<tr><th class="shead" title="${Char.esc(c)}（${CUR_MAP || '本季'}出场 ${n} 次）">`
      + Char.chip(c, {size: 25})
      + (n ? `<span class="hcnt">${n}</span>` : '') + '</th>' + tds + '</tr>';
  }).join('');
  $('#pTable').innerHTML = head + '<tbody>' + body + '</tbody>';
  bindCells();
  updateScoreStat();
  relayout();
}

function updateScoreStat() {
  if (CUR_MAP && MAPSCORES) {
    let n = 0;
    Object.values(MAPSCORES.cells || {}).forEach(r => { n += Object.keys(r).length; });
    $('#sStat').innerHTML = `求生 <b>${(MAPSCORES.survivors || []).length}</b> 个 · 监管 <b>${(MAPSCORES.hunters || []).length}</b> 个 · 格子 <b>${n}</b> 个 · 该图 <b>${MAPSCORES.halves}</b> 局`;
    return;
  }
  const chars = Object.keys(SCORES.cells || {});
  const n = chars.reduce((a, c) => a + Object.keys(SCORES.cells[c]).length, 0);
  $('#sStat').innerHTML = `求生 <b>${chars.length}</b> 个 · 监管 <b>${HUNTERS.length}</b> 个 · 格子 <b>${n}</b> 个`;
}

// ══════════ 选手榜（仅展示） ══════════
async function loadPlayers(render = true) {
  try {
    PS = await api('/api/player_scores');
  } catch (e) {
    $('#pTable').innerHTML = `<tbody><tr><td class="msg err">加载失败：${e.message}</td></tr></tbody>`;
    return;
  }
  // 下拉：总榜 + 每位选手（按名称字典序，忽略大小写），下拉只用于切换视图
  const names = [...Object.keys(PS.players)].sort(byName);
  const sel = $('#pViewPick');
  sel.innerHTML = '<option value="">总榜（全联盟）</option>' +
    names.map(p => {
      const team = (PS.teams_of_player || {})[p] || '';
      return `<option value="${p}">${team ? team + ' · ' : ''}${p}</option>`;
    }).join('');
  sel.onchange = () => showView(sel.value);
  if (render) showView(CUR_P || '');
}

/** 地图下拉只在总榜视图里显示：选手视图筛地图没有意义（列本来就只是他用过的监管） */
function toggleMapPick(show) {
  $('#mapLbl').style.display = show ? '' : 'none';
  $('#mapPick').style.display = show ? '' : 'none';
}

/** 熟练度口径的说明，拼在图例末尾 */
function modeNote() {
  return isRaw()
    ? ` <b style="color:var(--warn)">未调整熟练度</b>：直接用原始逃脱人数算，不加选手熟练度修正。`
    : ` <b style="color:var(--ok)">调整熟练度</b>：已带上选手熟练度修正（BP 推演用的就是这套）。`;
}

/** 渲染当前视图。p 为空表示总榜，否则是某位选手。全部只读。 */
function showView(p) {
  CUR_P = p || null;

  // 地图筛选只在总榜有意义（选手视图列的是他用过的监管，不做该图筛选）
  toggleMapPick(!p);
  if (!p) {
    // ── 总榜：全联盟全局值，列是全部监管 ──
    $('#pTitle').innerHTML =
      `总榜（全联盟）${CUR_MAP ? ' · ' + Char.esc(CUR_MAP) : ''} ` +
      `<span class="badge ${isRaw() ? 'base' : 'custom'}">${isRaw() ? '未调整熟练度' : '调整熟练度'}</span>`;
    $('#pSub').textContent = CUR_MAP && MAPSCORES
      ? `${(MAPSCORES.survivors || []).length} 个求生 × ${(MAPSCORES.hunters || []).length} 个监管（仅这张图出场过的）`
      : `${(SCORES.all_survivors || []).length} 个求生 × ${HUNTERS.length} 个监管`;
    $('#pLegend').innerHTML = CUR_MAP
      ? `只统计 <b>${Char.esc(CUR_MAP)}</b> 上的 ${MAPSCORES ? MAPSCORES.halves : 0} 个半局：
         行与列都只留这张图出场过的角色，每格是该图上这些半局的平均逃生人数
         （0~4，2.00 为居中值），下方灰色小字是样本局数。
         红＝求生方难打，绿＝好打。<b>点任意一格</b>能看到组成它的全部半局。`
        + modeNote()
      : `每个求生角色面对每个监管的局均逃脱（0~4，2.00 为居中值）。
         红＝求生方难打，绿＝好打。要看某位选手的表现，在上方下拉里选他。
         <b>点任意一格</b>能看到组成它的全部半局。` + modeNote();
    renderScores();
    return;
  }

  // ── 某位选手：只用他用过的监管做列 ──
  if (!PS) return;
  const data = PS.players[p] || {};
  const hs = PS.player_hunters[p] || [];
  const chars = Object.keys(data);
  $('#pTitle').textContent = `${p} 的分数表`;
  $('#pSub').textContent =
    `${(PS.teams_of_player || {})[p] || ''} · ${PS.player_halves[p]} 半局 · 用过 ${hs.length} 个监管`;
  $('#pLegend').innerHTML =
    `每格三行：<b>实测</b>（这位选手打的局均逃脱，下标为样本数）·
     <b>全局</b>（全联盟同格）· <b style="color:var(--ok)">折算</b>
     = w×实测 + (1-w)×全局，w = n/(n+${PS.meta.k_shrink})。
     <b>点任意一格</b>能看到组成它的全部半局。` + modeNote();
  const head = '<thead><tr><th>求生 \\ 监管</th>' +
    hs.map(h => `<th class="hhead">${Char.chip(h, {size: 42})}</th>`).join('') +
    '</tr></thead>';
  const body = chars.map(c => {
    const tds = hs.map(h => {
      const v = (data[c] || {})[h];
      if (!v) {
        return `<td class="na click" data-s="${Char.esc(c)}" data-h="${Char.esc(h)}">—</td>`;
      }
      const own = pickMode(v, 'own');
      const glob = pickMode(v, 'global');
      const score = pickMode(v, 'score');
      return `<td class="click" data-s="${Char.esc(c)}" data-h="${Char.esc(h)}" `
        + `style="background:${scoreBg(score)}"><div class="cellbox">
        <i class="gap">${f2(own)}<sub style="font-size:9px">${v.n}</sub></i>
        <i class="gap">/ ${f2(glob)}</i>
        <i class="sc" style="color:${scoreColor(score)}">${f2(score)}</i></div></td>`;
    }).join('');
    return `<tr><th>${Char.chip(c, {size: 25})}</th>${tds}</tr>`;
  }).join('');
  $('#pTable').innerHTML = head + '<tbody>' + body + '</tbody>';
  bindCells();
  relayout();
}

// ══════════ 地图筛选（选了地图就整表换成该图实测） ══════════
async function loadMaps() {
  try {
    MAPDATA = await api('/api/maps');
  } catch (e) {
    return;
  }
  const sel = $('#mapPick');
  sel.innerHTML = '<option value="">全部地图</option>'
    + (MAPDATA.maps || []).map(m => {
      const st = (MAPDATA.stats || {})[m] || {};
      return `<option value="${Char.esc(m)}">${Char.esc(m)}（${st.halves ?? 0} 局）</option>`;
    }).join('');
  sel.onchange = () => {
    CUR_MAP = sel.value;
    reloadView();
  };
}

/** 换地图后要重新拉该图的实测表。 */
async function reloadView() {
  await reloadMap();
  showView(CUR_P || '');
}

/** 只拉地图数据、不重画（切换口径时用，之后由调用方统一重画）。 */
async function reloadMap() {
  MAPSCORES = null;
  if (!CUR_MAP) return;
  try {
    MAPSCORES = await api('/api/map_scores?map=' + encodeURIComponent(CUR_MAP)
      + (isRaw() ? '&mode=raw' : ''));
  } catch (e) {
    MAPSCORES = null;
    $('#pLegend').textContent = '该地图数据加载失败：' + e.message;
  }
}

// ══════════ 半局明细弹窗（点格子看组成这一格的局） ══════════
/** 给表格里每个格子绑上点击：打开组成这一格的半局列表。 */
function bindCells() {
  const rows = $('#pTable').querySelectorAll('td[data-s]');
  rows.forEach(td => {
    td.onclick = () => openDetail(td.dataset.s, td.dataset.h);
  });
}

/** 局次文字：加时按第四局算，但要单独标出来。 */
function gameText(h) {
  return h.tiebreak ? '第 4 局（加时）' : `第 ${h.game} 局`;
}

function detailRow(h) {
  const surv = (h.survivors || []).map(c => Char.chip(c, {size: 20})).join('');
  const banS = (h.bans_survivor || []).map(c => Char.chip(c, {size: 20})).join('')
    || '<span class="none">—</span>';
  const banH = (h.bans_hunter || []).map(c => Char.chip(c, {size: 20})).join('')
    || '<span class="none">—</span>';
  return `<tr>
    <td class="map">${h.map ? Char.esc(h.map) : '—'}</td>
    <td class="mono">${Char.esc(h.hunter_player || '—')}</td>
    <td>${h.hunter ? Char.chip(h.hunter, {size: 20}) : '—'}</td>
    <td class="team">${Char.esc(h.survivor_team || '—')}</td>
    <td><div class="chiprow">${surv}</div></td>
    <td class="bans"><div class="chiprow">${banS}</div></td>
    <td class="bans"><div class="chiprow">${banH}</div></td>
    <td class="res">逃生 <b>${h.escape}</b> 人<span class="sep">·</span>${Char.esc(h.score || '—')}</td>
    <td class="mono">${Char.esc(gameText(h))}</td>
  </tr>`;
}

async function openDetail(survivor, hunter) {
  // 地图下拉只在总榜显示，选手视图里它被藏起来了，就不该偷偷带上图的条件
  const mapName = CUR_P ? '' : (CUR_MAP || '');
  const player = CUR_P || '';
  const mask = $('#dtMask');
  $('#dtHead').textContent = `${survivor} × ${hunter}`;
  $('#dtCnt').textContent = '符合条件的有 … 局';
  $('#dtFlt').textContent = [
    mapName ? `地图：${mapName}` : '全部地图',
    player ? `选手：${player}` : '',
  ].filter(Boolean).join(' · ');
  $('#dtWrap').innerHTML = '<table id="dtTable"><tbody>'
    + '<tr><td class="empty">正在读取…</td></tr></tbody></table>';
  $('#dtFoot').textContent = '';
  mask.classList.add('on');

  const qs = new URLSearchParams({ survivor, hunter });
  if (mapName) qs.set('map', mapName);
  if (player) qs.set('player', player);

  let d;
  try {
    d = await api('/api/halves?' + qs.toString());
  } catch (e) {
    $('#dtCnt').textContent = '';
    $('#dtWrap').innerHTML = `<table><tbody><tr><td class="empty">`
      + `读取失败：${Char.esc(e.message)}</td></tr></tbody></table>`;
    return;
  }

  const list = d.halves || [];
  $('#dtCnt').textContent = `符合条件的有 ${d.count} 局`;
  if (!list.length) {
    $('#dtWrap').innerHTML = '<table><tbody><tr><td class="empty">'
      + '这个组合没有半局记录。</td></tr></tbody></table>';
    return;
  }

  // 底部只放一句口径说明，局数已经在标题行
  $('#dtFoot').textContent = '按赛季时间顺序排列。加时赛按第四局算，图权与第四局一致（客队）。';

  const head = '<thead><tr>'
    + ['地图', '监管选手', '监管角色', '求生队伍', '求生角色',
       '被 ban 的求生', '被 ban 的监管', '结果', '局次']
      .map(t => `<th>${t}</th>`).join('')
    + '</tr></thead>';
  $('#dtWrap').innerHTML = `<table id="dtTable">${head}<tbody>`
    + list.map(detailRow).join('') + '</tbody></table>';
}

function closeDetail() {
  $('#dtMask').classList.remove('on');
}
$('#dtClose').onclick = closeDetail;
$('#dtMask').onclick = e => { if (e.target.id === 'dtMask') closeDetail(); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDetail();
});

// ══════════ 启动 ══════════
// 熟练度口径切换按钮
[...document.querySelectorAll('#modeSeg button')].forEach(b => {
  b.onclick = () => setMode(b.dataset.mode);
});

(async () => {
  try {
    await loadScores();     // 总榜数据（当前口径）
    await loadPlayers(false); // 填充下拉，不抢先渲染
    await loadMaps();       // 地图下拉
    showView(CUR_P || '');  // 等三份数据都到位再画一次
  } catch (e) {
    document.body.insertAdjacentHTML('beforeend',
      `<div style="padding:20px;color:var(--err)">加载失败：${e.message}
       <br>请确认用 <code>python scripts/serve.py 8766</code>（macOS / Linux 用 <code>python3</code>）启动服务后访问。</div>`);
  }
})();</script>
</body>
