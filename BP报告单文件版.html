<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BP 教练报告</title>
<style>
/* 纯静态版的角色名外观（无头像，省请求次数） */
.char-chip{
  display:inline-flex;align-items:center;
  vertical-align:middle;line-height:1.35;
  padding:0 6px;border-radius:5px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
}
.char-chip > .char-name{white-space:nowrap}

/* 纯静态版报告页样式。配色与本地服务版一致。 */
:root{
  --bg:#14161c;--panel:#1b1e26;--panel2:#21252f;--border:#2e3340;
  --text:#dfe5f0;--dim:#8b94a8;--accent:#6b8cff;--warn:#e0a35a;
  --danger:#d4645c;--good:#4fa88a;--ban:#8a5a9e;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  overflow-x:hidden;
  font:13.5px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
header{padding:14px 26px;border-bottom:1px solid var(--border);
  background:var(--panel);position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-size:16px;font-weight:600}
header .sub{color:var(--dim);font-size:12px;margin-top:2px}
main{width:100%;margin:0 auto;padding:16px 26px 90px}
.hidden{display:none !important}

.sel{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.sel label{color:var(--dim);font-size:12px}
select{background:var(--panel2);color:var(--text);border:1px solid var(--border);
  border-radius:7px;padding:7px 11px;font-size:12.5px;min-width:150px;max-width:100%}
select:hover{border-color:var(--accent)}
button,.filebtn{background:var(--panel2);color:var(--text);border:1px solid var(--border);
  border-radius:7px;padding:6px 12px;font-size:12.5px;cursor:pointer;display:inline-block}
button:hover,.filebtn:hover{border-color:var(--accent)}
button.primary{background:#2a3f6e;border-color:var(--accent);color:#cfe0ff}
button:disabled{opacity:.5;cursor:default}
.io{font-size:11.5px;color:var(--dim);margin-left:4px}
.io.ok{color:var(--good)} .io.err{color:var(--danger)}

/* ── 全局禁选 ── */
.gbhint{background:var(--panel2);border-left:3px solid var(--accent);
  border-radius:0 8px 8px 0;padding:9px 14px;font-size:12.5px;margin:0 0 12px}
.gbhint.bad{border-left-color:var(--warn)}
.gbsec{margin-bottom:12px}
.gbsec h3{margin:0 0 6px;font-size:12.5px;font-weight:600;
  display:flex;align-items:center;gap:8px}
.gbwrap{display:flex;flex-wrap:wrap;gap:4px;max-height:170px;overflow-y:auto;
  border:1px solid var(--border);border-radius:8px;padding:7px;background:var(--panel2)}
.gb{font-size:11.5px;padding:1px 7px;border-radius:5px;cursor:pointer;
  border:1px solid var(--border);color:#8892a6;user-select:none;line-height:1.8}
.gb:hover{border-color:var(--accent)}
.gb.on{color:var(--text);border-color:rgba(212,100,92,.6);
  background:rgba(212,100,92,.14);text-decoration:line-through}

.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:14px 18px;margin-bottom:14px;min-width:0}
.card h2{margin:0 0 4px;font-size:14.5px;font-weight:600;
  display:flex;align-items:center;gap:9px}
.card h2 .num{width:24px;height:24px;border-radius:50%;background:var(--accent);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:600;flex:none}
.card .lead{color:var(--dim);font-size:12px;margin:0 0 10px 33px}

.verdict{background:var(--panel2);border-left:3px solid var(--accent);
  border-radius:0 8px 8px 0;padding:10px 14px;margin:10px 0 0;font-size:12.5px}
.verdict.warn{border-left-color:var(--warn)}
.verdict.good{border-left-color:var(--good)}
.verdict.bad{border-left-color:var(--danger)}
.verdict b{color:#fff}

.tablewrap{width:100%;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 9px;text-align:left;border-bottom:1px solid var(--border);
  vertical-align:middle}
th{color:var(--dim);font-weight:500;font-size:11.5px;white-space:nowrap}
tbody tr:hover{background:var(--panel2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;
  border:1px solid var(--border);color:var(--dim)}
.pill.on{background:#2a3f6e;border-color:var(--accent);color:#cfe0ff}
.pill.ban{background:#3a2a44;border-color:var(--ban);color:#d9b8e8}
.pill.good{background:#22423a;border-color:var(--good);color:#a8e6d0}

.combo-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.combo-tabs button{padding:8px 14px}
.combo-tabs button.on{background:#2a3f6e;border-color:var(--accent);color:#cfe0ff}

.tree{font-size:12px}
.tree ul{list-style:none;margin:2px 0 2px 16px;padding:0;
  border-left:1px solid var(--border);padding-left:12px}
.tree li{margin:3px 0}
.tree .v{color:var(--dim);font-variant-numeric:tabular-nums;margin-left:6px}
.tree .d.up{color:var(--good)} .tree .d.down{color:var(--danger)}
.tree .more{color:var(--dim);font-style:italic}

.opt{display:flex;align-items:center;gap:8px;padding:4px 0;flex-wrap:wrap}
.opt .bar{flex:1;height:6px;background:var(--panel2);border-radius:99px;
  overflow:hidden;min-width:40px}
.opt .bar > i{display:block;height:100%;background:var(--accent)}
.opt .bar > i.ban{background:var(--ban)}

</style>
</head>
<body>
<header>
  <div class="hd">
    <h1>BP 教练报告</h1>
    <div class="sub">IVL 2026 秋季赛 · 纯静态版（浏览器内计算，无需服务器）</div>
  </div>
</header>

<main id="app">
  <div class="card" id="bootCard">
    <h2><span class="num">·</span>正在加载数据</h2>
    <p class="lead" id="bootMsg">初始化数据 …</p>
  </div>

  <section class="card hidden" id="formCard">
    <h2><span class="num">1</span>选择对手</h2>
    <p class="lead">选好求生战队、对手战队和对手的监管选手、局数、地图，点生成。一组大约要算十几秒。</p>
    <div class="sel">
      <label for="selTeam">求生战队</label>
      <select id="selTeam"></select>
      <label for="selRival">对手战队</label>
      <select id="selRival"></select>
      <label for="selPlayer">对手监管选手</label>
      <select id="selPlayer"></select>
    </div>
    <div class="sel">
      <label for="selGame">局数</label>
      <select id="selGame"></select>
      <label for="selMap">地图</label>
      <select id="selMap"></select>
    </div>

    <div class="gbhint" id="gbHint"></div>
    <div class="gbsec">
      <h3>我方已用掉的求生者 <span class="pill" id="gbSTag">0 个</span></h3>
      <div class="gbwrap" id="gbSurv"></div>
    </div>
    <div class="gbsec">
      <h3>对方已用掉的监管 <span class="pill" id="gbHTag">0 个</span></h3>
      <div class="gbwrap" id="gbHunt"></div>
    </div>

    <div class="sel">
      <button class="primary" id="btnRun">生成报告</button>
      <button id="btnExport">导出报告 JSON</button>
      <label class="filebtn">导入报告 JSON<input type="file" id="fileImport" accept=".json,application/json" hidden></label>
      <span class="io" id="ioMsg"></span>
    </div>
  </section>

  <section class="hidden" id="report"></section>
</main>

<script>
/* 纯静态版的角色名显示。
 *
 * 刻意不带头像：头像是每个角色一个 PNG，一页报告要发几十个请求，
 * 静态托管上很吃请求次数。这里只输出带底色的文字块。
 *
 * 接口与本地服务版的 char.js 保持一致（chip / chips / esc），
 * 以后想加回头像，只需把 app.js 里 chip 的实现换掉。
 */
(function (global) {
  'use strict';

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (m) {
      return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[m];
    });
  }

  /** 角色名（纯文字，带底色小块） */
  function chip(name, opt) {
    opt = opt || {};
    return '<span class="char-chip' + (opt.className ? ' ' + opt.className : '') +
      '"><span class="char-name">' + esc(name) + '</span></span>';
  }

  /** 批量：把数组渲染成一串 chip */
  function chips(list, opt) {
    return (list || []).map(function (n) { return chip(n, opt); }).join('');
  }

  global.Char = { chip: chip, chips: chips, esc: esc };
})(window);

</script>
