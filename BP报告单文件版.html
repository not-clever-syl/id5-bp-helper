<script>
// ── engine.js ──────────────────────────────────────────────────
/* BP 引擎（纯静态版）
 *
 * 与 scripts/bp_search_engine.py 逐位对齐。改任何一边都必须重跑对拍：
 *     python test/export_baseline.py
 *     node test/js_parity.mjs
 *
 * 口径摘要（详见 Python 版模块头部）：
 *   · 分数单位「局均逃脱」，0~4，2.00 为平局线
 *   · 阵容分 = 最低 3 个 ×0.3 + 最高 1 个 ×0.1，再叠加结构扣分
 *   · 叶子评估 = 威胁度前 3 的监管，按选手选用次数加权
 *   · 地图只改候选排序与权重，不改任何格子的分数
 */

const SOLID = new Set([
  "守墓人", "大副", "佣兵", "前锋", "野人", "逃脱大师",
  "骑士", "记者", "哭泣小丑",
]);

/** Python 的 sorted(set) 在这里是「排好序的 frozenset」；用它做 key 才与 CPython 一致。 */
const SOLID_KEY = "\u0001" + Array.from(SOLID).sort().join("\u0001");

const KITE_TYPE = "牵制型";

// 结构项权重（与 Python 版常量一致）
const PENALTY_NO_SOLID = 0.45;
const PENALTY_MULTI_SOLID = 1.20;
const PENALTY_NO_KITE = 0.30;

// 样本量收缩强度、地图倍数收缩强度
const SHRINK_K = 3.0;
const MAP_SHRINK_K = 4.0;

/** 角色名归一：「邦邦」是「26号守卫」的别名。 */
function canon(c) {
  if (typeof c !== "string") return c;
  const s = c.replace(/\u201c/g, "").replace(/\u201d/g, "").replace(/"/g, "");
  return s === "邦邦" ? "26号守卫" : s;
}

/** 求生方 ② 阶段的 ban 名额。 */
function banQuota(game) {
  return game <= 1 ? 0 : (game === 2 ? 1 : 2);
}

/** 稳定集合键：按 Unicode 码点排序，避免 JS 默认排序的字典序差异。 */
function setKey(set) {
  return Array.from(set).sort().join("\u0001");
}

function sortedNums(arr) {
  // Python 的 sorted() 对数字就是升序，NaN 不该出现
  return arr.slice().sort((a, b) => a - b);
}

/** Python `sorted(set)` 的稳定降序：排序键必须带上原顺序。 */
function stableSortBy(arr, cmp) {
  const idx = arr.map((_, i) => i);
  idx.sort((a, b) => cmp(arr[a], arr[b]) || (a - b));
  return idx.map((i) => arr[i]);
}

function sum(arr) {
  let s = 0;
  for (let i = 0; i < arr.length; i++) s += arr[i];
  return s;
}

/** 把数组 / Set / undefined 统一成 Set。Set 没有 .length，别直接读。 */
function toSet(v) {
  if (v instanceof Set) return v;
  return new Set(v || []);
}

/* Python 内置 sum() 的浮点行为：3 项及以上走 Neumaier 补偿求和，
 * 否则就是从左往右朴素累加。直接照抄，别「优化」。 */
function pySum(arr) {
  const n = arr.length;
  if (n < 3) return sum(arr);
  let total = arr[0];
  let c = 0.0;
  for (let i = 1; i < n; i++) {
    const x = arr[i];
    const t = total + x;
    if (Math.abs(total) >= Math.abs(x)) c += (total - t) + x;
    else c += (x - t) + total;
    total = t;
  }
  return total + c;
}

/**
 * 从合并后的 core.json 还原旧版 bp_tree 的结构。
 *
 * 纯静态版只加载一份 core.json，引擎内部照旧按 tree 的字段名取用，
 * 这里做一次字段名映射（snake_case → 旧名），其余数据原样引用。
 */
function mergeTree(d) {
  return {
    games: d.games || {},
    teams: d.teams || {},
    players: d.players || {},
    strength: d.strength || {},
    banSurvivor: d.ban_survivor || [],
    banHunter: d.ban_hunter || [],
    positions: d.positions || {},
    pool: d.pool || {},
  };
}

class Engine {
  /**
   * @param {object} data  合并后的 core.json（单份）
   * @param {object} opt   {scoresOverride, poolOverride, betaScale}
   */
  constructor(data, opt = {}) {
    this.core = data;
    this.tree = mergeTree(data);
    this.sc = data.scores || {};
    this.teams = this.tree.teams;

    this.betaScale = Math.max(0, Math.min(1, Number(opt.betaScale || 0)));
    if (this.betaScale > 0) {
      const a = data.player_char_adjust || {};
      this._betaAll = {};
      for (const k of Object.keys(a)) this._betaAll[k] = a[k].adjust || 0;
    } else {
      this._betaAll = {};
    }
    this._betaPlayer = "";

    // 生成页导入的分数表（最高优先级）
    this.scoresOverride = {};
    const ov = opt.scoresOverride || {};
    for (const ch of Object.keys(ov)) {
      const hs = ov[ch];
      if (!hs || typeof hs !== "object") continue;
      const row = {};
      for (const h of Object.keys(hs)) {
        const v = hs[h];
        const num = (typeof v === "number") ? v : (v || {}).score;
        if (num === null || num === undefined) continue;
        const f = Number(num);
        if (Number.isNaN(f)) continue;
        row[canon(h)] = f;
      }
      if (Object.keys(row).length) this.scoresOverride[canon(ch)] = row;
    }

    // 选手：dist / threats / raw_count 都做 canon
    this.players = {};
    for (const p of Object.keys(this.tree.players)) {
      const info = Object.assign({}, this.tree.players[p]);
      const dist = {};
      for (const c of Object.keys(info.dist || {})) dist[canon(c)] = info.dist[c];
      info.dist = dist;
      this.players[p] = info;
    }
    this.strength = {};
    for (const c of Object.keys(this.tree.strength || {})) {
      this.strength[canon(c)] = this.tree.strength[c];
    }
    this.banSurv = {};
    for (const x of this.tree.banSurvivor || []) this.banSurv[canon(x.char)] = x.p;
    this.banHunt = {};
    for (const x of this.tree.banHunter || []) this.banHunt[canon(x.char)] = x.p;
    this.positions = {};
    for (const c of Object.keys(this.tree.positions || {})) {
      this.positions[canon(c)] = this.tree.positions[c];
    }

    // 监管候选池：只放选手实际用过的角色
    const used = new Set();
    for (const p of Object.keys(this.players)) {
      const info = this.players[p];
      for (const c of Object.keys(info.dist || {})) used.add(c);
      for (const c of Object.keys(info.raw_count || {})) used.add(c);
    }
    this.hunterPool = (this.tree.pool.hunter || [])
      .map(canon).filter((c) => used.has(c));

    // 各队角色池
    this.rosters = {};
    for (const t of Object.keys(this.teams)) {
      this.rosters[t] = (this.teams[t].roster || []).map(canon);
    }
    if (opt.poolOverride) {
      for (const t of Object.keys(opt.poolOverride)) {
        const chars = opt.poolOverride[t];
        if (chars && chars.length) this.rosters[t] = chars.map(canon);
      }
    }

    this.candBanSurv = opt.candBanSurv === undefined ? 6 : opt.candBanSurv;
    this.candBanHunt = opt.candBanHunt === undefined ? 4 : opt.candBanHunt;

    // 缓存
    this._cellCache = new Map();
    this._lineupCache = new Map();
    this._expValCache = new Map();
    this._scoreCache = new Map();
    this._top3Cache = new Map();
    this._banHuntCache = new Map();
    this._threatRowsCache = new Map();
    this._multCache = new Map();
    this._banSurvCache = new Map();
    this._memo = new Map();
    this._candsCache = new Map();
    this._takenChars = new Map();
    this.mapName = "";
    this.counters = { nodes: 0, cut: 0 };
    this.trace = [];

    // 先验：全联盟局均逃脱，从 core 现算
    const halves = (this.core.halves || []);
    if (halves.length) {
      this.prior = round4(sum(halves.map((x) => x.escape)) / halves.length);
    } else {
      this.prior = 2.0;
    }

    this._buildMapTables(this.core);
  }

  // ── 地图表 ──────────────────────────────────────────────
  _buildMapTables(core) {
    const halves = (core.halves || []).filter((x) => x.map);
    this._coreHalves = core.halves || [];
    this._mapN = {};
    this._mapHn = {};
    this._mapSn = {};
    this._mapTotal = {};
    this._survTotal = {};
    for (const h of halves) {
      const m = h.map;
      const hh = canon(h.hunter);
      this._mapN[m] = (this._mapN[m] || 0) + 1;
      this._mapTotal[hh] = (this._mapTotal[hh] || 0) + 1;
      if (!this._mapHn[m]) this._mapHn[m] = {};
      this._mapHn[m][hh] = (this._mapHn[m][hh] || 0) + 1;
      if (!this._mapSn[m]) this._mapSn[m] = {};
      for (const c of (h.survivors || [])) {
        const cc = canon(c);
        this._survTotal[cc] = (this._survTotal[cc] || 0) + 1;
        this._mapSn[m][cc] = (this._mapSn[m][cc] || 0) + 1;
      }
    }
    const nAll = halves.length;
    this._mapPrior = {};
    for (const hh of Object.keys(this._mapTotal)) {
      this._mapPrior[hh] = nAll ? this._mapTotal[hh] / nAll : 0.0;
    }
    this._survPrior = {};
    for (const c of Object.keys(this._survTotal)) {
      this._survPrior[c] = nAll ? this._survTotal[c] / nAll : 0.0;
    }
    this._maps = Object.keys(this._mapN).sort();
  }

  maps() {
    // Python: sorted(self._map_n, key=lambda m: (-n, m))
    return Object.keys(this._mapN).sort((a, b) => {
      const d = this._mapN[b] - this._mapN[a];
      return d !== 0 ? d : (a < b ? -1 : (a > b ? 1 : 0));
    });
  }

  mapShare(mapName, hunter) {
    const hh = canon(hunter);
    const g = this._mapPrior[hh] || 0.0;
    if (!mapName) return g;
    const n = this._mapN[mapName] || 0;
    if (n === 0) return g;
    const cnt = (this._mapHn[mapName] || {})[hh] || 0;
    const K = MAP_SHRINK_K;
    return (cnt + K * g) / (n + K);
  }

  mapMult(mapName, hunter) {
    const g = this._mapPrior[canon(hunter)] || 0.0;
    if (g <= 0) return 1.0;
    return this.mapShare(mapName, hunter) / g;
  }

  // ── 求生角色 × 地图 ──────────────────────────────────────
  survMapShare(mapName, char) {
    const c = canon(char);
    const g = this._survPrior[c] || 0.0;
    if (!mapName) return g;
    const n = this._mapN[mapName] || 0;
    if (n === 0) return g;
    const cnt = (this._mapSn[mapName] || {})[c] || 0;
    const K = MAP_SHRINK_K;
    return (cnt + K * g) / (n + K);
  }

  /** 该图该求生角色的「相对全局份额」倍数，1.0 = 与全联盟平均持平。只用于排序。 */
  survMapMult(mapName, char) {
    const g = this._survPrior[canon(char)] || 0.0;
    if (g <= 0) return 1.0;
    return this.survMapShare(mapName, char) / g;
  }

  _multTable(mapName) {
    let tbl = this._multCache.get(mapName);
    if (tbl !== undefined) return tbl;
    if (!mapName) {
      tbl = {};
    } else {
      const n = this._mapN[mapName] || 0;
      if (n === 0) {
        tbl = {};
      } else {
        const K = MAP_SHRINK_K;
        const hn = this._mapHn[mapName] || {};
        tbl = {};
        const keys = new Set(Object.keys(hn));
        for (const k of Object.keys(this._mapPrior)) keys.add(k);
        for (const hh of keys) {
          const g = this._mapPrior[hh] || 0.0;
          if (g <= 0) {
            tbl[hh] = 1.0;
          } else {
            const cnt = hn[hh] || 0;
            tbl[hh] = ((cnt + K * g) / (n + K)) / g;
          }
        }
      }
    }
    this._multCache.set(mapName, tbl);
    return tbl;
  }

  mapMultFast(mapName, hunter) {
    if (!mapName) return 1.0;
    const tbl = this._multTable(mapName);
    if (!Object.keys(tbl).length) return 1.0;
    const v = tbl[hunter];
    if (v !== undefined) return v;
    return this.mapMult(mapName, hunter);
  }

  poolOf(team) {
    return this.rosters[team] || [];
  }

  // ── 分数 ────────────────────────────────────────────────
  cell(team, char, hunter) {
    const key = team + "\u0001" + char + "\u0001" + hunter;
    const hit = this._cellCache.get(key);
    if (hit !== undefined) return hit;

    // ① 本次生成的分数表
    const ov = this.scoresOverride[char];
    if (ov !== undefined && ov[hunter] !== undefined) {
      const v = ov[hunter] + this.betaOf(hunter);
      this._cellCache.set(key, v);
      return v;
    }

    // ② 预编辑表：先本队，再回退到「遍历顺序里第一个有该格的队」
    let row = null;
    const ownChars = this.sc[team] || {};
    const cc = (ownChars[char] || {})[hunter];
    if (cc) {
      row = cc;
    } else {
      // 注意：必须按 JSON 原始键序遍历，与 Python dict 的插入序一致
      for (const t of Object.keys(this.sc)) {
        const h2 = (this.sc[t][char] || {})[hunter];
        if (h2) { row = h2; break; }
      }
    }
    let v;
    if (row === null) {
      v = this.prior;
    } else {
      let s = row.score;
      if (s === undefined || s === null) s = row.global;
      v = (s === undefined || s === null) ? this.prior : Number(s);
    }
    this._cellCache.set(key, v);
    return v;
  }

  betaOf(hunter) {
    if (this.betaScale <= 0 || !this._betaPlayer) return 0.0;
    return round4(this.betaScale * (this._betaAll[this._betaPlayer + "@" + hunter] || 0.0));
  }

  lineupScore(team, chars, hunter) {
    const arr = Array.from(chars);
    // 用与 setKey 相同的排序：Python 那边是 sorted(chars) 元组，
    // 这里保持一致，缓存命中口径才对得上。
    const key = team + "\u0001" + arr.slice().sort().join("\u0001") + "\u0001" + hunter;
    const hit = this._lineupCache.get(key);
    if (hit !== undefined) return hit;

    const vals = sortedNums(arr.map((c) => this.cell(team, c, hunter)));
    const n = vals.length;
    let base;
    if (n >= 4) {
      base = (pySum(vals.slice(0, 3)) * 0.3 + vals[3] * 0.1);
    } else if (n === 0) {
      base = this.prior;
    } else {
      base = pySum(vals) * 0.3;
    }

    let solidN = 0;
    let kiteN = 0;
    for (const c of arr) {
      if (SOLID.has(c)) {
        solidN++;
      } else {
        const pos = this.positions[c] || [];
        if (pos.indexOf(KITE_TYPE) >= 0) kiteN++;
      }
    }
    if (solidN === 0) base -= PENALTY_NO_SOLID;
    else if (solidN >= 2) base -= PENALTY_MULTI_SOLID * (solidN - 1);
    if (kiteN === 0) base -= PENALTY_NO_KITE;

    this._lineupCache.set(key, base);
    return base;
  }

  // ── 威胁排序 ────────────────────────────────────────────
  _threatRows(player, mapName) {
    mapName = mapName || "";
    const ck = player + "\u0001" + mapName;
    const cached = this._threatRowsCache.get(ck);
    if (cached !== undefined) return cached;

    const info = this.players[player];
    const raw = info.raw_count || {};
    const rows = [];
    if (mapName) {
      const tbl = this._multTable(mapName);
      for (const t of info.threats) {
        const ch = t.char;
        const w = raw[ch] || 0;
        if (w <= 0) continue;
        let mult = tbl[ch];
        if (mult === undefined) mult = this.mapMult(mapName, ch);
        rows.push([ch, w, t.threat, mult]);
      }
      rows.sort((a, b) => (b[2] * b[3]) - (a[2] * a[3]));
    } else {
      for (const t of info.threats) {
        const ch = t.char;
        const w = raw[ch] || 0;
        if (w <= 0) continue;
        rows.push([ch, w, t.threat, 1.0]);
      }
    }
    this._threatRowsCache.set(ck, rows);
    return rows;
  }

  _expectCore(team, chars, player, exclude, mapName) {
    // exclude 可能是 Set 也可能是数组（Python 那边统一是 frozenset），
    // 统一先转成 Set 再判断，不能直接读 .length —— Set 只有 .size。
    const sk = toSet(exclude);
    let rows = this._threatRows(player, mapName);
    if (sk.size) {
      rows = rows.filter((r) => !sk.has(r[0]));
    }
    if (!rows.length) return [null, 0.0, this.prior];

    const chosen = rows.slice(0, 3);
    let totW = 0.0;
    let acc = 0.0;
    for (const r of chosen) {
      const weff = r[1] * r[3];
      totW += weff;
      acc += this.lineupScore(team, chars, r[0]) * weff;
    }
    return [chosen, totW, acc];
  }

  _expectValue(team, chars, player, exclude, mapName) {
    exclude = exclude || [];
    mapName = mapName || "";
    // 绝大多数调用 exclude 都是空的，走快路径少拼一次串
    const nEx = exclude.length === undefined ? exclude.size : exclude.length;
    const key = nEx === 0
      ? team + "\u0001" + Array.from(chars).sort().join("\u0001")
        + "\u0001" + player + "\u0001\u0001" + mapName
      : team + "\u0001" + Array.from(chars).sort().join("\u0001")
        + "\u0001" + player + "\u0001" + Array.from(exclude).sort().join("\u0001")
        + "\u0001" + mapName;
    const hit = this._expValCache.get(key);
    if (hit !== undefined) return hit;
    const [chosen, totW, acc] = this._expectCore(team, chars, player, exclude, mapName);
    void chosen;
    const v = totW ? acc / totW : this.prior;
    this._expValCache.set(key, v);
    return v;
  }

  /** 叶子评估的明细（Python 版 expected_vs_player），展示用。 */
  expectedVsPlayer(team, chars, player, exclude, mapName) {
    const arr = Array.from(chars);
    const ex = exclude ? Array.from(exclude) : [];
    const [chosen, totW, acc] = this._expectCore(team, arr, player, ex, mapName || "");
    if (!chosen) return { expect: this.prior, top3: [] };
    const top3 = chosen.map((r) => ({
      char: r[0], w: r[1], w_map: round4(r[1] * r[3]),
      mult: round4(r[3]), score: round4(this.lineupScore(team, arr, r[0])),
      threat: round4(r[2]),
    }));
    return { expect: acc / totW, top3: top3 };
  }

  // ── 候选裁剪 ────────────────────────────────────────────
  banCandidatesSurv(team) {
    let v = this._banSurvCache.get(team);
    if (v !== undefined) return v;
    const scored = stableSortBy(this.poolOf(team),
      (a, b) => (this.banSurv[b] || 0.0) - (this.banSurv[a] || 0.0));
    v = scored.slice(0, this.candBanSurv);
    this._banSurvCache.set(team, v);
    return v;
  }

  banCandidatesResponse(team, picked, lban, lpick, player, n) {
    n = n || this.candBanSurv;
    const roster = this.poolOf(team);
    const top = this._top3Hunters(player, this.mapName);
    // top3 完全由 (player, mapName) 决定，不必每次把它拼进缓存键
    const topTag = team + "\u0001" + player + "\u0001" + this.mapName + "\u0001";

    const charMinScores = (c) => {
      const key = topTag + c;
      let v = this._scoreCache.get(key);
      if (v === undefined) {
        v = sortedNums(top.map((h2) => this.cell(team, c, h2)));
        this._scoreCache.set(key, v);
      }
      return v;
    };

    // 先一次性把本轮用得到的「每个角色对 top3 的最低分」算好，
    // 后面 agg / 合并排序都直接取，不再走 Map 查找
    const minOf = new Map();
    const minFor = (c) => {
      let v = minOf.get(c);
      if (v === undefined) { v = charMinScores(c); minOf.set(c, v); }
      return v;
    };

    const agg = (chars) => {
      const vals = [];
      for (const c of chars) {
        const s = minFor(c);
        for (let i = 0; i < s.length; i++) vals.push(s[i]);
      }
      if (!vals.length) return this.prior;
      const s = sortedNums(vals);
      const k = Math.min(3, s.length);
      return pySum(s.slice(0, k)) / k;
    };

    const base = Array.from(picked);
    const cur = base.length ? agg(base) : this.prior;
    let baseMin = [];
    if (base.length) {
      const vals = [];
      for (const c of base) {
        const s = minFor(c);
        for (let i = 0; i < s.length; i++) vals.push(s[i]);
      }
      baseMin = sortedNums(vals).slice(0, 3);
    }
    const scored = [];
    const pickedSet = new Set(picked);
    for (const c of roster) {
      if (lban.has(c) || lpick.has(c) || pickedSet.has(c)) continue;
      let gain;
      if (baseMin.length) {
        let merged = baseMin.concat(minFor(c));
        merged = sortedNums(merged);
        const k = Math.min(3, merged.length);
        gain = pySum(merged.slice(0, k)) / k - cur;
      } else {
        gain = agg([c]) - cur;
      }
      const prior = this.banSurv[c] || 0.0;
      scored.push([c, gain * 3.0 + prior * 2.0]);
    }
    const ordered = stableSortBy(scored, (a, b) => b[1] - a[1]);
    return ordered.slice(0, n).map((x) => x[0]);
  }

  _top3Hunters(player, mapName) {
    mapName = mapName || "";
    const key = player + "\u0001" + mapName;
    let v = this._top3Cache.get(key);
    if (v !== undefined) return v;
    let rows = this.players[player].threats.slice();
    if (mapName) {
      const tbl = this._multTable(mapName);
      const keyOf = (t) => -(t.threat * (tbl[t.char] !== undefined
        ? tbl[t.char] : this.mapMult(mapName, t.char)));
      rows = stableSortBy(rows, (a, b) => keyOf(a) - keyOf(b));
    }
    v = rows.slice(0, 3).map((t) => t.char);
    this._top3Cache.set(key, v);
    return v;
  }

  banCandidatesHunt(player, mapName) {
    mapName = mapName || "";
    const key = player + "\u0001" + mapName;
    let v = this._banHuntCache.get(key);
    if (v !== undefined) return v;
    let rows = this.players[player].threats.slice();
    if (mapName) {
      const tbl = this._multTable(mapName);
      const keyOf = (t) => -(t.threat * (tbl[t.char] !== undefined
        ? tbl[t.char] : this.mapMult(mapName, t.char)));
      rows = stableSortBy(rows, (a, b) => keyOf(a) - keyOf(b));
    }
    v = rows.slice(0, this.candBanHunt).map((t) => t.char);
    this._banHuntCache.set(key, v);
    return v;
  }

  // ── 搜索主体 ────────────────────────────────────────────
  stages(game) {
    const s = [
      ["①", "hunt_ban", 2],
      ["②", "surv_ban", banQuota(game)],
      ["③", "surv_pick", 2],
      ["④", "hunt_ban", 1],
      ["⑤", "surv_pick", 1],
      ["⑥", "hunt_ban", 1],
      ["⑦", "surv_pick", 1],
      ["⑩", "hunt_pick", 1],
    ];
    return s.filter((x) => x[2] > 0);
  }

  search(team, player, game, depthLimit, mapName) {
    const stages = this.stages(game);
    this.counters = { nodes: 0, cut: 0 };
    this.mapName = mapName || "";
    this.trace = [];
    this._takenChars = new Map();
    this._memo = new Map();
    this._candsCache = new Map();

    return this._dfs(team, player, game, stages, 0,
      new Set(), new Set(), new Set(),
      -1e9, 1e9,
      (depthLimit === undefined || depthLimit === null) ? stages.length : depthLimit,
      0);
  }

  _leaf(team, player, spicks, lban) {
    if (spicks.size >= 4) {
      return this._expectValue(team, spicks, player, lban || null, this.mapName);
    }
    return this._shallow(team, player, spicks, lban);
  }

  /** ⑩ 展示用：若推进到这里，最可能被选的监管（排除已 ban）。 */
  _likelyHunter(player, lban) {
    const rows = this._threatRows(player, this.mapName);
    for (const r of rows) {
      if (!lban.has(r[0])) return r[0];
    }
    return null;
  }

  _shallow(team, player, spicks, lban) {
    if (!spicks.size) return this.prior;
    return this._expectValue(team, spicks, player, lban || null, this.mapName);
  }

  _dfs(team, player, game, stages, idx, lban, lpick, spicks, alpha, beta, depth, taken) {
    taken = taken || 0;
    this.counters.nodes++;
    const nStages = stages.length;
    if (idx >= nStages) return [this._leaf(team, player, spicks, lban), []];
    if (idx >= depth) return [this._shallow(team, player, spicks, lban), []];

    const memoOk = taken === 0;
    let memoKey = null;
    if (memoOk) {
      memoKey = [team, player, game, this.mapName, depth, idx,
        setKey(lban), setKey(lpick), setKey(spicks)].join("\u0002");
      const hit = this._memo.get(memoKey);
      if (hit !== undefined) return [hit[0], hit[1].slice()];
    }
    const alpha0 = alpha;
    const beta0 = beta;

    const [code, kind, count] = stages[idx];
    const isSurvPick = kind === "surv_pick";
    const isMax = isSurvPick;

    if (kind === "hunt_pick") {
      const v = this._leaf(team, player, spicks, lban);
      return [v, [["⑩", this._likelyHunter(player, lban), v]]];
    }
    // Python 的候选缓存键用的是 frozenset / tuple 的值相等，这里用排序后的字符串。
    const lbanKey = setKey(lban), lpickKey = setKey(lpick), spicksKey = setKey(spicks);
    const ckey = [code, idx, taken, lbanKey, lpickKey, spicksKey, this.mapName, depth].join("\u0002");
    let cands = this._candsCache.get(ckey);
    if (cands === undefined) {
      let list;
      if (kind === "hunt_ban") {
        if (code === "①") {
          list = this.banCandidatesSurv(team);
        } else {
          list = this.banCandidatesResponse(team, spicks, lban, lpick, player,
            this.candBanSurv);
        }
      } else if (kind === "surv_ban") {
        list = this.banCandidatesHunt(player, this.mapName);
      } else if (kind === "surv_pick") {
        list = this.poolOf(team);
      } else {
        list = Object.keys(this.players[player].dist)
          .filter((c) => this.strength[c] !== undefined);
      }
      cands = list;
      this._candsCache.set(ckey, cands.slice());
    } else {
      cands = cands.slice();
    }

    // 候选的顺序在 Python 里每次进出缓存都会重排（`list(tuple)` + 原地 sort），
    // 而 sort 用对象身份比较 frozenset，缓存命中与首次到达用的集合不是同一批，
    // 平分时的先后就不同 —— 这直接改变了 α-β 的节点数。
    // 所以这里一律在本层用「本层的那几个集合」重排一遍。
    if (kind === "hunt_ban") {
      if (code === "①") {
        // ①：先按角色池原序筛掉已 ban/已选，再按被 ban 率稳定降序
        const kept = [];
        for (const c of this.poolOf(team)) {
          if (this.banCandidatesSurv(team).indexOf(c) >= 0
            && !lban.has(c) && !lpick.has(c)) kept.push(c);
        }
        cands = stableSortBy(kept, (a, b) => (this.banSurv[b] || 0.0) - (this.banSurv[a] || 0.0));
      } else {
        cands = this.banCandidatesResponse(team, spicks, lban, lpick, player,
          this.candBanSurv);
      }
    } else if (kind === "surv_ban") {
      const kept = this.banCandidatesHunt(player, this.mapName)
        .filter((c) => !lban.has(c) && !lpick.has(c));
      // Python 的源序列是缓存的 tuple，这里用缓存值保持同一初始顺序
      const base = this.banCandidatesHunt(player, this.mapName)
        .filter((c) => kept.indexOf(c) >= 0);
      cands = stableSortBy(base, (a, b) => {
        const va = spicks.size ? this.lineupScore(team, spicks, a) : 0;
        const vb = spicks.size ? this.lineupScore(team, spicks, b) : 0;
        return va - vb;
      });
    } else if (kind === "surv_pick") {
      const takenSet = new Set([...lban, ...lpick, ...spicks]);
      const kept = this.poolOf(team).filter((c) => !takenSet.has(c));
      const vals = new Map();
      for (const c of kept) {
        const trial = new Set(spicks);
        trial.add(c);
        vals.set(c, -this._shallow(team, player, trial, lban));
      }
      cands = stableSortBy(kept, (a, b) => vals.get(a) - vals.get(b));
    }

    if (!cands.length) return [this._leaf(team, player, spicks, lban), []];

    if (taken > 0) {
      const prev = this._takenChars.get(idx + "\u0001" + (taken - 1));
      if (prev !== undefined) {
        const i = cands.indexOf(prev);
        if (i >= 0) cands = cands.slice(i + 1);
      }
      if (!cands.length) return [this._leaf(team, player, spicks, lban), []];
    }

    let bestVal = isMax ? -1e9 : 1e9;
    let bestLine = [];
    const isBan = kind.endsWith("ban");
    const isPick = kind.endsWith("pick");

    for (const c of cands) {
      if (count > 1) this._takenChars.set(idx + "\u0001" + taken, c);
      const nb = isBan ? new Set([...lban, c]) : lban;
      const np = isPick ? new Set([...lpick, c]) : lpick;
      const nsp = isSurvPick ? new Set([...spicks, c]) : spicks;

      let nidx, ntaken;
      if (taken + 1 >= count) { nidx = idx + 1; ntaken = 0; }
      else { nidx = idx; ntaken = taken + 1; }

      let v, line;
      if (nidx < nStages && stages[nidx][1] === "hunt_pick" && nidx < depth) {
        v = this._leaf(team, player, nsp, nb);
        line = [["⑩", this._likelyHunter(player, nb), v]];
      } else {
        const res = this._dfs(team, player, game, stages, nidx,
          nb, np, nsp, alpha, beta, depth, ntaken);
        v = res[0];
        line = res[1];
      }
      if (count > 1) this._takenChars.delete(idx + "\u0001" + taken);
      if (v === null || v === undefined) v = 0.0;

      if (isMax) {
        if (v > bestVal) { bestVal = v; bestLine = [[code, c, v]].concat(line); }
        alpha = Math.max(alpha, v);
      } else {
        if (v < bestVal) { bestVal = v; bestLine = [[code, c, v]].concat(line); }
        beta = Math.min(beta, v);
      }
      if (beta <= alpha) {
        this.counters.cut++;
        break;
      }
    }

    if (memoOk && alpha0 < bestVal && bestVal < beta0) {
      this._memo.set(memoKey, [bestVal, bestLine.slice()]);
    }
    return [bestVal, bestLine];
  }
}

/** 等价于 Python 的 round(v, 4)。
 *
 * 不能用 Math.round(v*10000)/10000 —— 乘 1e4 本身带舍入误差，
 * 像 0.25155 这类正好落在半个刻度上的值会被判错边。
 * 这里在十进制串上直接舍入：toFixed(20) 把所有写法（含 1e-7）统一成
 * 「整数.小数」，取前 4 位小数、第 5 位起进舍，正好一半时舍到偶数，
 * 与 Python 的 round() 一致。
 */
function round4(v) {
  if (!Number.isFinite(v) || v === 0) return v;
  const s = Math.abs(v).toFixed(20);
  const dot = s.indexOf(".");
  const intPart = s.slice(0, dot);
  const frac = s.slice(dot + 1);
  const kept = frac.slice(0, 4).padEnd(4, "0");
  const rest = frac.slice(4);
  let n = BigInt(intPart + kept);          // 单位 1e-4
  if (rest.length) {
    const first = rest.charCodeAt(0) - 48;
    const tail = /[1-9]/.test(rest.slice(1));
    if (first > 5 || (first === 5 && (tail || n % 2n === 1n))) n += 1n;
  }
  const num = Number(n) / 10000;
  return v < 0 ? -num : num;
}

/** 圆整到 12 位有效小数：吸收浮点宏展开顺序带来的 1 ULP 尾差。 */
function round12(v) {
  return Number(v.toPrecision(12));
}


// ── ban_intel.js ──────────────────────────────────────────────────
/* ban 位情报（纯静态版）
 *
 * 与 scripts/ban_intel.py 的 stats / pmi / pair_score 逐位对齐。
 * 只读 bp_core.json，不依赖引擎。互斥对情报卡（matchup_alerts）不移植。
 *
 * 用途：① 段「对手最可能 ban 哪两个求生」的候选打分。
 *   score(pair, H) = 2.0×指纹次数 + 1.0×PMI + 0.05×热门度
 */

/** 计数器：等价于 Python 的 collections.Counter。 */
class Counter extends Map {
  add(key, n = 1) {
    this.set(key, (this.get(key) || 0) + n);
  }
}

/** 键必须是字符串才能放进 Map：二元组一律序列化成稳定的串。 */
function key2(a, b) {
  return String(a) + "\u0001" + String(b);
}

/** 无序对 → 稳定字符串键（等价于 Python 的 tuple(sorted(pair))）。 */
function pairKey(pair) {
  const arr = Array.from(pair);
  arr.sort();
  return arr.join("\u0001");
}

/**
 * 全局 ban / 出场统计，等价于 ban_intel.stats()。
 *
 * 静态版由调用方传入 core（Python 版每次自己读盘）。
 */
function stats(core) {
  const halves = (core && core.halves) || [];
  const S = {
    halves_n: halves.length,
    play: new Counter(),
    g_single: new Counter(),
    g_ban_total: 0,
    hunter_halves: new Counter(),
    ban_by: new Map(),      // hunter -> Counter
    pair_fp: new Map(),     // hunter -> Counter
    pair_play: new Counter(),
    pair_ban: new Counter(),
    pair_esc: new Map(),    // key2(X, hh) -> [escape, ...]
  };

  for (const h of halves) {
    const hh = h.hunter || "";
    S.hunter_halves.add(hh);
    const hb = h.hunter_bans || [];
    S.g_ban_total += hb.length;
    for (const c of hb) {
      S.g_single.add(c);
      if (!S.ban_by.has(hh)) S.ban_by.set(hh, new Counter());
      S.ban_by.get(hh).add(c);
      S.pair_ban.add(key2(c, hh));
    }
    if (hb.length >= 2) {
      if (!S.pair_fp.has(hh)) S.pair_fp.set(hh, new Counter());
      S.pair_fp.get(hh).add(pairKey(hb.slice(0, 2)));
    }
    for (const c of h.survivors || []) {
      S.play.add(c);
      S.pair_play.add(key2(c, hh));
      const k = key2(c, hh);
      if (!S.pair_esc.has(k)) S.pair_esc.set(k, []);
      S.pair_esc.get(k).push(h.escape);
    }
  }
  return S;
}

/**
 * 该监管比全联盟更爱 ban 这两个角色的程度（对数比之和）。
 *
 * Dirichlet 平滑（α=0.5，词表规模按 30 算 → 加 15），与 Python 版一致。
 * 没有该监管的 ban 记录时返回强负值，让排序自然靠后。
 */
function pmi(pair, hunter, S) {
  const bb = S.ban_by.get(hunter);
  const arr = Array.from(pair);
  if (!bb || bb.size === 0) return -3.0 * arr.length;
  let n = 0;
  for (const v of bb.values()) n += v;
  n = Math.max(n, 1);
  const gTot = Math.max(S.g_ban_total, 1);
  let sc = 0.0;
  for (const c of arr) {
    const pCh = ((bb.get(c) || 0) + 0.5) / (n + 15.0);
    const pC = ((S.g_single.get(c) || 0) + 0.5) / (gTot + 15.0);
    sc += Math.log(pCh / pC);
  }
  return sc;
}

/** 单监管视角的 ban 对打分（指纹 2 / PMI 1 / 热门 0.05）。 */
function pairScore(pair, hunter, S) {
  const fpMap = S.pair_fp.get(hunter);
  const fp = fpMap ? (fpMap.get(pairKey(pair)) || 0) : 0;
  const arr = Array.from(pair);
  return (2.0 * fp
    + 1.0 * pmi(pair, hunter, S)
    + 0.05 * ((S.play.get(arr[0]) || 0) + (S.play.get(arr[1]) || 0)));
}


// ── coach_report.js ──────────────────────────────────────────────────
/* 教练报告计算（纯静态版）
 *
 * 与 scripts/bp_coach_report.py 逐位对齐。只移植报告页要用的计算：
 *   line_state / run_from / value_after / pick_candidates
 *   ban_hunter_candidates / tree_options / build_tree
 *   infer_hunter_intent / one_combo
 *
 * 控制台打印（say / print）全部省略 —— 静态版只产数据。
 */


const STAGE_NAME = {
  "①": "监管 ban 求生", "②": "求生 ban 监管", "③": "求生选 1/2",
  "④": "监管 ban 求生", "⑤": "求生选 2/2", "⑥": "监管 ban 求生",
  "⑦": "求生选完", "⑩": "监管选人（仅展示）",
};

/** 沿线路重建每个动作发生前的状态。 */
function lineState(stages, line, startIdx = 0, startTaken = 0,
  startLban, startLpick, startSpicks) {
  const out = [];
  const lban = new Set(startLban || []);
  const lpick = new Set(startLpick || []);
  const spicks = new Set(startSpicks || []);
  let idx = startIdx;
  let tkn = startTaken;
  for (const [code, c, v] of line) {
    while (idx < stages.length && stages[idx][0] !== code) {
      idx++;
      tkn = 0;
    }
    if (idx >= stages.length) break;
    const kind = stages[idx][1];
    out.push({
      idx: idx, taken: tkn, code: code, kind: kind,
      lban: new Set(lban), lpick: new Set(lpick), spicks: new Set(spicks),
      chosen: c,
    });
    if (kind.endsWith("ban")) {
      lban.add(c);
    } else if (kind !== "hunt_pick") {
      lpick.add(c);
      spicks.add(c);
    }
    tkn++;
    if (tkn >= stages[idx][2]) { idx++; tkn = 0; }
  }
  return out;
}

/**
 * 从任意中间状态搜到叶子。
 *
 * fresh=true 时清空记忆化缓存。默认不清 —— memo 的 key 是完整状态，
 * 同一状态后续最优值与到达路径无关，可跨候选复用。
 * `_takenChars` 仍要清：它记的是当前路径上这一阶段选了谁。
 */
function runFrom(eng, team, player, game, idx, taken, lban, lpick, spicks,
  fresh = false) {
  const stages = eng.stages(game);
  eng.counters = { nodes: 0, cut: 0 };
  eng._takenChars = new Map();
  if (fresh) eng._memo = new Map();
  return eng._dfs(team, player, game, stages, idx,
    new Set(lban), new Set(lpick), new Set(spicks),
    -1e9, 1e9, stages.length, taken);
}

/** 在 state 之后强制走 char（可连带 extra），后续搜到叶子。 */
function valueAfter(eng, team, player, game, state, char, extra) {
  const stages = eng.stages(game);
  const kind = state.kind;
  const lban = new Set(state.lban);
  const lpick = new Set(state.lpick);
  const spicks = new Set(state.spicks);
  const acts = [char].concat(extra || []);
  for (const a of acts) {
    if (kind.endsWith("ban")) lban.add(a);
    else if (kind !== "hunt_pick") { lpick.add(a); spicks.add(a); }
  }
  const count = stages[state.idx][2];
  let nidx, ntaken;
  if (state.taken + acts.length >= count) { nidx = state.idx + 1; ntaken = 0; }
  else { nidx = state.idx; ntaken = state.taken + acts.length; }
  const [v] = runFrom(eng, team, player, game, nidx, ntaken, lban, lpick, spicks);
  return [v, { nidx: nidx, ntaken: ntaken, lban: lban, lpick: lpick, spicks: spicks }];
}

/** 当前可选的求生角色，按补进来后的浅层评估排序（可再乘地图倍数）。 */
function pickCandidates(eng, team, player, state, topn = 6, mapName) {
  const roster = eng.poolOf(team);
  const cs = roster.filter((c) => !state.lban.has(c) && !state.lpick.has(c));
  const keyOf = (c) => {
    const trial = new Set(state.spicks);
    trial.add(c);
    let v = eng._shallow(team, player, trial);
    if (mapName) v = v * eng.survMapMult(mapName, c);
    return -v;
  };
  const keys = new Map(cs.map((c) => [c, keyOf(c)]));
  cs.sort((a, b) => keys.get(a) - keys.get(b));
  return cs.slice(0, topn);
}

/** ② 求生 ban 监管的候选：威胁度降序（可乘地图倍数）。 */
function banHunterCandidates(eng, player, state, topn = 5, goneHunt, mapName) {
  const lb = state.lban || new Set();
  const lp = state.lpick || new Set();
  const gone = new Set(goneHunt || []);
  const cs = eng.banCandidatesHunt(player, mapName || "")
    .filter((c) => !lb.has(c) && !lp.has(c) && !gone.has(c));
  const threats = eng.players[player].threats;
  const thOf = (c) => {
    const t = threats.find((x) => x.char === c);
    let th = t ? t.threat : 0.0;
    if (mapName) th *= eng.mapMult(mapName, c);
    return th;
  };
  const keys = new Map(cs.map((c) => [c, -thOf(c)]));
  cs.sort((a, b) => keys.get(a) - keys.get(b));
  return cs.slice(0, topn);
}

/** 该状态下的候选及其后续值，按「对求生从好到坏」排序。 */
function treeOptions(eng, team, player, game, state, goneHunt, mapName, width) {
  const stages = eng.stages(game);
  const idx = state.idx;
  const taken = state.taken;
  const kind = state.kind;
  const lban = new Set(state.lban);
  const lpick = new Set(state.lpick);
  const spicks = new Set(state.spicks);
  let lineup = null;   // 只有 ⑩ 监管选人会填

  let cs;
  if (kind === "hunt_ban") {
    cs = eng.banCandidatesResponse(team, spicks, lban, lpick, player, width || 999);
  } else if (kind === "surv_ban") {
    const gone = new Set(goneHunt || []);
    cs = eng.banCandidatesHunt(player, mapName || "")
      .filter((c) => !gone.has(c) && !lban.has(c) && !lpick.has(c));
    const keys = new Map(cs.map((c) => [c,
      spicks.size ? eng.lineupScore(team, spicks, c) : 0]));
    cs.sort((a, b) => keys.get(a) - keys.get(b));
    if (width) cs = cs.slice(0, width);
  } else if (kind === "hunt_pick") {
    cs = Object.keys(eng.players[player].dist)
      .filter((c) => eng.strength[c] !== undefined
        && !lban.has(c) && !lpick.has(c));
    lineup = {};
    for (const c of cs) {
      lineup[c] = spicks.size ? eng.lineupScore(team, spicks, c) : 0;
    }
    cs.sort((a, b) => lineup[a] - lineup[b]);
    if (width) cs = cs.slice(0, width);
  } else {  // surv_pick
    const takenSet = new Set([...lban, ...lpick, ...spicks]);
    cs = eng.poolOf(team).filter((c) => !takenSet.has(c));
    const keys = new Map();
    for (const c of cs) {
      const trial = new Set(spicks);
      trial.add(c);
      keys.set(c, -eng._shallow(team, player, trial, lban));
    }
    cs.sort((a, b) => keys.get(a) - keys.get(b));
    if (width) cs = cs.slice(0, width);
  }

  const isMax = kind === "surv_pick" || kind === "surv_ban";
  const count = stages[idx][2];
  const out = [];
  for (const c of cs) {
    const nb = new Set(lban);
    const np = new Set(lpick);
    const nsp = new Set(spicks);
    if (kind.endsWith("ban")) nb.add(c);
    else { np.add(c); nsp.add(c); }
    let nidx, ntaken;
    if (taken + 1 >= count) { nidx = idx + 1; ntaken = 0; }
    else { nidx = idx; ntaken = taken + 1; }
    const [v] = runFrom(eng, team, player, game, nidx, ntaken, nb, np, nsp);
    const item = {
      char: c, value: v, idx: nidx, taken: ntaken,
      lban: nb, lpick: np, spicks: nsp, is_max: isMax,
    };
    if (lineup !== null) item.lineup = lineup[c];
    out.push(item);
  }
  out.sort((a, b) => (isMax ? b.value - a.value : a.value - b.value));
  // ⑩ 监管选人：总评分对每个候选都一样，改按阵容分排序
  if (lineup !== null) out.sort((a, b) => a.lineup - b.lineup);
  return out;
}

/** 递归展开后半段博弈树，返回「一层」。 */
function buildTree(eng, team, player, game, state, depthLeft = 3,
  goneHunt, mapName, width) {
  const stages = eng.stages(game);
  const opts = treeOptions(eng, team, player, game, state, goneHunt, mapName, width);
  const idx = state.idx;
  if (idx >= stages.length) return null;
  const [code, kind] = stages[idx];
  const layer = {
    stage: code, kind: kind,
    name: STAGE_NAME[code] || "",
    actor: (kind === "surv_pick" || kind === "surv_ban") ? "求生者" : "监管者",
    nodes: [],
  };
  if (!opts.length) return layer;
  let best = opts[0].value;
  if (kind === "hunt_pick") {
    best = opts[0].lineup === undefined ? opts[0].value : opts[0].lineup;
  }
  for (const o of opts) {
    const shown = kind === "hunt_pick"
      ? (o.lineup === undefined ? o.value : o.lineup)
      : o.value;
    const node = {
      char: o.char, value: round4(shown),
      delta: round4(shown - best),
      idx: o.idx, taken: o.taken,
    };
    if (kind === "hunt_pick") node.by = "lineup";
    const nidx = o.idx;
    const deeper = (nidx < stages.length && stages[nidx][1] !== "hunt_pick");
    if (deeper && depthLeft > 1) {
      node.next = buildTree(eng, team, player, game,
        {
          idx: nidx, taken: o.taken, kind: stages[nidx][1],
          lban: o.lban, lpick: o.lpick, spicks: o.spicks,
        },
        depthLeft - 1, goneHunt, mapName, width);
    } else if (deeper) {
      node.more = true;
    }
    layer.nodes.push(node);
  }
  return layer;
}

/** 反推：对手 ban 掉这些求生者之后，最可能是为了打哪些监管。 */
function inferHunterIntent(eng, team, player, bannedSurvivors, topn = 6,
  goneSurv, goneHunt, mapName) {
  const info = eng.players[player];
  const roster = eng.poolOf(team);
  const goneS = new Set(goneSurv || []);
  const banned = new Set(bannedSurvivors);
  const usable = roster.filter((c) => !banned.has(c) && !goneS.has(c));
  if (!usable.length) return [];

  const goneH = new Set(goneHunt || []);
  const rows = [];
  for (const t of info.threats.slice(0, 8)) {
    const h = t.char;
    if (t.p_use <= 0 || goneH.has(h)) continue;
    const scores = usable.map((c) => eng.cell(team, c, h)).sort((a, b) => b - a);
    const best3 = pySum(scores.slice(0, 3)) / Math.min(3, scores.length);
    const strong = 2.00 - best3;
    let hit;
    if (bannedSurvivors.length) {
      let banBest = -1e9;
      for (const c of bannedSurvivors) {
        const v = eng.cell(team, c, h);
        if (v > banBest) banBest = v;
      }
      hit = banBest - best3;
    } else {
      hit = 0.0;
    }
    const mult = mapName ? eng.mapMult(mapName, h) : 1.0;
    rows.push({
      char: h, p_use: t.p_use, threat: t.threat,
      best3: best3, strong: strong, hit: hit,
      mult: round4(mult),
      targeted: hit >= -0.10,
      score: t.p_use * Math.max(strong, 0.0) + t.threat * 0.5 * mult
        + (hit >= -0.10 ? 0.15 : 0.0),
    });
  }
  rows.sort((a, b) => b.score - a.score);
  return rows.slice(0, topn);
}

/** 针对一组 ① ban 生成四问报告（数值部分，不含控制台打印）。 */
function oneCombo(eng, team, player, game, bans, goneSurv, goneHunt, mapName) {
  eng.mapName = mapName || "";
  const stages = eng.stages(game);
  const lban = new Set([...bans, ...(goneSurv || []), ...(goneHunt || [])]);
  let idx1 = -1;
  for (let i = 0; i < stages.length; i++) { if (stages[i][0] === "①") { idx1 = i; break; } }
  if (idx1 < 0 || idx1 + 1 >= stages.length) return null;
  const nidx = idx1 + 1;
  const ntaken = 0;

  // ── 问题 1：反推对手想打的监管 ──
  const rows = inferHunterIntent(eng, team, player, bans, 6,
    goneSurv, goneHunt, mapName);
  const intent = [];
  for (const r of rows.slice(0, 6)) {
    intent.push({
      char: r.char,
      p_use: round4(r.p_use),
      strength: round4(eng.strength[r.char] === undefined ? 0 : eng.strength[r.char]),
      best3: round4(r.best3),
      strong: round4(r.strong),
      hit: round4(r.hit),
      threat: round4(r.threat),
      mult: r.mult === undefined ? 1.0 : r.mult,
    });
  }
  let intentNote = "";
  if (intent.length) {
    const hits = intent.map((d) => d.hit).sort((a, b) => b - a);
    const lead = hits.length > 1 ? hits[0] - hits[1] : 0.0;
    const best = intent[0];
    if (hits[0] >= -0.10 && lead >= 0.15) {
      intentNote = "有针对性：" + best.char + " 的针对度 " + fmtSigned(hits[0], 2)
        + "，明显高于次席 " + fmtSigned(hits[1], 2) + "（领先 " + lead.toFixed(2) + "）";
    } else if (hits[0] >= 0.0) {
      intentNote = "有针对性：被 ban 的角色对 " + best.char + " 本来就是本队最好用的（"
        + fmtSigned(hits[0], 2) + "）";
    } else {
      intentNote = "没有明显针对性（各监管针对度在 " + fmtSigned(hits[0], 2) + " ~ "
        + fmtSigned(hits[hits.length - 1], 2) + " 之间波动但整体偏负），更像通用的强角色 ban";
    }
  }

  // ── 问题 2：我该 ban 对手哪几个 ──
  const st2 = {
    idx: nidx, taken: ntaken, kind: stages[nidx][1],
    lban: new Set(lban), lpick: new Set(), spicks: new Set(),
  };
  const quota = stages[nidx][1] === "surv_ban" ? stages[nidx][2] : 0;
  let chosenBan = [];
  const banRows = [];
  let banNote = "";
  if (quota === 0) {
    banNote = "第 1 局没有 ban 监管的名额";
  } else {
    const cands = banHunterCandidates(eng, player, st2, 5, goneHunt, mapName);
    let rr = cands.map((c) => [c, valueAfter(eng, team, player, game, st2, c)[0]]);
    rr.sort((a, b) => b[1] - a[1]);
    const threats = eng.players[player].threats;
    for (const [c, v] of rr) {
      const t = threats.find((x) => x.char === c);
      banRows.push({ char: c, value: round4(v), p_use: round4(t ? t.p_use : 0) });
    }
    if (quota >= 2) {
      let bc = null;
      for (let i = 0; i < rr.length; i++) {
        for (let j = i + 1; j < rr.length; j++) {
          const a = rr[i][0];
          const b = rr[j][0];
          const v = valueAfter(eng, team, player, game, st2, a, [b])[0];
          if (bc === null || v > bc[2]) bc = [a, b, v];
        }
      }
      chosenBan = bc ? [bc[0], bc[1]] : rr.slice(0, quota).map((x) => x[0]);
    } else {
      chosenBan = [rr[0][0]];
    }
    if (chosenBan.length) {
      const spread = rr[0][1] - rr[rr.length - 1][1];
      if (spread < 0.005) {
        banNote = "所有候选几乎等价（极差 " + spread.toFixed(3)
          + "），ban 谁都不改变结局，可优先 ban 自己更不想面对的那个";
      }
    }
  }

  // ── 问题 3：我该先选哪两个 ──
  let idx3 = -1;
  for (let i = 0; i < stages.length; i++) { if (stages[i][0] === "③") { idx3 = i; break; } }
  if (idx3 < 0) return null;
  const lban3 = new Set([...lban, ...chosenBan]);
  const [, line3] = runFrom(eng, team, player, game, idx3, 0, lban3, new Set(), new Set());
  const pair = line3.filter((x) => x[0] === "③").slice(0, 2).map((x) => [x[1], x[2]]);
  if (pair.length < 2) return null;
  const firstPick = pair[0][0];
  const secondPick = pair[1][0];

  const picksDetail = pair.map(([c, v], i) => ({
    char: c, value: round4(v),
    pos: eng.positions[c] || [],
    solid: SOLID.has(c), order: i + 1,
  }));

  const solidN = [firstPick, secondPick].filter((c) => SOLID.has(c)).length;

  // ── 问题 4：后续 ban-pick 怎么走 ──
  const picked = new Set([firstPick, secondPick]);
  const nidx3 = idx3 + 1;
  const ntaken3 = 0;
  const nb3 = lban3;
  const np3 = picked;
  const ns3 = picked;
  const [v4, line4] = runFrom(eng, team, player, game, nidx3, ntaken3, nb3, np3, ns3);
  const lineRows = line4.map(([code, c, v]) => ({
    stage: code, name: STAGE_NAME[code] || "", char: c, value: round4(v),
  }));

  const steps = lineState(stages, line4, nidx3, ntaken3, nb3, np3, ns3);
  const stepRows = [];
  for (const st of steps) {
    if (st.kind === "hunt_pick") continue;
    const kind = st.kind;
    const code = st.code;
    let cs;
    let isMax;
    if (kind === "hunt_ban") {
      cs = eng.banCandidatesResponse(team, st.spicks, st.lban, st.lpick,
        player, eng.candBanSurv).slice(0, 3);
      isMax = false;
    } else if (kind === "surv_ban") {
      cs = banHunterCandidates(eng, player, st, 3, goneHunt, mapName);
      isMax = true;
    } else {
      cs = pickCandidates(eng, team, player, st, 3, mapName);
      isMax = true;
    }
    if (cs.indexOf(st.chosen) < 0) cs = [st.chosen].concat(cs.slice(0, 2));
    const rr = cs.slice(0, 3).map((c) => [c, valueAfter(eng, team, player, game, st, c)[0]]);
    // 排序按「谁在做选择」：监管 ban 时挑值最低的，所以按升序
    rr.sort((a, b) => (isMax ? b[1] - a[1] : a[1] - b[1]));
    const hitRow = rr.find((x) => x[0] === st.chosen);
    const bv = hitRow ? hitRow[1] : rr[0][1];
    const opts = rr.map(([c, v]) => ({
      char: c, value: round4(v), delta: round4(v - bv),
      chosen: c === st.chosen, better: (v - bv) > 1e-9,
    }));
    stepRows.push({
      stage: code, name: STAGE_NAME[code] || "",
      actor: isMax ? "求生者" : "监管者",
      chosen: st.chosen, options: opts,
    });
  }

  // 后半段里属于 ③ 的那一手就是第二手，避免和前两手拼成 5 人
  const allPicks = steps
    .filter((s) => s.kind === "surv_pick" && s.code !== "③")
    .map((s) => s.chosen);
  const lineup = [firstPick, secondPick].concat(allPicks);

  // ⑤ 交互树：从「③ 两手都定下」的状态开始，只预展开 2 层
  let tree = [];
  let treeState = null;
  if (nidx3 < stages.length && stages[nidx3][1] !== "hunt_pick") {
    treeState = {
      idx: nidx3, taken: ntaken3,
      lban: Array.from(nb3).sort(), lpick: Array.from(np3).sort(),
      spicks: Array.from(ns3).sort(),
    };
    tree = buildTree(eng, team, player, game,
      {
        idx: nidx3, taken: ntaken3, kind: stages[nidx3][1],
        lban: nb3, lpick: np3, spicks: ns3,
      },
      2, goneHunt, mapName) || [];
  }

  const solid = lineup.filter((c) => SOLID.has(c));
  const kite = lineup.filter((c) => !SOLID.has(c)
    && (eng.positions[c] || []).indexOf(KITE_TYPE) >= 0);
  const r = eng.expectedVsPlayer(team, lineup, player);

  return {
    bans: Array.from(bans),
    map: mapName || "",
    intent: intent,
    intent_note: intentNote,
    ban_quota: quota,
    ban_options: banRows,
    ban_hunter: chosenBan,
    ban_note: banNote,
    first_pick: firstPick,
    second_pick: secondPick,
    picks_detail: picksDetail,
    solid_n: solidN,
    lineup_solid_n: solid.length,
    half_value: round4(v4),
    line: lineRows,
    steps: stepRows,
    tree: tree,
    tree_state: treeState,
    lineup: lineup,
    solid: solid,
    kite: kite,
    expect: round4(r.expect),
    picks: [firstPick, secondPick],
  };
}

function fmtSigned(v, digits) {
  return (v > 0 ? "+" : "") + v.toFixed(digits);
}


// ── combo_report.js ──────────────────────────────────────────────────
/* 组合报告计算（纯静态版）
 *
 * 与 scripts/bp_combo_report.py 逐位对齐：
 *   enumerate_hunters / candidate_bans / compute / build_summary
 *
 * 不移植 matchup_alerts（互斥对情报卡）—— 报告页不要这张卡。
 * 只读 5 份 JSON，不复刻构建管线。
 */


/** 对手可能想打的 n 个监管，按（使用率 × 强度 + 威胁）排序。 */
function enumerateHunters(eng, player, n = 4, exclude, mapName) {
  const gone = new Set(exclude || []);
  const info = eng.players[player];
  const rows = [];
  for (const t of info.threats) {
    const h = t.char;
    if (t.p_use <= 0 || gone.has(h)) continue;
    const mult = mapName ? eng.mapMult(mapName, h) : 1.0;
    const s = eng.strength[h] === undefined ? 0.0 : eng.strength[h];
    rows.push({
      char: h,
      p_use: t.p_use,
      threat: t.threat,
      mult: round4(mult),
      strength: s,
      score: t.p_use * s + t.threat * 0.5 * mult,
    });
  }
  rows.sort((a, b) => b.score - a.score);
  return rows.slice(0, n);
}

/**
 * 枚举对手最可能 ban 的两个求生者，按真实 ban 行为打分。
 *
 * score(pair) = max_h( 2.0×指纹 + 1.0×PMI + 0.05×热门度 )
 * 候选池：本队出场率 top10 的两两组合 ∪ 指纹里出现过的对。
 */
function candidateBans(eng, team, player, core, nHunters = 4, bantop = 5,
  top = 8, exclude) {
  const S = stats(core);
  const gone = new Set(exclude || []);
  const roster = eng.poolOf(team).filter((c) => !gone.has(c));
  if (roster.length < 2) return [];

  const dist = (eng.players[player] || {}).dist || {};
  const candH = Object.keys(dist).filter((h) => dist[h] > 0 && !gone.has(h));

  // 候选对池
  const hot = roster.slice().sort((a, b) => (S.play.get(b) || 0) - (S.play.get(a) || 0))
    .slice(0, 10);
  const rosterSet = new Set(roster);
  const pairs = new Map();   // pairKey -> 排序后的 [a, b]
  for (let i = 0; i < hot.length; i++) {
    for (let j = i + 1; j < hot.length; j++) {
      const p = [hot[i], hot[j]].sort();
      pairs.set(p.join("\u0001"), p);
    }
  }
  for (const hh of candH) {
    const fpMap = S.pair_fp.get(hh);
    if (!fpMap) continue;
    for (const k of fpMap.keys()) {
      const pair = k.split("\u0001");
      if (pair.length === 2 && rosterSet.has(pair[0]) && rosterSet.has(pair[1])) {
        pairs.set(pairKey(pair), pair);
      }
    }
  }
  if (!pairs.size) return [];

  const TOP_H = 3;
  const merged = [];
  for (const pair of pairs.values()) {
    const allScored = candH.map((hh) => [pairScore(pair, hh, S), hh]);
    // Python: sorted(..., reverse=True) —— 分数降序，同分时监管名也降序
    allScored.sort((a, b) => {
      const d = b[0] - a[0];
      if (d !== 0) return d;
      return a[1] < b[1] ? 1 : (a[1] > b[1] ? -1 : 0);
    });
    const kept = allScored.filter((x) => x[0] > -50)
      .map((x) => [round4(x[0]), x[1]]);
    if (!kept.length) continue;
    const scored = kept.slice(0, TOP_H);
    merged.push({
      bans: pair.slice(),
      weight: scored[0][0],
      hunters: scored.map((x) => x[1]),
      hunter_scores: scored.map((x) => ({ char: x[1], score: x[0] })),
      hunter_rank: kept.map((x) => ({ char: x[1], score: x[0] })),
      _pairKey: pairKey(pair),
    });
  }
  merged.sort((a, b) => {
    const d = b.weight - a.weight;
    if (d !== 0) return d;
    return a._pairKey < b._pairKey ? -1 : (a._pairKey > b._pairKey ? 1 : 0);
  });
  const rows = merged.slice(0, top);
  rows.forEach((r, i) => { r.rank = i; });
  return rows;
}

/** 以「对手 ban 组合」为轴的整份报告。 */
function compute(eng, team, player, game, opt = {}) {
  const nHunters = opt.nHunters === undefined ? 4 : opt.nHunters;
  const bantop = opt.bantop === undefined ? 5 : opt.bantop;
  const nCombos = opt.nCombos === undefined ? 8 : opt.nCombos;
  const mapName = opt.mapName || "";
  const globalBan = opt.globalBan || [];
  const globalBanSurv = opt.globalBanSurv || [];
  const globalBanHunt = opt.globalBanHunt || [];
  const ourPool = opt.ourPool || null;
  const scoresSource = opt.scoresSource || "";
  const rosterSource = opt.rosterSource || "";

  const t0 = (typeof performance !== "undefined" && performance.now)
    ? performance.now() : Date.now();

  eng.mapName = mapName;
  const stagesQ = eng.stages(game);
  const quota = banQuotaOf(stagesQ);
  const goneS = new Set([...globalBanSurv, ...globalBan]);
  const goneH = new Set([...globalBanHunt, ...globalBan]);

  // ② 监管方可能考虑的监管前 N
  const hunters = enumerateHunters(eng, player, nHunters, goneH, mapName);
  const hunterRows = hunters.map((h) => {
    const pu = round4(h.p_use);
    const st = round4(h.strength);
    const th = round4(h.threat);
    const mu = h.mult === undefined ? 1.0 : h.mult;
    return {
      char: h.char,
      p_use: pu,
      strength: st,
      threat: th,
      mult: mu,
      score: round4(pu * st + th * 0.5 * mu),
    };
  });

  // ① 候选 ban 组合
  const exclude = new Set([...goneS, ...goneH]);
  const cands = candidateBans(eng, team, player, eng.core, nHunters, bantop,
    nCombos, exclude);

  const combos = [];
  for (const c of cands) {
    const bans = c.bans.slice();
    if (mapName) {
      for (const r of c.hunter_rank) {
        r.mult = round4(eng.mapMult(mapName, r.char));
      }
    }
    const r = oneCombo(eng, team, player, game, bans, goneS, goneH, mapName);
    if (!r) continue;
    combos.push({
      bans: bans,
      label: bans.join(" + "),
      map: mapName || "",
      weight: c.weight,
      rank: c.rank,
      hunters: c.hunters,
      hunter_scores: c.hunter_scores || [],
      hunter_rank: c.hunter_rank || [],
      intent: r.intent,
      intent_note: r.intent_note,
      ban_quota: r.ban_quota,
      ban_options: r.ban_options,
      ban_hunter: r.ban_hunter,
      ban_note: r.ban_note,
      first_pick: r.first_pick,
      second_pick: r.second_pick,
      picks_detail: r.picks_detail,
      solid_n: r.solid_n,
      picks: r.picks,
      half_value: r.half_value,
      line: r.line,
      steps: r.steps,
      tree: r.tree || [],
      tree_state: r.tree_state,
      lineup: r.lineup,
      solid: r.solid,
      kite: r.kite,
      expect: r.expect,
    });
  }

  const pool = (ourPool && ourPool.length) ? ourPool.slice() : eng.poolOf(team);
  const t1 = (typeof performance !== "undefined" && performance.now)
    ? performance.now() : Date.now();

  const meta = {
    season: "IVL 2026 秋季赛",
    team: team,
    player: player,
    game: game,
    map: mapName || "",
    generated_at: stampNow(),
    elapsed_s: Math.round((t1 - t0) / 100) / 10,
    ban_quota: quota,
    bantop: bantop,
    hunters: nHunters,
    mode: "combo",
    global_ban_surv: Array.from(goneS).sort(),
    global_ban_hunt: Array.from(goneH).sort(),
    scores_override: Object.keys(eng.scoresOverride || {}).length > 0,
    scores_source: scoresSource || "",
    roster_source: rosterSource || "",
    our_pool: pool,
    combo_count: combos.length,
    note: "评估单位是局均逃脱，经「最低 3 人」聚合后系统性偏低，"
      + "只用于同一对手下的相对比较。",
  };

  return {
    meta: meta,
    hunters: hunterRows,
    combos: combos,
    matchup_alerts: [],
    summary: buildSummary(meta, hunterRows, combos),
  };
}

/** 五段式摘要。3~5 段只放「当前选中的组合」那一份。 */
function buildSummary(meta, hunterRows, combos) {
  const top = combos.length ? combos[0] : null;
  return {
    sections: [
      {
        title: "对手前两个 ban 位",
        key: "combos",
        options: combos.map((c) => ({
          bans: c.bans, label: c.label, weight: c.weight, hunters: c.hunters,
        })),
        current: top ? top.bans : [],
      },
      {
        title: "监管方可能考虑的监管前 " + meta.hunters,
        key: "hunters",
        rows: hunterRows,
      },
      {
        title: "我方应 ban 哪几个监管",
        key: "ban_hunter",
        rows: top ? top.ban_options : [],
        current: top ? top.ban_hunter : [],
        note: top ? top.ban_note : "",
      },
      {
        title: "我方前两手怎么选",
        key: "picks",
        picks: top ? top.picks : [],
        picks_detail: top ? top.picks_detail : [],
        solid_n: top ? top.solid_n : 0,
      },
      {
        title: "后面博弈树怎么选",
        key: "tree",
        line: top ? top.line : [],
        steps: top ? top.steps : [],
        lineup: top ? top.lineup : [],
        expect: top ? top.expect : null,
      },
    ],
    head_hunter: (top && top.hunters.length) ? top.hunters[0] : null,
  };
}

/** 局数 → ban 监管名额（与 engine.js 的 banQuota 同口径）。 */
function banQuotaOf(stages) {
  for (const s of stages) if (s[1] === "surv_ban") return s[2];
  return 0;
}

/** 与 Python time.strftime("%Y-%m-%d %H:%M") 同格式的本地时间。 */
function stampNow() {
  const d = new Date();
  const p = (n) => (n < 10 ? "0" + n : String(n));
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate())
    + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}



// ── app.js ──────────────────────────────────────────────────
/* 纯静态版报告页。
 *
 * 数据只来自 data/core.json（一份合并好的 JSON），
 * 计算全部在浏览器里跑，没有服务器。
 *
 * 报告结构与本地服务版一致：meta / hunters / combos / summary。
 * 互斥对情报卡（matchup_alerts）不做。
 */


const $ = (s) => document.querySelector(s);
const esc = (s) => Char.esc(s);
// 纯静态版不带头像，角色名只输出文字块
const chip = (n) => Char.chip(n);
const chips = (list) => Char.chips(list);

let ENGINE = null;
let DATA = null;
let LAST = null;          // 当前展示的报告
let CUR = 0;              // 当前选中的组合下标
let GB_SURV = new Set();  // 我方已用掉的求生者
let GB_HUNT = new Set();  // 对方已用掉的监管

// ── 启动 ────────────────────────────────────────────────
async function boot() {
  try {
    setBoot("初始化数据 …");
    DATA = window.__CORE_DATA__;
    setBoot("初始化引擎 …");
    ENGINE = new Engine(DATA);
    fillSelects();
    $("#bootCard").classList.add("hidden");
    $("#formCard").classList.remove("hidden");
  } catch (e) {
    setBoot("加载失败：" + e.message
      + "（纯静态版需要 data/core.json 与页面同源）", true);
  }
}

function setBoot(msg, bad) {
  $("#bootMsg").textContent = msg;
  $("#bootMsg").style.color = bad ? "var(--danger)" : "";
}

function fillSelects() {
  const teams = Object.keys(ENGINE.teams).sort();
  const opts = (list) => list
    .map((t) => '<option value="' + esc(t) + '">' + esc(t) + "</option>").join("");
  $("#selTeam").innerHTML = opts(teams);
  $("#selRival").innerHTML = opts(teams);

  // 求生队打过的对手监管选手，按「对手战队 → 选手」分组
  const opp = opponentsByTeam();

  const fillRivals = () => {
    const t = $("#selTeam").value;
    const rivals = Object.keys(opp[t] || {}).sort();
    $("#selRival").innerHTML = opts(rivals);
  };
  const fillPlayers = () => {
    const t = $("#selTeam").value;
    const r = $("#selRival").value;
    const ps = (opp[t] || {})[r] || [];
    $("#selPlayer").innerHTML = opts(ps);
  };
  fillRivals();
  fillPlayers();
  fillGames();

  $("#selTeam").onchange = () => { fillRivals(); fillPlayers(); fillGames(); };
  $("#selRival").onchange = () => { fillPlayers(); fillGames(); };

  const maps = ENGINE.maps();
  $("#selMap").innerHTML = '<option value="">不指定地图</option>'
    + maps.map((m) => '<option value="' + esc(m) + '">' + esc(m) + "</option>").join("");
  $("#selGame").onchange = renderGban;
  buildGban();
}

// ── 全局禁选 ────────────────────────────────────────────
// 同一场内，前面几局我方用掉的求生不能再选，对方用掉的监管不能再拿。
// 第 x 局恰好 4(x-1) 个求生、x-1 个监管，数量不对就不让生成。
let GB_ALL = { surv: [], hunt: [], sc: {}, hc: {} };

function buildGban() {
  const sc = {}, hc = {};
  const sv = new Set(), hv = new Set();
  for (const h of DATA.halves || []) {
    for (const c of h.survivors || []) { sc[c] = (sc[c] || 0) + 1; sv.add(c); }
    if (h.hunter) { hc[h.hunter] = (hc[h.hunter] || 0) + 1; hv.add(h.hunter); }
  }
  GB_ALL = {
    surv: Array.from(sv), hunt: Array.from(hv), sc: sc, hc: hc,
  };
  renderGban();
}

function paintGban(sel, set, tag, all, counts) {
  const list = all.slice().sort((a, b) => (counts[b] || 0) - (counts[a] || 0)
    || (a < b ? -1 : a > b ? 1 : 0));
  $(sel).innerHTML = list.map((c) => '<span class="gb' + (set.has(c) ? " on" : "")
    + '" data-c="' + esc(c) + '" title="' + esc(c) + "（本季出场 "
    + (counts[c] || 0) + ' 次）">' + esc(c) + "</span>").join("");
  $(sel).querySelectorAll(".gb").forEach((el) => {
    el.onclick = () => {
      const c = el.dataset.c;
      if (set.has(c)) set.delete(c); else set.add(c);
      el.classList.toggle("on", set.has(c));
      renderGban();
    };
  });
  $(tag).textContent = set.size + " 个";
}

function renderGban() {
  if (!ENGINE) return;
  paintGban("#gbSurv", GB_SURV, "#gbSTag", GB_ALL.surv, GB_ALL.sc);
  paintGban("#gbHunt", GB_HUNT, "#gbHTag", GB_ALL.hunt, GB_ALL.hc);
  const game = Number($("#selGame").value) || 1;
  const needS = (game - 1) * 4, needH = game - 1;
  const gotS = GB_SURV.size, gotH = GB_HUNT.size;
  const ok = gotS === needS && gotH === needH;
  const quota = banQuotaOf(ENGINE.stages(game));
  let hint = "第 <b>" + game + "</b> 局：我方 ban 监管名额 <b>" + quota + "</b> 个"
    + (quota === 0 ? "（第 1 局没有 ban 名额，只需看对手先 ban 谁）" : "")
    + "<br><b>全局禁选：第 " + game + " 局恰好要填 " + needS + " 个求生、"
    + needH + " 个监管</b>（前面 " + (game - 1) + " 局每局我方用掉 4 个求生、对方用掉 1 个监管）"
    + '<br><span style="color:' + (ok ? "var(--good)" : "var(--warn)") + '">'
    + "已选：求生 " + gotS + "/" + needS + " 个，监管 " + gotH + "/" + needH + " 个。"
    + (ok ? "数量正确。"
      : gotS > needS ? "求生多选了 " + (gotS - needS) + " 个。"
      : gotS < needS ? "求生还差 " + (needS - gotS) + " 个。"
      : gotH > needH ? "监管多选了 " + (gotH - needH) + " 个。"
      : "监管还差 " + (needH - gotH) + " 个。")
    + "</span>";
  $("#gbHint").innerHTML = hint;
  $("#gbHint").classList.toggle("bad", !ok);
  $("#btnRun").disabled = !ok;
  $("#btnRun").title = ok ? "" : "全局禁选数量必须与局数吻合";
}

function banQuotaOf(stages) {
  for (const s of stages) if (s[1] === "surv_ban") return s[2];
  return 0;
}

function fillGames() {
  const t = $("#selTeam").value;
  const r = $("#selRival").value;
  const ps = (opponentsByTeam()[t] || {})[r] || [];
  const games = new Set();
  for (const h of DATA.halves || []) {
    if (h.survivor_team === t && h.hunter_team === r
      && ps.indexOf(h.hunter_player) >= 0) games.add(h.game);
  }
  if (!games.size) games.add(1);
  const gs = Array.from(games).sort((a, b) => a - b);
  const cur = Number($("#selGame").value) || gs[0];
  $("#selGame").innerHTML = gs
    .map((g) => '<option value="' + g + '"'
      + (g === cur ? " selected" : "") + ">第 " + g + " 局</option>").join("");
}

// 求生队 → { 对手战队 → [该战队用它打过的监管选手] }
let byTeamPlayers = {};
let byOpp = {};
function opponentsByTeam() {
  byOpp = {};
  for (const h of DATA.halves || []) {
    const t = h.survivor_team, r = h.hunter_team, p = h.hunter_player;
    if (!t || !r || !p) continue;
    if (!byOpp[t]) byOpp[t] = {};
    if (!byOpp[t][r]) byOpp[t][r] = new Set();
    byOpp[t][r].add(p);
  }
  for (const t of Object.keys(byOpp)) {
    for (const r of Object.keys(byOpp[t])) {
      byOpp[t][r] = Array.from(byOpp[t][r]).sort();
    }
  }
  return byOpp;
}

// ── 生成 ────────────────────────────────────────────────
async function run() {
  const team = $("#selTeam").value;
  const player = $("#selPlayer").value;
  const game = Number($("#selGame").value) || 1;
  const map = $("#selMap").value || "";
  const btn = $("#btnRun");
  btn.disabled = true;
  ioMsg("计算中 … 一组大约十几秒，先别关页面", false);
  // 让浏览器先把提示画出来再开算
  await new Promise((r) => setTimeout(r, 30));
  try {
    const eng = new Engine(DATA);
    const r = compute(eng, team, player, game, {
      nCombos: 2, mapName: map,
      globalBanSurv: Array.from(GB_SURV),
      globalBanHunt: Array.from(GB_HUNT),
    });
    LAST = r;
    CUR = 0;
    render();
    ioMsg("完成，用时 " + r.meta.elapsed_s + " s", true);
  } catch (e) {
    ioMsg("计算出错：" + e.message, false, true);
  } finally {
    btn.disabled = false;
  }
}

function ioMsg(msg, ok, bad) {
  const el = $("#ioMsg");
  el.textContent = msg;
  el.className = "io" + (bad ? " err" : (ok ? " ok" : ""));
}

// ── 渲染 ────────────────────────────────────────────────
function render() {
  const r = LAST;
  const box = $("#report");
  box.classList.remove("hidden");
  if (!r || !r.combos.length) {
    box.innerHTML = '<div class="card"><h2><span class="num">!</span>没有结果</h2>'
      + '<p class="lead">这个组合下没能算出报告，换一组条件试试。</p></div>';
    return;
  }
  CUR = Math.min(CUR, r.combos.length - 1);
  const c = r.combos[CUR];

  box.innerHTML = headCard(r)
    + tabsCard(r)
    + combosCard(c)
    + huntersCard(r)
    + intentCard(c)
    + banCard(c)
    + picksCard(c)
    + treeCard(c);

  $("#report").querySelectorAll("[data-combo]").forEach((el) => {
    el.onclick = () => { CUR = Number(el.dataset.combo); render(); };
  });
}

function headCard(r) {
  const m = r.meta;
  const gs = m.global_ban_surv || [];
  const gh = m.global_ban_hunt || [];
  return '<section class="card"><h2><span class="num">·</span>本次设置</h2>'
    + '<p class="lead">' + esc(m.season) + ' · 第 ' + m.game + ' 局'
    + (m.map ? " · " + esc(m.map) : " · 不指定地图") + '</p>'
    + '<div class="verdict">'
    + '<div>求生方 <b>' + esc(m.team) + '</b>　对手监管选手 <b>' + esc(m.player)
    + '</b>　第 ' + m.game + ' 局 ban 监管名额 <b>' + m.ban_quota + '</b> 个</div>'
    + (gs.length ? '<div style="margin-top:6px">已用掉的求生（' + gs.length + '）：'
      + chips(gs) + '</div>' : "")
    + (gh.length ? '<div style="margin-top:6px">对方已用掉的监管（' + gh.length + '）：'
      + chips(gh) + '</div>' : "")
    + '<div style="margin-top:8px;color:var(--dim)">' + esc(m.note) + '</div>'
    + '</div></section>';
}

function tabsCard(r) {
  return '<section class="card"><h2><span class="num">1</span>对手前两个 ban 位</h2>'
    + '<p class="lead">按对手历史上 ban 这两个求生的习惯打分，点一个看后面三问。</p>'
    + '<div class="combo-tabs">'
    + r.combos.map((c, i) => '<button data-combo="' + i + '"'
      + (i === CUR ? ' class="on"' : "") + '>' + chips(c.bans)
      + '<span class="pill" style="margin-left:6px">' + fmt(c.weight) + '</span>'
      + "</button>").join("")
    + '</div></section>';
}

function combosCard(c) {
  return '<section class="card"><h2><span class="num">1</span>当前组合：'
    + chips(c.bans) + '</h2>'
    + '<p class="lead">可能性 ' + fmt(c.weight) + '，指向的监管：'
    + chips(c.hunters) + '</p>'
    + '<div class="tablewrap"><table><thead><tr><th>监管</th>'
    + '<th class="num">可能性分数</th></tr></thead><tbody>'
    + (c.hunter_scores || []).map((x) => '<tr><td>' + chip(x.char) + '</td>'
      + '<td class="num">' + fmt(x.score) + "</td></tr>").join("")
    + "</tbody></table></div></section>";
}

function huntersCard(r) {
  return '<section class="card"><h2><span class="num">2</span>对手可能想打的监管</h2>'
    + '<p class="lead">使用率 × 强度 + 威胁，反推他这局最想拿谁。</p>'
    + '<div class="tablewrap"><table><thead><tr><th>监管</th>'
    + '<th class="num">使用率</th><th class="num">强度</th><th class="num">威胁</th>'
    + '<th class="num">综合</th></tr></thead><tbody>'
    + r.hunters.map((x) => '<tr><td>' + chip(x.char) + '</td>'
      + '<td class="num">' + pct(x.p_use) + '</td>'
      + '<td class="num">' + fmt(x.strength) + '</td>'
      + '<td class="num">' + fmt(x.threat) + '</td>'
      + '<td class="num"><b>' + fmt(x.score) + "</b></td></tr>").join("")
    + "</tbody></table></div></section>";
}

function intentCard(c) {
  if (!c.intent || !c.intent.length) return "";
  return '<section class="card"><h2><span class="num">2</span>这组 ban 想针对谁</h2>'
    + (c.intent_note ? '<div class="verdict">' + esc(c.intent_note) + "</div>" : "")
    + '<div class="tablewrap" style="margin-top:10px"><table><thead><tr>'
    + '<th>监管</th><th class="num">使用率</th><th class="num">对剩余最优三人</th>'
    + '<th class="num">压制</th><th class="num">针对度</th></tr></thead><tbody>'
    + c.intent.map((x) => '<tr><td>' + chip(x.char) + '</td>'
      + '<td class="num">' + pct(x.p_use) + '</td>'
      + '<td class="num">' + fmt(x.best3) + '</td>'
      + '<td class="num">' + fmt(x.strong) + '</td>'
      + '<td class="num">' + signed(x.hit) + "</td></tr>").join("")
    + "</tbody></table></div></section>";
}

function banCard(c) {
  if (!c.ban_quota) {
    return '<section class="card"><h2><span class="num">3</span>我方应 ban 哪个监管</h2>'
      + '<div class="verdict">' + esc(c.ban_note || "第 1 局没有 ban 监管的名额") + "</div></section>";
  }
  const rows = c.ban_options || [];
  const best = rows.length ? rows[0].value : 0;
  const worst = rows.length ? rows[rows.length - 1].value : 0;
  const span = (best - worst) || 1;
  return '<section class="card"><h2><span class="num">3</span>我方应 ban 哪个监管</h2>'
    + '<div class="verdict"><b>建议 ban：</b>' + chips(c.ban_hunter)
    + (c.ban_note ? '<div style="margin-top:6px">' + esc(c.ban_note) + "</div>" : "")
    + "</div>"
    + '<div class="tablewrap" style="margin-top:10px"><table><thead><tr>'
    + '<th>候选</th><th class="num">后续期望</th><th></th></tr></thead><tbody>'
    + rows.map((x) => {
      const w = Math.max(4, Math.round(((x.value - worst) / span) * 100));
      const on = (c.ban_hunter || []).indexOf(x.char) >= 0;
      return '<tr><td>' + chip(x.char)
        + (on ? ' <span class="pill on">建议</span>' : "") + "</td>"
        + '<td class="num">' + fmt(x.value) + "</td>"
        + "<td><div class=\"opt\"><div class=\"bar\"><i style=\"width:" + w
        + '%"></i></div></div></td></tr>';
    }).join("")
    + "</tbody></table></div></section>";
}

function picksCard(c) {
  const d = c.picks_detail || [];
  return '<section class="card"><h2><span class="num">4</span>我方前两手</h2>'
    + '<p class="lead">先定这两个，顺序就是出手顺序。</p>'
    + '<div class="verdict" style="font-size:13.5px">'
    + d.map((x) => '<div style="margin:4px 0">第 ' + x.order + ' 手：' + chip(x.char)
      + ' <span class="pill">' + fmt(x.value) + '</span>'
      + (x.solid ? ' <span class="pill good">救人位</span>' : "")
      + (x.pos && x.pos.length ? ' <span class="pill">' + esc(x.pos.join(" / ")) + "</span>" : "")
      + "</div>").join("")
    + "</div></section>";
}

function treeCard(c) {
  return '<section class="card"><h2><span class="num">5</span>后面博弈树怎么走</h2>'
    + '<p class="lead">按这条线一路走下去，最终期望逃脱 '
    + '<b>' + fmt(c.expect) + '</b>。阵容：' + chips(c.lineup) + "</p>"
    + lineTable(c)
    + stepsBlock(c)
    + treeBlock(c.tree)
    + "</section>";
}

function lineTable(c) {
  const rows = c.line || [];
  if (!rows.length) return "";
  return '<div class="tablewrap"><table><thead><tr><th>阶段</th><th>动作</th>'
    + '<th>角色</th><th class="num">评估</th></tr></thead><tbody>'
    + rows.map((x) => '<tr><td>' + esc(x.stage) + " " + esc(x.name) + "</td>"
      + '<td>' + (x.stage === "⑩" ? "选" : (x.name.indexOf("ban") >= 0 ? "ban" : "选")) + "</td>"
      + "<td>" + chip(x.char) + "</td>"
      + '<td class="num">' + fmt(x.value) + "</td></tr>").join("")
    + "</tbody></table></div>";
}

function stepsBlock(c) {
  const steps = c.steps || [];
  if (!steps.length) return "";
  return '<h3 style="font-size:13px;margin:16px 0 6px;color:var(--dim)">每一步的备选</h3>'
    + steps.map((s) => {
      const opts = s.options || [];
      return '<div style="margin:10px 0">'
        + "<div>" + esc(s.stage) + " " + esc(s.name)
        + ' <span class="pill">' + esc(s.actor) + "</span> 实际：" + chip(s.chosen) + "</div>"
        + opts.map((o) => {
          const w = o.delta === 0 ? 100 : Math.max(6, Math.min(100, 100 - Math.abs(o.delta) * 120));
          return '<div class="opt"><div style="min-width:150px">' + chip(o.char)
            + (o.chosen ? ' <span class="pill on">走这条</span>' : "")
            + (o.better ? ' <span class="pill good">更优</span>' : "")
            + '</div><div class="bar"><i' + (s.actor === "监管者" ? ' class="ban"' : "")
            + ' style="width:' + w + '%"></i></div>'
            + '<div style="min-width:78px;text-align:right;font-variant-numeric:tabular-nums">'
            + fmt(o.value) + " " + signed(o.delta) + "</div></div>";
        }).join("")
        + "</div>";
    }).join("");
}

function treeBlock(tree) {
  if (!tree || !tree.nodes || !tree.nodes.length) return "";
  return '<h3 style="font-size:13px;margin:16px 0 6px;color:var(--dim)">展开的博弈树</h3>'
    + '<div class="tree">' + node(tree) + "</div>";
}

function node(layer) {
  let h = "<div><b>" + esc(layer.stage) + " " + esc(layer.name) + "</b>"
    + ' <span class="pill">' + esc(layer.actor) + "</span></div><ul>";
  for (const n of layer.nodes || []) {
    const d = n.delta === 0 ? "" : '<span class="d ' + (n.delta > 0 ? "up" : "down") + '">'
      + signed(n.delta) + "</span>";
    h += "<li>" + chip(n.char) + '<span class="v">' + fmt(n.value) + "</span>" + d;
    if (n.next) h += node(n.next);
    else if (n.more) h += ' <span class="more">…</span>';
    h += "</li>";
  }
  return h + "</ul>";
}

// ── 导入导出 ────────────────────────────────────────────
function exportJson() {
  if (!LAST) { ioMsg("还没有报告可导出", false, true); return; }
  const blob = new Blob([JSON.stringify(LAST, null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "bp_report_" + LAST.meta.team + "_" + LAST.meta.player
    + "_g" + LAST.meta.game + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  ioMsg("已导出", true);
}

function importJson(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const r = JSON.parse(fr.result);
      if (!r || !r.meta || !Array.isArray(r.combos)) {
        throw new Error("不是报告 JSON");
      }
      LAST = r;
      CUR = 0;
      $("#formCard").classList.remove("hidden");
      render();
      ioMsg("已导入：" + r.meta.team + " / " + r.meta.player
        + " 第 " + r.meta.game + " 局", true);
    } catch (e) {
      ioMsg("导入失败：" + e.message, false, true);
    }
  };
  fr.readAsText(file, "utf-8");
}

// ── 数字格式 ────────────────────────────────────────────
const fmt = (v) => (v === null || v === undefined || Number.isNaN(v))
  ? "—" : Number(v).toFixed(4);
const signed = (v) => (v === null || v === undefined) ? "—"
  : ((v > 0 ? "+" : "") + Number(v).toFixed(4));
const pct = (v) => (v === null || v === undefined) ? "—"
  : (v * 100).toFixed(1) + "%";

// ── 绑定 ────────────────────────────────────────────────
$("#btnRun").onclick = run;
$("#btnExport").onclick = exportJson;
$("#fileImport").onchange = (e) => {
  const f = e.target.files && e.target.files[0];
  if (f) importJson(f);
  e.target.value = "";
};

boot();

</script>
</body>
</html>
